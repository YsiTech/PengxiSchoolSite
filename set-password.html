<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>设置密码 · 蓬溪格勒人民高等中学</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
</head>
<body data-page="reset">

<div class="auth-page">

  <header class="auth-topbar">
    <a class="auth-back" href="index.html">
      <span class="ar">←</span>
      <span>返回登录</span>
    </a>
    <span class="auth-topbar-title">设置密码</span>
  </header>

  <main class="auth-main">

    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-logo">
          <img src="photo/logo.png" alt="蓬溪格勒人民高等中学">
        </div>
        <h1>蓬溪格勒人民高等中学</h1>
        <p class="auth-brand-sub">设置你的登录密码</p>
      </div>

      <!-- 状态 1：输入新密码 -->
      <div id="stateSet">

        <div class="auth-intro">
          <h2>设置新密码</h2>
          <p>请为你的账号设置一个登录密码，设置完成后即可使用该密码登录。</p>
        </div>

        <form id="setForm" novalidate>

          <div class="auth-field">
            <label for="sPassword">新密码</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">🔒</span>
              <input id="sPassword" type="password" placeholder="至少 6 位" autocomplete="new-password">
              <button class="auth-eye" type="button" data-for="sPassword" aria-label="显示密码">👁</button>
            </div>
          </div>

          <div class="auth-field">
            <label for="sPassword2">确认新密码</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">🔒</span>
              <input id="sPassword2" type="password" placeholder="再次输入新密码" autocomplete="new-password">
              <button class="auth-eye" type="button" data-for="sPassword2" aria-label="显示密码">👁</button>
            </div>
          </div>

          <div class="auth-hint" id="setHint"></div>

          <button class="auth-submit" type="submit">
            <span class="auth-submit-text">保存密码</span>
          </button>

        </form>

        <div class="auth-tips">
          <p><b>温馨提示</b></p>
          <ul>
            <li>密码至少 6 位，建议包含字母和数字</li>
            <li>设置后请牢记，用于后续登录</li>
            <li>如果链接已过期，请<a href="forgot-password.html">重新获取</a></li>
          </ul>
        </div>

      </div>

      <!-- 状态 2：设置成功 -->
      <div id="stateDone" class="hide">
        <div class="auth-success">
          <div class="auth-success-icon">✓</div>
          <h2>密码已设置</h2>
          <p>请使用新密码登录校园服务平台。</p>
        </div>
        <div style="margin-top:22px;text-align:center">
          <a href="index.html" style="display:inline-block;padding:12px 32px;background:#c8102e;color:#fff;border-radius:10px;text-decoration:none;font-weight:600;letter-spacing:1px">去登录</a>
        </div>
      </div>

    </div>

    <p class="auth-copyright">
      © <span id="year"></span> 蓬溪格勒人民高等中学 · 技术支持：亚斯红日网络科技中心
    </p>

  </main>

</div>

<script>
(function () {
  'use strict';

  document.getElementById('year').textContent = new Date().getFullYear();

  if (!window.Auth || !Auth.client) {
    console.error('[set-pwd] Auth 模块未加载');
    return;
  }
  var client = Auth.client;

  var stateSet  = document.getElementById('stateSet');
  var stateDone = document.getElementById('stateDone');

  /* 密码显隐 */
  document.querySelectorAll('.auth-eye').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.for);
      if (!input) return;
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.textContent = showing ? '👁' : '🙈';
      input.focus();
    });
  });

  function setHint(msg, type) {
    var el = document.getElementById('setHint');
    if (!el) return;
    el.textContent = msg || '';
    el.className = 'auth-hint' + (type ? ' ' + type : '');
  }

  function setLoading(btn, on, text) {
    if (!btn) return;
    if (on) { btn.disabled = true; btn.classList.add('loading'); if (text) btn.textContent = text; }
    else    { btn.disabled = false; btn.classList.remove('loading'); if (text) btn.textContent = text; }
  }

  /* 检查会话状态 */
  client.auth.getSession().then(function (res) {
    var session = res && res.data && res.data.session;
    if (!session) {
      /* 没有会话，说明用户不是通过邮件链接来的 */
      setHint('未检测到验证会话，请通过邮件里的链接访问本页面', 'warn');
      console.warn('[set-pwd] 无会话');
    } else {
      console.log('[set-pwd] 会话就绪:', session.user.id);
    }
  });

  /* 提交新密码 */
  var form = document.getElementById('setForm');
  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      var p1 = document.getElementById('sPassword').value || '';
      var p2 = document.getElementById('sPassword2').value || '';

      setHint('', '');

      if (p1.length < 6) { setHint('密码至少 6 位', 'warn'); return; }
      if (p1 !== p2)     { setHint('两次输入的密码不一致', 'warn'); return; }

      var btn = form.querySelector('.auth-submit');
      setLoading(btn, true, '提交中…');
      setHint('正在保存…', '');

      client.auth.updateUser({ password: p1 }).then(function (res) {
        setLoading(btn, false, '保存密码');

        if (res.error) {
          console.error('[set-pwd] updateUser 失败:', res.error);
          var msg = String(res.error.message || '');
          if (/session|not authenticated|jwt/i.test(msg)) {
            setHint('验证会话已过期，请返回登录页重新操作', 'warn');
          } else if (/same|different/i.test(msg)) {
            setHint('新密码不能与旧密码相同', 'warn');
          } else {
            setHint(msg || '保存失败', 'warn');
          }
          return;
        }

        console.log('[set-pwd] 密码已更新');
        stateSet.classList.add('hide');
        stateDone.classList.remove('hide');
      }).catch(function (err) {
        console.error('[set-pwd] 异常:', err);
        setLoading(btn, false, '保存密码');
        setHint('网络错误，请稍后重试', 'warn');
      });
    });
  }

})();
</script>

</body>
</html>
