<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>找回密码 · 蓬溪格勒人民高等中学</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body data-page="reset">

<div class="auth-page">

  <header class="auth-topbar">
    <a class="auth-back" href="index.html">
      <span class="ar">←</span>
      <span>返回登录</span>
    </a>
    <span class="auth-topbar-title">找回密码</span>
  </header>

  <main class="auth-main">

    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-logo"><span class="star">★</span></div>
        <h1>蓬溪格勒人民高等中学</h1>
        <p class="auth-brand-sub">密码找回 · 安全验证</p>
      </div>

      <!-- ==================== 状态 1：输入邮箱 ==================== -->
      <div id="stateEmail">

        <div class="auth-intro">
          <h2>找回密码</h2>
          <p>请输入注册时使用的邮箱，我们会发送一封密码重置邮件给你。</p>
        </div>

        <form id="forgotForm" novalidate>
          <div class="auth-field">
            <label for="forgotEmail">注册邮箱</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">@</span>
              <input id="forgotEmail" type="email" placeholder="请输入注册邮箱"
                     autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false">
            </div>
          </div>

          <div class="auth-hint" id="forgotHint"></div>

          <button class="auth-submit" type="submit">
            <span class="auth-submit-text">发送重置邮件</span>
          </button>
        </form>

        <div class="auth-tips">
          <p><b>温馨提示</b></p>
          <ul>
            <li>邮件发送可能需要 1-2 分钟，请耐心等待</li>
            <li>若未收到，请检查垃圾邮件文件夹</li>
            <li>重置链接有效期 1 小时</li>
          </ul>
        </div>
      </div>

      <!-- ==================== 状态 2：设置新密码 ==================== -->
      <div id="stateReset" class="hide">

        <div class="auth-intro">
          <h2>设置新密码</h2>
          <p>请为你的账号设置一个新密码，设置完成后即可使用新密码登录。</p>
        </div>

        <form id="resetForm" novalidate>
          <div class="auth-field">
            <label for="newPassword">新密码</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">🔒</span>
              <input id="newPassword" type="password" placeholder="至少 6 位" autocomplete="new-password">
              <button class="auth-eye" type="button" data-for="newPassword" aria-label="显示密码">👁</button>
            </div>
          </div>

          <div class="auth-field">
            <label for="newPassword2">确认新密码</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">🔒</span>
              <input id="newPassword2" type="password" placeholder="再次输入新密码" autocomplete="new-password">
              <button class="auth-eye" type="button" data-for="newPassword2" aria-label="显示密码">👁</button>
            </div>
          </div>

          <div class="auth-hint" id="resetHint"></div>

          <button class="auth-submit" type="submit">
            <span class="auth-submit-text">保存新密码</span>
          </button>
        </form>
      </div>

      <!-- ==================== 状态 3：邮件已发送 ==================== -->
      <div id="stateSent" class="hide">

        <div class="auth-success">
          <div class="auth-success-icon">✓</div>
          <h2>重置邮件已发送</h2>
          <p>如果该邮箱已注册，你会在几分钟内收到密码重置邮件。</p>
          <p class="auth-success-email" id="sentEmail"></p>
          <p class="auth-success-tip">请打开邮件，点击其中的链接设置新密码。</p>
        </div>

        <div class="auth-actions-row">
          <a class="auth-btn-secondary" href="index.html">返回登录</a>
          <button class="auth-btn-secondary" type="button" id="resendBtn">重新发送</button>
        </div>

      </div>

    </div>

    <p class="auth-copyright">
      © <span id="year"></span> 蓬溪格勒人民高等中学 · 技术支持：亚斯红日网络科技中心
    </p>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/reset.js"></script>

</body>
</html>
