<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>重置密码 · 蓬溪格勒人民高等中学</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body data-page="reset">

<div class="auth-page">

  <header class="auth-topbar">
    <a class="auth-back" href="forgot-password.html">
      <span class="ar">←</span>
      <span>重新填写邮箱</span>
    </a>
    <span class="auth-topbar-title">重置密码</span>
  </header>

  <main class="auth-main">

    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-logo"><span class="star">★</span></div>
        <h1>蓬溪格勒人民高等中学</h1>
        <p class="auth-brand-ru">Понксиградская народная средняя школа высшей ступени</p>
        <p class="auth-brand-sub">密码重置 · 安全验证</p>
      </div>

      <!-- 步骤指示 -->
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px;">
        <div style="display:flex;align-items:center;gap:8px;opacity:.5;">
          <span style="width:26px;height:26px;border-radius:50%;background:#e4dccb;color:#6b6256;display:grid;place-items:center;font-size:13px;font-weight:700;">1</span>
          <span style="font-size:13px;color:#6b6256;font-weight:600;">填写邮箱</span>
        </div>
        <span style="width:32px;height:1px;background:#c8102e;"></span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="width:26px;height:26px;border-radius:50%;background:#c8102e;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;">2</span>
          <span style="font-size:13px;color:#c8102e;font-weight:600;">输入验证码</span>
        </div>
      </div>

      <!-- 状态 1：输入验证码 + 新密码 -->
      <div id="stateVerify">

        <div class="auth-intro">
          <h2>输入邮件里的验证码</h2>
          <p>验证码已发送到 <b id="displayEmail" style="color:#c8102e;">你的邮箱</b></p>
          <p style="font-size:12.5px;color:#a89e8e;margin-top:6px;">没收到？请检查垃圾邮件，或返回上一步重新发送</p>
        </div>

        <form id="verifyForm" novalidate>

          <div class="auth-field">
            <label for="vToken">6 位验证码</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">#</span>
              <input id="vToken" type="text" placeholder="邮件里的 6 位数字"
                     maxlength="6" inputmode="numeric" autocomplete="one-time-code">
            </div>
          </div>

          <div class="auth-field">
            <label for="vPassword">新密码</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">🔒</span>
              <input id="vPassword" type="password" placeholder="至少 6 位" autocomplete="new-password">
              <button class="auth-eye" type="button" data-for="vPassword" aria-label="显示密码">👁</button>
            </div>
          </div>

          <div class="auth-field">
            <label for="vPassword2">确认新密码</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">🔒</span>
              <input id="vPassword2" type="password" placeholder="再次输入新密码" autocomplete="new-password">
              <button class="auth-eye" type="button" data-for="vPassword2" aria-label="显示密码">👁</button>
            </div>
          </div>

          <div class="auth-hint" id="verifyHint"></div>

          <button class="auth-submit" type="submit">
            <span class="auth-submit-text">验证并重置密码</span>
          </button>
        </form>

        <div class="auth-tips">
          <p><b>遇到问题？</b></p>
          <ul>
            <li>验证码 1 小时内有效</li>
            <li>多次尝试会触发限速，请稍等再试</li>
            <li>如果邮箱填错了，<a href="forgot-password.html">返回上一步</a>重新填写</li>
          </ul>
        </div>
      </div>

      <!-- 状态 2：成功 -->
      <div id="stateSuccess" class="hide">
        <div class="auth-success">
          <div class="auth-success-icon">✓</div>
          <h2>密码已重置</h2>
          <p>请使用新密码登录。</p>
        </div>

        <div style="margin-top:22px;text-align:center">
          <a href="index.html" style="display:inline-block;padding:12px 32px;background:#c8102e;color:#fff;border-radius:10px;text-decoration:none;font-weight:600;letter-spacing:1px">去登录</a>
        </div>
      </div>

    </div>

    <p class="auth-copyright">
      © <span id="year"></span> 蓬溪格勒人民高等中学 · 技术支持：亚斯红日网络科技中心
    </p>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/reset.js"></script>

</body>
</html>
