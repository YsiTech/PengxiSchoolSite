<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>群聊 · 蓬溪格勒人民高等中学</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/friends.css">
<link rel="stylesheet" href="assets/css/blog.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
</head>
<body data-page="friends">

<div id="site-header"></div>

<section class="page-hero">
  <div class="page-hero-inner">
    <div class="crumb"><a href="mainsite.html">首页</a><i>›</i><a href="friends.html">我的好友</a><i>›</i><span>群聊</span></div>
    <div class="friends-hero-row">
      <div>
        <h1>群聊</h1>
        <p>创建群组、邀请好友、一起聊天</p>
      </div>
      <a class="friends-hero-btn ghost" href="friends.html">
        <span class="ic">←</span>
        <span>返回好友</span>
      </a>
    </div>
  </div>
</section>

<main class="section group-main">
  <div class="group-grid">

    <aside class="group-side">
      <div class="group-side-head">
        <h3>我的群组</h3>
        <button id="createRoomBtn" type="button">+ 创建</button>
      </div>
      <div class="group-list" id="groupList">
        <div class="friends-loading" style="padding:20px">正在加载…</div>
      </div>
    </aside>

    <section class="group-main-box" id="groupMainBox">

      <div class="group-empty" id="groupEmpty">
        <div>
          <div style="font-size:44px;margin-bottom:14px;opacity:.55">💬</div>
          <div style="font-size:15px;color:var(--blue);font-weight:600;margin-bottom:6px">还没有选择群组</div>
          <div style="font-size:13px">从左侧选择一个群，或点击"+ 创建"新建</div>
        </div>
      </div>

      <div class="group-head hide" id="groupHead">
        <div class="group-head-info">
          <b id="groupTitle">—</b>
          <span id="groupMeta">—</span>
        </div>
        <button id="inviteBtn" type="button">邀请</button>
        <button id="leaveRoomBtn" type="button">退出</button>
      </div>

      <div class="chat-messages hide" id="groupMessages" style="flex:1;background:#f7f4ec"></div>

      <form class="chat-input-row hide" id="groupForm">
        <button type="button" class="chat-img-btn" id="groupImageBtn" title="发送图片">🖼</button>
        <input type="file" id="groupImageInput" accept="image/*" style="display:none">
        <textarea id="groupInput" rows="1" placeholder="输入消息，Enter 发送" maxlength="1000"></textarea>
        <button type="submit" id="groupSendBtn">发送</button>
      </form>

    </section>

  </div>
</main>

<div id="site-footer"></div>

<!-- 创建群弹窗 -->
<div class="blog-publish-modal hide" id="createModal">
  <div class="blog-publish-box" style="max-width:480px">
    <div class="blog-publish-head">
      <h3>创建群组</h3>
      <button class="blog-publish-close" id="createClose" type="button">✕</button>
    </div>
    <form class="blog-publish-form" id="createForm">
      <div class="blog-publish-field">
        <label for="roomName">群名称 <span class="req">*</span></label>
        <input id="roomName" type="text" maxlength="30" placeholder="如：惊鸿十二班" required>
      </div>
      <div class="blog-publish-field">
        <label>选择好友加入（可多选）</label>
        <div class="picker-grid" id="friendPicker">
          <div class="friends-loading" style="padding:14px">正在加载好友…</div>
        </div>
      </div>
      <div class="blog-publish-hint" id="createHint"></div>
      <div class="blog-publish-actions">
        <button class="blog-publish-cancel" type="button" id="createCancel">取消</button>
        <button class="blog-publish-submit" type="submit">创建</button>
      </div>
    </form>
  </div>
</div>

<!-- 邀请好友弹窗 -->
<div class="blog-publish-modal hide" id="inviteModal">
  <div class="blog-publish-box" style="max-width:480px">
    <div class="blog-publish-head">
      <h3>邀请好友</h3>
      <button class="blog-publish-close" id="inviteClose" type="button">✕</button>
    </div>
    <form class="blog-publish-form" id="inviteForm">
      <div class="blog-publish-field">
        <label>选择要邀请的好友（可多选）</label>
        <div class="picker-grid" id="invitePicker">
          <div class="friends-loading" style="padding:14px">正在加载好友…</div>
        </div>
      </div>
      <div class="blog-publish-hint" id="inviteHint"></div>
      <div class="blog-publish-actions">
        <button class="blog-publish-cancel" type="button" id="inviteCancel">取消</button>
        <button class="blog-publish-submit" type="submit">邀请</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/main.js"></script>
<script src="assets/js/rooms.js"></script>

</body>
</html>
