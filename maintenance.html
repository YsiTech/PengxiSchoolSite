<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/png" href="photo/logo.png">
<link rel="apple-touch-icon" href="photo/logo.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面维护中 · 蓬溪格勒人民高等中学</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.maint-page{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
  text-align:center;
  background:
    radial-gradient(1200px 500px at 85% -10%,rgba(212,175,55,.18),transparent 60%),
    linear-gradient(140deg,#1a2b4c 0%,#243b63 45%,#8a0c22 100%),
    repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.05) 38px 39px);
  color:#fff;
  position:relative;
  overflow:hidden;
}
.maint-page::after{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 22%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.2px 1.2px at 62% 68%,rgba(255,255,255,.45),transparent),
    radial-gradient(1.5px 1.5px at 88% 30%,rgba(255,255,255,.5),transparent);
}
.maint-box{
  position:relative;
  z-index:2;
  max-width:480px;
  width:100%;
}
.maint-logo{
  width:88px;height:88px;
  margin:0 auto 24px;
  border-radius:50%;
  background:#fff;
  padding:6px;
  box-sizing:content-box;
  box-shadow:0 0 0 3px #d4af37,0 10px 30px rgba(0,0,0,.3);
  overflow:hidden;
}
.maint-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.maint-title{
  margin:0 0 12px;
  font-size:26px;
  letter-spacing:4px;
  font-weight:800;
  color:#fff;
}
.maint-sub{
  margin:0 0 30px;
  font-size:14px;
  color:#efe2c6;
  letter-spacing:.5px;
  line-height:1.8;
}
.maint-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 26px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(212,175,55,.55);
  color:#f0d98a;
  font-size:14px;
  letter-spacing:2px;
  margin-bottom:26px;
}
.maint-badge .dot{
  width:8px;height:8px;border-radius:50%;background:#f0d98a;
  animation:maintBlink 1.4s ease-in-out infinite;
}
@keyframes maintBlink{0%,100%{opacity:1}50%{opacity:.25}}
.maint-count{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:48px;
  font-weight:800;
  color:#f0d98a;
  letter-spacing:4px;
  line-height:1;
  margin-bottom:8px;
}
.maint-count-label{
  font-size:12.5px;
  color:rgba(255,255,255,.55);
  letter-spacing:3px;
  margin-bottom:30px;
}
.maint-btn{
  display:inline-block;
  padding:12px 30px;
  border-radius:10px;
  background:var(--gold);
  color:#241b08;
  font-weight:700;
  font-size:14.5px;
  letter-spacing:1.5px;
  border:0;
  cursor:pointer;
  text-decoration:none;
  transition:transform .18s,box-shadow .2s,background .2s;
  box-shadow:0 8px 22px rgba(212,175,55,.35);
}
.maint-btn:hover{background:#e5c455;transform:translateY(-2px);box-shadow:0 12px 28px rgba(212,175,55,.45)}
.maint-btn:active{transform:translateY(0) scale(.98)}
.maint-foot{
  margin-top:30px;
  font-size:12px;
  color:rgba(255,255,255,.4);
  letter-spacing:.5px;
  line-height:1.8;
}
@media (max-width:520px){
  .maint-logo{width:72px;height:72px}
  .maint-title{font-size:20px;letter-spacing:2px}
  .maint-sub{font-size:13px}
  .maint-count{font-size:38px}
}
</style>
</head>
<body>

<div class="maint-page">
  <div class="maint-box">

    <div class="maint-logo">
      <img src="photo/logo.png" alt="蓬溪格勒人民高等中学">
    </div>

    <h1 class="maint-title">俄语版维护中</h1>
    <p class="maint-sub">
      我们正在对俄语版本进行升级与校对，<br>
      给您带来的不便，敬请谅解。
    </p>

    <div class="maint-badge">
      <span class="dot"></span>
      <span>РУССКАЯ ВЕРСИЯ НА ОБСЛУЖИВАНИИ</span>
    </div>

    <div class="maint-count" id="maintCount">5</div>
    <div class="maint-count-label">秒 后 自 动 返 回 主 页</div>

    <a class="maint-btn" href="mainsite.html">立即返回主页</a>

    <div class="maint-foot">
      © 蓬溪格勒人民高等中学 · 技术支持：亚斯红日网络科技中心
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  var count = 5;
  var countEl = document.getElementById('maintCount');

  function goBack() {
    location.replace('mainsite.html');
  }

  var timer = setInterval(function () {
    count--;
    if (countEl) countEl.textContent = count;
    if (count <= 0) {
      clearInterval(timer);
      goBack();
    }
  }, 1000);

})();
</script>

</body>
</html>
