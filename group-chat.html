<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>群聊 · 蓬溪格勒人民高等中学</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/friends.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
<style>
/* 群聊头部按钮 */
.gc-chat-head .gc-head-actions{
  margin-left:auto;
  display:flex;
  gap:8px;
  align-items:center;
}
.gc-head-btn{
  padding:6px 14px;
  border-radius:8px;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink-soft);
  font-family:inherit;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.4px;
  cursor:pointer;
  transition:all .18s;
  white-space:nowrap;
}
.gc-head-btn:hover{
  border-color:var(--red);
  color:var(--red);
}
.gc-head-btn.danger{
  color:#c8102e;
  border-color:#f6cdd5;
}
.gc-head-btn.danger:hover{
  background:#fdecef;
}
.gc-head-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* 邀请弹窗 */
.gc-invite-modal{
  position:fixed;inset:0;z-index:9999;
  background:rgba(26,43,76,.7);
  display:grid;place-items:center;padding:20px;
  animation:previewIn .2s ease;
}
.gc-invite-modal.hide{display:none}
.gc-invite-box{
  background:#fff;border-radius:14px;padding:24px;
  max-width:420px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  max-height:88vh;overflow-y:auto;
}
.gc-invite-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
}
.gc-invite-head b{font-size:16px;color:var(--blue);letter-spacing:1px}
.gc-invite-close{
  border:0;background:transparent;font-size:18px;
  cursor:pointer;color:var(--muted);
  width:32px;height:32px;border-radius:50%;
}
.gc-invite-close:hover{background:var(--red-soft);color:var(--red)}
.gc-invite-list{
  max-height:300px;overflow-y:auto;
  border:1px solid var(--line);border-radius:8px;padding:6px;
  margin-bottom:16px;
}
.gc-invite-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:6px;
  cursor:pointer;font-size:13.5px;
  transition:background .15s;
}
.gc-invite-item:hover{background:var(--red-soft)}
.gc-invite-item input{margin:0;accent-color:var(--red)}
.gc-invite-item .ava{
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;color:#fff;
  font-size:11px;font-weight:700;flex:0 0 auto;
}
.gc-invite-item .ava img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.gc-invite-item .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-invite-item.already{
  opacity:.5;
  cursor:not-allowed;
}
.gc-invite-item.already:hover{background:transparent}
.gc-invite-empty{
  text-align:center;padding:24px;color:var(--muted);font-size:13px;
}
.gc-invite-actions{
  display:flex;gap:10px;justify-content:flex-end;
}
</style>
</head>
<body data-page="friends">

<div id="site-header"></div>

<section class="page-hero">
  <div class="page-hero-inner">
    <div class="crumb"><a href="mainsite.html">首页</a><i>›</i><a href="friends.html">我的好友</a><i>›</i><span>群聊</span></div>
    <h1>群聊</h1>
    <p>和多位好友一起聊天</p>
  </div>
</section>

<main class="section gc-main">

  <div class="gc-layout">

    <!-- 左侧：群列表 -->
    <aside class="gc-side">
      <div class="gc-side-head">
        <span>我的群</span>
        <button class="gc-create-btn" id="gcCreateBtn" type="button">+ 创建</button>
      </div>
      <div class="gc-room-list" id="roomList">
        <div class="gc-empty">加载中…</div>
      </div>
    </aside>

    <!-- 右侧：群消息 -->
    <section class="gc-chat">
      <div class="gc-chat-head">
        <b id="gcHeader">未选择群</b>
        <span class="gc-member-count" id="gcMemberCount">0</span> 人
        <div class="gc-head-actions" id="gcHeadActions" style="display:none">
          <button class="gc-head-btn" id="gcInviteBtn" type="button">+ 邀请</button>
          <button class="gc-head-btn danger" id="gcLeaveBtn" type="button">退出群聊</button>
        </div>
      </div>
      <div class="gc-messages chat-messages" id="gcMessages">
        <div class="gc-empty">从左侧选择一个群</div>
      </div>
      <form class="chat-input-row" id="gcForm">
        <button class="chat-icon-btn" id="gcImageBtn" type="button">🖼</button>
        <input type="file" id="gcImageInput" accept="image/*" style="display:none">
        <textarea id="gcInput" rows="1" placeholder="输入消息…" maxlength="1000"></textarea>
        <button type="submit" id="gcSendBtn">发送</button>
      </form>
    </section>

  </div>

</main>

<!-- 创建群弹窗 -->
<div class="gc-modal hide" id="gcCreateModal">
  <div class="gc-modal-box">
    <div class="gc-modal-head">
      <b>创建新群</b>
      <button class="gc-modal-close" id="gcCreateClose" type="button">✕</button>
    </div>
    <form id="gcCreateForm">
      <div class="gc-field">
        <label for="gcGroupName">群名称</label>
        <input id="gcGroupName" type="text" maxlength="30" placeholder="给群取个名字" required>
      </div>
      <div class="gc-field">
        <label>邀请好友（可多选）</label>
        <div class="gc-friend-picker" id="gcFriendPicker"></div>
      </div>
      <div class="gc-modal-actions">
        <button class="f-btn" type="button" id="gcCreateCancel">取消</button>
        <button class="f-btn f-btn-primary" type="submit">创建</button>
      </div>
    </form>
  </div>
</div>

<!-- 邀请好友弹窗 -->
<div class="gc-invite-modal hide" id="gcInviteModal">
  <div class="gc-invite-box">
    <div class="gc-invite-head">
      <b>邀请好友加入</b>
      <button class="gc-invite-close" id="gcInviteClose" type="button">✕</button>
    </div>
    <div class="gc-invite-list" id="gcInviteList"></div>
    <div class="gc-invite-actions">
      <button class="f-btn" type="button" id="gcInviteCancel">取消</button>
      <button class="f-btn f-btn-primary" type="button" id="gcInviteConfirm">确认邀请</button>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/main.js"></script>
<script src="assets/js/group-chat.js"></script>

</body>
</html>
