<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/png" href="photo/logo.png">
<link rel="apple-touch-icon" href="photo/logo.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>找回密码 · 蓬溪格勒人民高等中学</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body data-page="reset">

<div class="auth-page">

  <header class="auth-topbar">
    <a class="auth-back" href="index.html">
      <span class="ar">←</span>
      <span>返回登录</span>
    </a>
    <span class="auth-topbar-title">找回密码</span>
  </header>

  <main class="auth-main">

    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-logo"><span class="star">★</span></div>
        <h1>蓬溪格勒人民高等中学</h1>
        <p class="auth-brand-ru">Понксиградская народная средняя школа высшей ступени</p>
        <p class="auth-brand-sub">密码找回 · 安全验证</p>
      </div>

      <!-- 步骤指示 -->
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="width:26px;height:26px;border-radius:50%;background:#c8102e;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;">1</span>
          <span style="font-size:13px;color:#c8102e;font-weight:600;">填写邮箱</span>
        </div>
        <span style="width:32px;height:1px;background:#e4dccb;"></span>
        <div style="display:flex;align-items:center;gap:8px;opacity:.5;">
          <span style="width:26px;height:26px;border-radius:50%;background:#e4dccb;color:#6b6256;display:grid;place-items:center;font-size:13px;font-weight:700;">2</span>
          <span style="font-size:13px;color:#6b6256;font-weight:600;">输入验证码</span>
        </div>
      </div>

      <div class="auth-intro">
        <h2>找回密码</h2>
        <p>请输入注册时使用的邮箱，我们会发送一封包含 6 位验证码的邮件给你。</p>
      </div>

      <form id="forgotForm" novalidate>

        <div class="auth-field">
          <label for="fEmail">注册邮箱</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">@</span>
            <input id="fEmail" type="email" placeholder="请输入注册邮箱"
                   autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false">
          </div>
        </div>

        <div class="auth-hint" id="forgotHint"></div>

        <button class="auth-submit" type="submit">
          <span class="auth-submit-text">发送验证码</span>
        </button>
      </form>

      <div class="auth-tips">
        <p><b>温馨提示</b></p>
        <ul>
          <li>验证码会发送到你注册时使用的邮箱</li>
          <li>邮件可能延迟 1-5 分钟，请耐心等待</li>
          <li>若未收到，请检查垃圾邮件文件夹</li>
          <li>发件人：<code>ponxi-school@mail.ponxigrad.tech</code></li>
        </ul>
      </div>

    </div>

    <p class="auth-copyright">
      © <span id="year"></span> 蓬溪格勒人民高等中学 · 技术支持：亚斯红日网络科技中心
    </p>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/forgot.js"></script>

</body>
</html>
