<!doctype html>
<html lang="zh-CN">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>统一身份认证 · 蓬溪格勒人民高等中学</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body data-page="login">

<div class="auth-page">

  <header class="auth-topbar">
    <a class="auth-back" href="mainsite.html">
      <span class="ar">←</span>
      <span>返回首页</span>
    </a>
    <span class="auth-topbar-title">统一身份认证</span>
  </header>

  <main class="auth-main">

    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-logo"><span class="star">★</span></div>
        <h1>蓬溪格勒人民高等中学</h1>
        <p class="auth-brand-ru">Понксиградская народная средняя школа высшей ступени</p>
        <p class="auth-brand-sub">亚斯共和国教育部统一身份认证 · 校园服务平台</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab on" data-tab="login" type="button" role="tab">登录</button>
        <button class="auth-tab" data-tab="register" type="button" role="tab">注册</button>
      </div>

      <!-- ==================== 登录 ==================== -->
      <form class="auth-form on" id="loginForm" novalidate>

        <div class="auth-field">
          <label for="loginEmail">邮箱</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">@</span>
            <input id="loginEmail" type="email" placeholder="请输入注册邮箱"
                   autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">
          </div>
        </div>

        <div class="auth-field">
          <label for="loginPassword">密码</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">🔒</span>
            <input id="loginPassword" type="password" placeholder="请输入密码" autocomplete="current-password">
            <button class="auth-eye" type="button" data-for="loginPassword" aria-label="显示密码">👁</button>
          </div>
        </div>

        <div class="auth-row-inline">
          <label class="auth-remember">
            <input id="rememberMe" type="checkbox">
            <span>记住我</span>
          </label>
          <a class="auth-forgot" href="reset-password.html">忘记密码？</a>
        </div>

        <div class="auth-hint" id="loginHint"></div>

        <button class="auth-submit" type="submit">
          <span class="auth-submit-text">登 录</span>
        </button>
      </form>

      <!-- ==================== 注册 ==================== -->
      <form class="auth-form" id="registerForm" novalidate>

        <div class="auth-field">
          <label for="regEmail">邮箱</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">@</span>
            <input id="regEmail" type="email" placeholder="用于登录和找回密码"
                   autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false">
          </div>
        </div>

        <div class="auth-field">
          <label for="regNickname">昵称</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">👤</span>
            <input id="regNickname" type="text" placeholder="用于页面显示" maxlength="16" autocomplete="nickname">
          </div>
        </div>

        <div class="auth-field">
          <label for="regPassword">密码</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">🔒</span>
            <input id="regPassword" type="password" placeholder="至少 6 位" autocomplete="new-password">
            <button class="auth-eye" type="button" data-for="regPassword" aria-label="显示密码">👁</button>
          </div>
        </div>

        <div class="auth-field">
          <label for="regPassword2">确认密码</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">🔒</span>
            <input id="regPassword2" type="password" placeholder="再次输入密码" autocomplete="new-password">
            <button class="auth-eye" type="button" data-for="regPassword2" aria-label="显示密码">👁</button>
          </div>
        </div>

        <div class="auth-hint" id="registerHint"></div>

        <button class="auth-submit" type="submit">
          <span class="auth-submit-text">创建账号</span>
        </button>

        <p class="auth-terms">
          注册即表示同意 <a href="#" onclick="return false;">《校园网服务协议》</a> 与 <a href="#" onclick="return false;">《隐私政策》</a>
        </p>
      </form>

      <div class="auth-divider"><span>或</span></div>

      <button class="auth-guest" id="guestBtn" type="button">
        <span class="auth-guest-icon">☆</span>
        <span>游客登录 · 免注册体验</span>
      </button>

      <p class="auth-guest-tip">游客身份仅供体验，可随时升级为正式账号</p>

      <div class="auth-foot">
        登录后可访问 <b>视觉蓬中</b> · <b>校园网订购</b> · <b>星图</b>
      </div>

    </div>

    <p class="auth-copyright">
      © <span id="year"></span> 蓬溪格勒人民高等中学 · 技术支持：亚斯红日网络科技中心
    </p>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/login.js"></script>

</body>
</html>
