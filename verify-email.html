<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>验证邮箱 · 蓬溪格勒人民高等中学</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
</head>
<body data-page="verify">

<div class="auth-page">

  <header class="auth-topbar">
    <a class="auth-back" href="index.html">
      <span class="ar">←</span>
      <span>返回登录</span>
    </a>
    <span class="auth-topbar-title">验证邮箱</span>
  </header>

  <main class="auth-main">

    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-logo">
          <img src="photo/logo.png" alt="蓬溪格勒人民高等中学">
        </div>
        <h1>蓬溪格勒人民高等中学</h1>
        <p class="auth-brand-sub">邮箱验证 · 完成注册</p>
      </div>

      <!-- 步骤指示 -->
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px;">
        <div style="display:flex;align-items:center;gap:8px;opacity:.5;">
          <span style="width:26px;height:26px;border-radius:50%;background:#e4dccb;color:#6b6256;display:grid;place-items:center;font-size:13px;font-weight:700;">1</span>
          <span style="font-size:13px;color:#6b6256;font-weight:600;">填写信息</span>
        </div>
        <span style="width:32px;height:1px;background:#c8102e;"></span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="width:26px;height:26px;border-radius:50%;background:#c8102e;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;">2</span>
          <span style="font-size:13px;color:#c8102e;font-weight:600;">验证邮箱</span>
        </div>
      </div>

      <div class="auth-intro">
        <h2>输入邮件里的验证码</h2>
        <p>验证码已发送到 <b id="displayEmail" style="color:#c8102e;">你的邮箱</b></p>
        <p style="font-size:12.5px;color:#a89e8e;margin-top:6px;">没收到？请检查垃圾邮件文件夹</p>
      </div>

      <form id="verifyForm" novalidate>

        <div class="auth-field">
          <label for="vToken">邮箱验证码</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">#</span>
            <input id="vToken" type="text" placeholder="请输入邮件里的 6 位验证码"
                   maxlength="6" inputmode="numeric" autocomplete="one-time-code"
                   style="letter-spacing:8px;font-size:20px;font-weight:700;text-align:center;">
          </div>
        </div>

        <div class="auth-hint" id="verifyHint"></div>

        <button class="auth-submit" type="submit">
          <span class="auth-submit-text">验证并完成注册</span>
        </button>
      </form>

      <div class="auth-divider"><span>或</span></div>

      <button class="auth-guest" id="resendBtn" type="button">
        <span class="auth-guest-icon">✉</span>
        <span id="resendText">重新发送验证码</span>
      </button>

      <p class="auth-guest-tip" id="resendTip">
        没收到？点上方按钮重新发送
      </p>

      <div class="auth-tips">
        <p><b>遇到问题？</b></p>
        <ul>
          <li>验证码 <b>24 小时</b>内有效</li>
          <li>邮件发件人：<code>ponxi-school@mail.ponxigrad.tech</code></li>
          <li>如果填错了邮箱，<a href="index.html">返回注册页重新填写</a></li>
        </ul>
      </div>

    </div>

    <p class="auth-copyright">
      © <span id="year"></span> 蓬溪格勒人民高等中学 · 技术支持：亚斯红日网络科技中心
    </p>

  </main>

</div>

<script>
(function () {
  'use strict';

  document.getElementById('year').textContent = new Date().getFullYear();

  if (!window.Auth || !Auth.client) {
    console.error('[verify] Auth 模块未加载');
    return;
  }

  var client = Auth.client;

  /* 从 sessionStorage 读取刚注册的邮箱和密码 */
  var email = '';
  var password = '';
  try {
    email = sessionStorage.getItem('pxgl_pending_email') || '';
    password = sessionStorage.getItem('pxgl_pending_password') || '';
  } catch (e) {}

  if (!email) {
    console.warn('[verify] 没有待验证邮箱，跳回注册页');
    location.replace('index.html');
    return;
  }

  var displayEmail = document.getElementById('displayEmail');
  if (displayEmail) displayEmail.textContent = email;

  function setHint(msg, type) {
    var el = document.getElementById('verifyHint');
    if (!el) return;
    el.textContent = msg || '';
    el.className = 'auth-hint' + (type ? ' ' + type : '');
  }

  function setLoading(btn, on, text) {
    if (!btn) return;
    if (on) { btn.disabled = true; btn.classList.add('loading'); if (text) btn.textContent = text; }
    else    { btn.disabled = false; btn.classList.remove('loading'); if (text) btn.textContent = text; }
  }

  /* ============================================================
     提交验证码
     ============================================================ */
  var form = document.getElementById('verifyForm');
  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      var token = (document.getElementById('vToken').value || '').trim();
      setHint('', '');

      if (!/^\d{6}$/.test(token)) {
        setHint('验证码是 6 位数字', 'warn');
        return;
      }

      var btn = form.querySelector('.auth-submit');
      setLoading(btn, true, '验证中…');
      setHint('正在验证…', '');

      /* 1. 验证注册 OTP */
      client.auth.verifyOtp({
        email: email,
        token: token,
        type: 'signup'
      }).then(function (res) {
        if (res.error) {
          console.error('[verify] verifyOtp 失败:', res.error);
          var msg = String(res.error.message || '');
          var userMsg = '验证失败';
          if (/expired/i.test(msg)) userMsg = '验证码已过期，请重新发送';
          else if (/invalid|token/i.test(msg)) userMsg = '验证码不正确';
          else if (/rate limit/i.test(msg)) userMsg = '请求过于频繁，请稍后再试';
          else userMsg = msg;
          setHint(userMsg, 'warn');
          setLoading(btn, false, '验证并完成注册');
          return;
        }

        /* 2. 验证成功，自动登录 */
        setHint('验证成功，正在登录…', 'ok');

        return client.auth.signInWithPassword({
          email: email,
          password: password
        }).then(function (signRes) {
          if (signRes.error) {
            /* 登录失败（密码可能已丢失），提示用户回登录页 */
            console.warn('[verify] 自动登录失败:', signRes.error);
            try {
              sessionStorage.removeItem('pxgl_pending_email');
              sessionStorage.removeItem('pxgl_pending_password');
            } catch (e) {}
            setHint('邮箱验证成功！请返回登录页使用你的密码登录', 'ok');
            setTimeout(function () {
              location.href = 'index.html';
            }, 2000);
            return;
          }

          /* 3. 登录成功，跳主页 */
          try {
            sessionStorage.removeItem('pxgl_pending_email');
            sessionStorage.removeItem('pxgl_pending_password');
          } catch (e) {}

          window.siteToast && window.siteToast('注册完成，欢迎加入校园平台');
          setTimeout(function () {
            location.href = 'mainsite.html';
          }, 600);
        });
      }).catch(function (err) {
        console.error('[verify] 异常:', err);
        setLoading(btn, false, '验证并完成注册');
        setHint('网络错误，请稍后重试', 'warn');
      });
    });
  }

  /* ============================================================
     重新发送验证码
     ============================================================ */
  var resendBtn = document.getElementById('resendBtn');
  var resendText = document.getElementById('resendText');

  if (resendBtn) {
    resendBtn.addEventListener('click', function () {
      if (!email) return;

      resendBtn.disabled = true;
      var oldText = resendText ? resendText.textContent : '';
      if (resendText) resendText.textContent = '发送中…';
      setHint('正在重新发送…', '');

      client.auth.resend({
        type: 'signup',
        email: email
      }).then(function (res) {
        if (res.error) {
          console.error('[verify] resend 失败:', res.error);
          var msg = res.error.message || '发送失败';
          if (/rate limit/i.test(msg)) msg = '发送过于频繁，请稍后再试';
          setHint(msg, 'warn');
          resendBtn.disabled = false;
          if (resendText) resendText.textContent = oldText;
          return;
        }

        setHint('验证码已重新发送到 ' + email, 'ok');

        /* 60 秒倒计时 */
        var countdown = 60;
        if (resendText) resendText.textContent = countdown + ' 秒后可重发';
        var t = setInterval(function () {
          countdown--;
          if (countdown <= 0) {
            clearInterval(t);
            resendBtn.disabled = false;
            if (resendText) resendText.textContent = oldText;
          } else {
            if (resendText) resendText.textContent = countdown + ' 秒后可重发';
          }
        }, 1000);
      }).catch(function (err) {
        console.error('[verify] 异常:', err);
        setHint('网络错误，请稍后重试', 'warn');
        resendBtn.disabled = false;
        if (resendText) resendText.textContent = oldText;
      });
    });
  }

})();
</script>

</body>
</html>
