<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交流中心 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .chat-wrap {
    display: flex;
    flex-direction: column;
    max-width: 900px;
    margin: 0 auto;
    height: calc(100vh - 180px);
    height: calc(100dvh - 180px);
    min-height: 420px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.2);
    gap: 12px;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scroll-behavior: smooth;
  }

  .msg-row { display: flex; gap: 12px; max-width: 80%; }
  .msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.other { align-self: flex-start; }

  .msg-avatar { width: 40px; height: 28px; border-radius: 4px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border-2); }

  .msg-content-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .msg-row.mine .msg-content-wrap { align-items: flex-end; }

  .msg-info { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .msg-info b { color: var(--gold-2); font-size: 12px; }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
    position: relative;
    background: var(--glass-2);
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .msg-row.mine .msg-bubble {
    background: linear-gradient(135deg, rgba(79,195,247,0.2), rgba(79,195,247,0.05));
    border-color: rgba(79,195,247,0.3);
    border-bottom-right-radius: 2px;
  }
  .msg-row.other .msg-bubble { border-bottom-left-radius: 2px; }
  .msg-bubble.recalled { background: transparent; border: 1px dashed var(--border-2); color: var(--muted); font-style: italic; }

  .msg-media { max-width: 300px; border-radius: 8px; margin-bottom: 8px; display: block; border: 1px solid var(--border); cursor: zoom-in; }
  audio.msg-media { width: 250px; cursor: default; }
  .file-attach {
    display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3);
    padding: 12px; border-radius: 8px; margin-bottom: 8px; text-decoration: none; color: #fff; border: 1px solid var(--border-2);
  }
  .file-attach:hover { border-color: var(--gold); }
  .file-attach i { font-size: 24px; color: var(--gold); }
  .file-attach .f-name { font-size: 13px; font-weight: bold; }
  .file-attach .f-size { font-size: 11px; color: var(--muted); }

  /* 撤回按钮：桌面 hover 显示，移动端常显 */
  .recall-btn {
    display: inline-block;
    font-size: 11px; color: var(--red); cursor: pointer;
    transition: 0.2s; margin-left: 8px; opacity: 0.7;
  }
  .recall-btn:hover { text-decoration: underline; opacity: 1; }
  @media (hover: hover) {
    .recall-btn { display: none; }
    .msg-row.mine:hover .recall-btn { display: inline-block; }
  }

  .chat-footer {
    padding: 16px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .chat-input-box {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border-2);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .chat-input-box:focus-within { border-color: var(--cyan); }

  .chat-input-box textarea {
    width: 100%;
    background: transparent;
    border: none;
    padding: 12px 16px;
    color: #fff;
    font-size: 14px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    font-family: inherit;
  }

  .chat-tools { display: flex; padding: 4px 12px 8px 12px; gap: 16px; color: var(--muted); align-items: center; }
  .chat-tools label { cursor: pointer; transition: 0.2s; font-size: 18px; }
  .chat-tools label:hover { color: var(--cyan); }

  .btn-send {
    height: 44px; width: 80px; border-radius: 12px;
    background: var(--cyan); color: #000; font-weight: bold; border: none; cursor: pointer;
    display: grid; place-items: center; transition: 0.2s;
  }
  .btn-send:hover:not(:disabled) { background: #fff; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79,195,247,0.4); }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

  .diplo-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--glass-2); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; }
  .diplo-item.war { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }

  @media (max-width: 640px) {
    .chat-wrap { height: calc(100dvh - 150px); border-radius: 12px; }
    .chat-header { padding: 12px 14px; }
    .chat-messages { padding: 14px 12px; gap: 12px; }
    .msg-row { max-width: 88%; }
    .msg-media { max-width: 220px; }
    audio.msg-media { width: 200px; }
    .chat-footer { padding: 10px; gap: 8px; }
    .btn-send { width: 52px; }
    .chat-tools { padding: 2px 10px 6px 10px; }
  }
</style>
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<main class="iecp-main">
  <div class="chat-wrap">

    <div class="chat-header">
      <div style="min-width:0">
        <h2 style="margin:0; font-size:18px; color:var(--ink);"><i class="fa-solid fa-comments" style="color:var(--gold);"></i> 国际交流大厅</h2>
        <p style="margin:0; font-size:12px; color:var(--muted);">遵守国际法，文明发言</p>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="openDiploModal()" style="flex-shrink:0">
        <i class="fa-solid fa-bell"></i> 外交事务 <span id="diploBadge" style="background:var(--red);color:#fff;padding:2px 6px;border-radius:10px;font-size:10px;margin-left:4px;display:none;">0</span>
      </button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="loading-state"><div class="spinner"></div><span>正在接入国际频道...</span></div>
    </div>

    <div class="chat-footer">
      <div class="chat-input-box">
        <textarea id="chatInput" placeholder="输入消息，支持附带多媒体文件..." oninput="autoResize(this)"></textarea>
        <div class="chat-tools">
          <label for="mediaFile" title="发送图片/视频/音频/文件"><i class="fa-solid fa-paperclip"></i></label>
          <input type="file" id="mediaFile" style="display:none" onchange="handleFileSelect()">
          <span id="fileHint" style="font-size:12px; color:var(--cyan); display:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
        </div>
      </div>
      <button class="btn-send" id="btnSend" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

  </div>
</main>

<div class="iecp-modal" id="diploModal">
  <div class="iecp-modal-box glass-2" style="max-width:440px">
    <h3><i class="fa-solid fa-envelope-open-text" style="color:var(--gold)"></i> 外交事务</h3>
    <p class="modal-sub">处理待办的外交请求。宣战通知仅作公示，无需接受。</p>
    <div id="diploList" style="max-height:60vh; overflow-y:auto; padding-right:4px;">
      <div style="text-align:center; padding:30px; color:var(--muted);">加载中...</div>
    </div>
    <div style="text-align:right; margin-top:20px;">
      <button class="btn btn-ghost" onclick="closeDiploModal()">关闭</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP;
  var profile = null;
  var selectedFile = null;
  var pollTimer = null;
  var diploTimer = null;
  var currentSig = '';
  var isDesktop = window.matchMedia('(pointer: fine)').matches;

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('diplomacy');
    I.getProfile(true).then(function (p) {
      if (!p) return;
      profile = p;
      bindEvents();
      loadMessages();
      loadDiplomacy();
      startPolling();
    });
  });

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(loadMessages, 5000);
    diploTimer = setInterval(loadDiplomacy, 10000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (diploTimer) { clearInterval(diploTimer); diploTimer = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopPolling();
    else { loadMessages(); loadDiplomacy(); startPolling(); }
  });

  function bindEvents() {
    var ta = I.$('#chatInput');
    if (isDesktop && ta) {
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          sendMessage();
        }
      });
    }
    var modal = I.$('#diploModal');
    if (modal) {
      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeDiploModal();
      });
    }
  }

  window.autoResize = function (el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  };

  window.handleFileSelect = function () {
    var file = I.$('#mediaFile').files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) { I.toast('文件不能超过 50MB', 'error'); I.$('#mediaFile').value = ''; return; }
    selectedFile = file;
    var hint = I.$('#fileHint');
    hint.textContent = '已选择: ' + file.name;
    hint.style.display = 'inline-block';
  };

  // ============ 消息加载 ============
  function loadMessages() {
    // 🚨 关键修复：必须降序取最新 50 条，再反转为升序渲染
    I.client.from('posts')
      .select('*, author:profiles(id, username, flag_url)')
      .order('created_at', { ascending: false })
      .limit(50)
      .then(function (res) {
        if (res.error) { console.error(res.error); return; }
        var list = (res.data || []).slice().reverse();
        var sig = list.map(function (m) { return m.id + (m.is_recalled ? 'r' : ''); }).join('|');
        if (sig === currentSig) return; // 无变化不重绘，避免闪烁
        currentSig = sig;
        renderMessages(list);
      });
  }

  function formatTime(iso) {
    try {
      var d = new Date(iso);
      var now = new Date();
      var hh = String(d.getHours()).padStart(2, '0');
      var mm = String(d.getMinutes()).padStart(2, '0');
      if (d.toDateString() === now.toDateString()) return hh + ':' + mm;
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hh + ':' + mm;
    } catch (e) { return ''; }
  }

  function renderMessages(list) {
    var wrap = I.$('#chatMessages');
    if (!wrap) return;

    if (!list.length) {
      wrap.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px;"><i class="fa-regular fa-comment-dots" style="font-size:28px;display:block;margin-bottom:10px;opacity:.4"></i>还没有人发言，来打个招呼吧～</div>';
      return;
    }

    var isAtBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60;
    var html = '';

    list.forEach(function (m) {
      var isMine = m.author_id === profile.id;
      var author = m.author || {};
      var avatar = author.flag_url || I.avatarFallback(author.username || '?');
      var timeStr = formatTime(m.created_at);
      var canRecall = isMine && !m.is_recalled && (Date.now() - new Date(m.created_at).getTime() < 120000);

      var bubbleContent = '';
      if (m.is_recalled) {
        bubbleContent = '<div class="msg-bubble recalled">该消息已撤回</div>';
      } else {
        var mediaHtml = '';
        if (m.media_url) {
          if (m.media_type === 'image') {
            mediaHtml = '<img src="' + m.media_url + '" class="msg-media" onclick="window.open(this.src)" loading="lazy">';
          } else if (m.media_type === 'video') {
            mediaHtml = '<video src="' + m.media_url + '" controls preload="metadata" class="msg-media"></video>';
          } else if (m.media_type === 'audio') {
            mediaHtml = '<audio src="' + m.media_url + '" controls preload="metadata" class="msg-media"></audio>';
          } else {
            mediaHtml = '<a href="' + m.media_url + '" target="_blank" download class="file-attach">'
              + '<i class="fa-solid fa-file-arrow-down"></i>'
              + '<div style="min-width:0"><div class="f-name">' + I.escapeHtml(m.file_name || '附件文件') + '</div><div class="f-size">点击下载</div></div>'
              + '</a>';
          }
        }
        var textHtml = m.content ? '<div style="white-space: pre-wrap;">' + I.escapeHtml(m.content) + '</div>' : '';
        bubbleContent = '<div class="msg-bubble">' + mediaHtml + textHtml + '</div>';
      }

      html += '<div class="msg-row ' + (isMine ? 'mine' : 'other') + '" data-id="' + m.id + '">'
        + '<img src="' + avatar + '" class="msg-avatar" loading="lazy">'
        + '<div class="msg-content-wrap">'
        + '<div class="msg-info">'
        + (!isMine ? '<b>' + I.escapeHtml(author.username || '未知') + '</b>' : '')
        + '<span>' + timeStr + '</span>'
        + (canRecall ? '<span class="recall-btn" onclick="recallMessage(\'' + m.id + '\')">撤回</span>' : '')
        + '</div>'
        + bubbleContent
        + '</div></div>';
    });

    wrap.innerHTML = html;

    requestAnimationFrame(function () {
      if (isAtBottom || wrap.scrollTop === 0) {
        wrap.scrollTop = wrap.scrollHeight;
      }
    });
  }

  // ============ 发送消息 ============
  window.sendMessage = function () {
    var input = I.$('#chatInput');
    var content = input.value.trim();
    if (!content && !selectedFile) return;

    var btn = I.$('#btnSend');
    btn.disabled = true;

    function doInsert(mediaUrl, mediaType, fileName) {
      I.client.from('posts').insert({
        author_id: profile.id,
        content: content,
        media_url: mediaUrl,
        media_type: mediaType,
        file_name: fileName
      }).then(function (r) {
        btn.disabled = false;
        if (r.error) { I.toast(r.error.message, 'error'); return; }

        input.value = '';
        input.style.height = '44px';
        selectedFile = null;
        I.$('#fileHint').style.display = 'none';
        I.$('#fileHint').textContent = '';
        I.$('#mediaFile').value = '';

        currentSig = ''; // 强制刷新
        loadMessages();
      });
    }

    if (selectedFile) {
      var file = selectedFile;
      var ext = (file.name.split('.').pop() || 'bin').toLowerCase();
      var path = profile.id + '/' + Date.now() + '.' + ext;
      I.toast('正在上传附件...', 'success', 1000);

      I.client.storage.from('media').upload(path, file).then(function (r) {
        if (r.error) { btn.disabled = false; I.toast('上传失败：' + r.error.message, 'error'); return; }
        var url = I.client.storage.from('media').getPublicUrl(path).data.publicUrl;
        var type = file.type.startsWith('image/') ? 'image'
                 : file.type.startsWith('video/') ? 'video'
                 : file.type.startsWith('audio/') ? 'audio' : 'file';
        doInsert(url, type, file.name);
      });
    } else {
      doInsert(null, null, null);
    }
  };

  // ============ 撤回 ============
  window.recallMessage = function (id) {
    if (!confirm('确认撤回该消息吗？')) return;
    I.client.from('posts')
      .update({ is_recalled: true })
      .eq('id', id)
      .eq('author_id', profile.id)
      .select('id, is_recalled')
      .then(function (r) {
        if (r.error) { I.toast('撤回失败：' + r.error.message, 'error'); return; }
        if (!r.data || !r.data.length) { I.toast('无法撤回（超过 2 分钟或无权操作）', 'error'); return; }
        I.toast('已撤回', 'success');
        currentSig = '';
        loadMessages();
      });
  };

  // ============ 外交事务 ============
  function loadDiplomacy() {
    if (!profile) return;
    I.client.from('diplomacy_requests')
      .select('*, from_profile:profiles!diplomacy_requests_from_country_fkey(username)')
      .eq('to_country', profile.id)
      .eq('status', 'pending')
      .order('created_at', { ascending: false })
      .then(function (res) {
        if (res.error) { console.error(res.error); return; }
        var list = res.data || [];
        var badge = I.$('#diploBadge');
        if (list.length > 0) {
          badge.style.display = 'inline-block';
          badge.textContent = list.length;
        } else {
          badge.style.display = 'none';
        }
        renderDiploList(list);
      });
  }

  function renderDiploList(list) {
    var wrap = I.$('#diploList');
    if (!list.length) {
      wrap.innerHTML = '<div style="text-align:center; padding:30px; color:var(--muted);">暂无待办外交事务</div>';
      return;
    }

    var html = '';
    list.forEach(function (req) {
      var fromName = req.from_profile ? req.from_profile.username : '未知国家';
      var safeName = I.escapeHtml(fromName);
      var fromId = req.from_country;
      var rid = req.id;

      if (req.request_type === 'war') {
        html += '<div class="diplo-item war">'
          + '<div>'
          + '<div style="font-size:14px; font-weight:bold; color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> 遭遇宣战</div>'
          + '<div style="font-size:13px; color:var(--ink-2); margin-top:4px;">【' + safeName + '】已向你宣战！</div>'
          + '<div style="font-size:11px; color:var(--muted); margin-top:4px;">' + I.relativeTime(req.created_at) + '</div>'
          + '</div></div>';
      } else if (req.request_type === 'ally') {
        html += '<div class="diplo-item">'
          + '<div style="min-width:0">'
          + '<div style="font-size:14px; font-weight:bold; color:var(--gold);"><i class="fa-solid fa-handshake"></i> 建交申请</div>'
          + '<div style="font-size:13px; color:var(--ink-2); margin-top:4px;">【' + safeName + '】申请与你建立友好关系。</div>'
          + '<div style="font-size:11px; color:var(--muted); margin-top:4px;">' + I.relativeTime(req.created_at) + '</div>'
          + '</div>'
          + '<div style="display:flex; gap:8px; flex-shrink:0;">'
          + '<button class="btn btn-cyan btn-sm" onclick="handleDiplo(\'' + rid + '\',\'' + fromId + '\',\'ally\',\'accept\')">同意</button>'
          + '<button class="btn btn-ghost btn-sm" onclick="handleDiplo(\'' + rid + '\',\'' + fromId + '\',\'ally\',\'reject\')">拒绝</button>'
          + '</div></div>';
      } else if (req.request_type === 'peace') {
        html += '<div class="diplo-item">'
          + '<div style="min-width:0">'
          + '<div style="font-size:14px; font-weight:bold; color:var(--cyan);"><i class="fa-solid fa-dove"></i> 停战申请</div>'
          + '<div style="font-size:13px; color:var(--ink-2); margin-top:4px;">【' + safeName + '】请求结束战争。</div>'
          + '<div style="font-size:11px; color:var(--muted); margin-top:4px;">' + I.relativeTime(req.created_at) + '</div>'
          + '</div>'
          + '<div style="display:flex; gap:8px; flex-shrink:0;">'
          + '<button class="btn btn-cyan btn-sm" onclick="handleDiplo(\'' + rid + '\',\'' + fromId + '\',\'peace\',\'accept\')">同意</button>'
          + '<button class="btn btn-ghost btn-sm" onclick="handleDiplo(\'' + rid + '\',\'' + fromId + '\',\'peace\',\'reject\')">拒绝</button>'
          + '</div></div>';
      }
    });
    wrap.innerHTML = html;
  }

  window.openDiploModal = function () {
    I.$('#diploModal').classList.add('open');
    loadDiplomacy();
  };
  window.closeDiploModal = function () {
    I.$('#diploModal').classList.remove('open');
  };

  // ============ 处理外交请求 ============
  window.handleDiplo = function (reqId, fromId, type, action) {
    if (action === 'reject') {
      I.client.from('diplomacy_requests').update({ status: 'rejected' }).eq('id', reqId).then(function (r) {
        if (r.error) { I.toast('操作失败', 'error'); return; }
        I.toast('已拒绝请求', 'info');
        loadDiplomacy();
      });
      return;
    }

    if (type === 'ally') {
      I.client.from('diplomacy_requests').update({ status: 'accepted' }).eq('id', reqId).then(function (r) {
        if (r.error) { I.toast('操作失败', 'error'); return; }
        var a = profile.id < fromId ? profile.id : fromId;
        var b = profile.id < fromId ? fromId : profile.id;
        // 🚨 双向删除，避免反向残留导致重复关系
        I.client.from('relations').delete()
          .or('and(country_a.eq.' + a + ',country_b.eq.' + b + '),and(country_a.eq.' + b + ',country_b.eq.' + a + ')')
          .then(function () {
            I.client.from('relations').insert({ country_a: a, country_b: b, relation_type: 'ally' }).then(function (ir) {
              if (ir.error) { I.toast('建立关系失败：' + ir.error.message, 'error'); return; }
              I.toast('已建立外交关系', 'success');
              loadDiplomacy();
            });
          });
      });
    } else if (type === 'peace') {
      // 🚨 必须调用 accept_peace RPC，否则 wars 表不会结束
      I.client.rpc('accept_peace', { p_request_id: reqId }).then(function (r) {
        if (r.error) {
          console.warn('accept_peace RPC 失败，使用兜底逻辑:', r.error);
          // 兜底：至少把关系和请求状态改正
          I.client.from('diplomacy_requests').update({ status: 'accepted' }).eq('id', reqId).then(function () {
            I.client.from('relations').update({ relation_type: 'neutral' })
              .or('and(country_a.eq.' + profile.id + ',country_b.eq.' + fromId + '),and(country_a.eq.' + fromId + ',country_b.eq.' + profile.id + ')')
              .then(function () {
                I.toast('已停战（本地处理）', 'success');
                loadDiplomacy();
              });
          });
        } else {
          I.toast('已停战', 'success');
          loadDiplomacy();
        }
      });
    }
  };

})();
</script>
</body>
</html>
