<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>交流中心 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { background-color: #05070a; overflow: hidden; }
  .chat-wrap { display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; height: calc(100vh - 180px); height: calc(100dvh - 180px); min-height: 400px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
  .chat-header { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); gap: 12px; flex-shrink: 0; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: thin; scroll-behavior: smooth; }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
  .msg-row { display: flex; gap: 14px; max-width: 85%; animation: slideUp 0.3s ease; }
  .msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.other { align-self: flex-start; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg-avatar { width: 42px; height: 30px; border-radius: 6px; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
  .msg-content-wrap { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .msg-row.mine .msg-content-wrap { align-items: flex-end; }
  .msg-info { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .msg-info b { color: var(--gold-2); font-size: 13px; font-weight: 700; }
  .msg-bubble { padding: 12px 18px; border-radius: 16px; font-size: 14.5px; line-height: 1.6; word-break: break-word; position: relative; background: rgba(30, 41, 59, 0.8); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.08); }
  .msg-row.mine .msg-bubble { background: linear-gradient(135deg, rgba(79,195,247,0.15), rgba(79,195,247,0.05)); border-color: rgba(79,195,247,0.2); color: #fff; border-bottom-right-radius: 4px; }
  .msg-row.other .msg-bubble { border-bottom-left-radius: 4px; }
  .msg-bubble.recalled { background: transparent; border: 1px dashed rgba(255,255,255,0.2); color: var(--muted); font-style: italic; }
  .msg-media-img { max-width: 260px; max-height: 260px; border-radius: 10px; margin-bottom: 8px; display: block; border: 1px solid rgba(255,255,255,0.1); cursor: zoom-in; object-fit: cover; }
  .msg-media-video { max-width: 300px; border-radius: 10px; margin-bottom: 8px; display: block; border: 1px solid rgba(255,255,255,0.1); }
  .msg-media-audio { width: 240px; margin-bottom: 8px; display: block; }
  .file-attach { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.4); padding: 12px 16px; border-radius: 10px; margin-bottom: 8px; text-decoration: none; color: #fff; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
  .file-attach i { font-size: 24px; color: var(--gold); flex-shrink: 0; }
  .file-attach .f-name { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .file-attach .f-size { font-size: 11px; color: var(--muted); }
  .recall-btn { display: inline-block; font-size: 11px; color: var(--red); cursor: pointer; transition: 0.2s; margin-left: 8px; opacity: 0; }
  .msg-row:hover .recall-btn { opacity: 0.8; }
  @media (hover: none) { .recall-btn { opacity: 0.8; display: inline-block; } }
  .chat-footer { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.05); background: rgba(10, 14, 26, 0.95); display: flex; gap: 14px; align-items: flex-end; flex-shrink: 0; }
  .chat-input-box { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; transition: all 0.3s; }
  .chat-input-box:focus-within { border-color: var(--cyan); box-shadow: 0 0 15px rgba(79,195,247,0.15); }
  .chat-input-box textarea { width: 100%; background: transparent; border: none; padding: 14px 18px; color: #fff; font-size: 14.5px; resize: none; outline: none; min-height: 52px; max-height: 150px; line-height: 1.5; }
  .chat-tools { display: flex; padding: 0 16px 12px 16px; gap: 16px; color: var(--muted); align-items: center; }
  .chat-tools label { cursor: pointer; transition: 0.2s; font-size: 20px; color: rgba(255,255,255,0.4); }
  .chat-tools label:hover { color: var(--cyan); }
  .file-hint { font-size: 12px; color: var(--cyan); background: rgba(79,195,247,0.1); padding: 4px 10px; border-radius: 6px; display: none; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-send { height: 52px; width: 60px; border-radius: 16px; background: linear-gradient(135deg, #4fc3f7, #0288d1); color: #000; font-size: 20px; border: none; cursor: pointer; display: grid; place-items: center; transition: 0.3s; }
  .btn-send:hover { transform: translateY(-2px); background: #fff; }
  .diplo-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: rgba(30, 41, 59, 0.6); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px; transition: 0.2s; }
  .diplo-item.war { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
  .diplo-item.trade { border-color: rgba(212,175,55,0.3); background: rgba(212,175,55,0.05); }
  @media (max-width: 640px) {
    .chat-wrap { height: calc(100dvh - 140px); border-radius: 0; max-width: 100%; margin-top: 10px; }
    .chat-header { padding: 12px 16px; }
    .chat-messages { padding: 16px 12px; gap: 16px; }
    .msg-row { max-width: 92%; }
    .msg-bubble { font-size: 14px; padding: 10px 14px; }
    .msg-media-img { max-width: 200px; max-height: 200px; }
    .chat-footer { padding: 10px 12px; gap: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .btn-send { height: 46px; width: 46px; font-size: 16px; }
  }
</style>
</head>
<body>

<header class="iecp-topbar"><div class="iecp-topbar-inner"><a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a><nav class="iecp-nav" id="iecp-nav"></nav><div class="iecp-user" id="iecp-user"></div></div></header>

<main class="iecp-main">
  <div class="chat-wrap">
    <div class="chat-header">
      <div style="min-width:0">
        <h2 style="margin:0; font-size:18px; color:var(--ink); display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-comments" style="color:var(--gold);"></i> 国际交流大厅</h2>
        <p style="margin:4px 0 0 0; font-size:12px; color:var(--muted);">遵守国际法，文明发言，支持多媒体传输</p>
      </div>
      
      <div style="display: flex; gap: 8px; flex-shrink: 0;">
        <a href="treaty.html" class="btn btn-ghost btn-sm" style="text-decoration: none;">
          <i class="fa-solid fa-file-contract" style="color: var(--gold);"></i> 国际条约
        </a>
        <button class="btn btn-ghost btn-sm" onclick="openDiploModal()">
          <i class="fa-solid fa-bell"></i> 外交事务 <span id="diploBadge" style="background:var(--red);color:#fff;padding:2px 6px;border-radius:10px;font-size:10px;margin-left:4px;display:none;">0</span>
        </button>
      </div>
      
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="loading-state"><div class="spinner"></div><span>正在接入国际频道...</span></div>
    </div>
    <div class="chat-footer">
      <div class="chat-input-box">
        <textarea id="chatInput" placeholder="输入消息，支持附带文件..." oninput="autoResize(this)"></textarea>
        <div class="chat-tools">
          <label for="mediaFile" title="发送图片/视频/音频/文件"><i class="fa-solid fa-paperclip"></i></label>
          <input type="file" id="mediaFile" style="display:none" onchange="handleFileSelect()">
          <span id="fileHint" class="file-hint"></span>
        </div>
      </div>
      <button class="btn-send" id="btnSend" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</main>

<div class="iecp-modal" id="diploModal">
  <div class="iecp-modal-box glass-2" style="max-width:500px; padding:24px;">
    <h3><i class="fa-solid fa-envelope-open-text" style="color:var(--gold)"></i> 外交事务</h3>
    <p class="modal-sub">处理待办外交请求。宣战仅作公示。</p>
    <div id="diploList" style="max-height:60vh; overflow-y:auto; padding-right:4px;"></div>
    <div style="text-align:right; margin-top:20px;">
      <button class="btn btn-ghost" onclick="closeDiploModal()">关闭</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP; var profile = null; var selectedFile = null; var pollTimer = null; var diploTimer = null; var currentSig = '';
  var isDesktop = window.matchMedia('(pointer: fine)').matches;

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('diplomacy');
    I.getProfile(true).then(function (p) {
      if (!p) return; profile = p; bindEvents(); loadMessages(); loadDiplomacy(); startPolling();
    });
  });

  function startPolling() { stopPolling(); pollTimer = setInterval(loadMessages, 5000); diploTimer = setInterval(loadDiplomacy, 10000); }
  function stopPolling() { if (pollTimer) clearInterval(pollTimer); if (diploTimer) clearInterval(diploTimer); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stopPolling(); else { loadMessages(); loadDiplomacy(); startPolling(); } });
  function bindEvents() { 
    var ta = I.$('#chatInput'); 
    if (isDesktop && ta) { ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); } }); } 
  }

  window.autoResize = function (el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 150) + 'px'; };
  
  window.handleFileSelect = function () { 
    var file = I.$('#mediaFile').files[0]; if (!file) return; 
    if (file.size > 50 * 1024 * 1024) { I.toast('文件不能超过 50MB', 'error'); I.$('#mediaFile').value = ''; return; }
    selectedFile = file; I.$('#fileHint').textContent = '已选择: ' + file.name; I.$('#fileHint').style.display = 'inline-block'; 
  };

  function loadMessages() {
    I.client.from('posts').select('*, author:profiles(id, username, flag_url)').order('created_at', { ascending: false }).limit(50).then(function (res) {
      if (res.error) return; var list = (res.data || []).slice().reverse();
      var sig = list.map(function (m) { return m.id + (m.is_recalled ? 'r' : ''); }).join('|');
      if (sig === currentSig) return; currentSig = sig; renderMessages(list);
    });
  }

  function formatTime(iso) {
    try {
      var d = new Date(iso); var now = new Date();
      var hh = String(d.getHours()).padStart(2, '0'); var mm = String(d.getMinutes()).padStart(2, '0');
      if (d.toDateString() === now.toDateString()) return hh + ':' + mm;
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hh + ':' + mm;
    } catch (e) { return ''; }
  }

  function renderMessages(list) {
    var wrap = I.$('#chatMessages'); 
    if (!list.length) { wrap.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px;"><i class="fa-regular fa-comment-dots" style="font-size:28px;display:block;margin-bottom:10px;opacity:.4"></i>还没有人发言，来打个招呼吧～</div>'; return; }
    
    var isAtBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60; var html = '';
    
    list.forEach(function (m) {
      var isMine = m.author_id === profile.id; var author = m.author || {}; 
      var avatar = author.flag_url || I.avatarFallback(author.username || '?');
      var canRecall = isMine && !m.is_recalled && (Date.now() - new Date(m.created_at).getTime() < 120000);
      
      var bubbleContent = '';
      if (m.is_recalled) {
        bubbleContent = '<div class="msg-bubble recalled">该消息已撤回</div>';
      } else {
        var mediaHtml = '';
        if (m.media_url) {
          if (m.media_type === 'image') mediaHtml = `<img src="${m.media_url}" class="msg-media-img" onclick="window.open(this.src)" loading="lazy">`;
          else if (m.media_type === 'video') mediaHtml = `<video src="${m.media_url}" controls preload="metadata" class="msg-media-video"></video>`;
          else if (m.media_type === 'audio') mediaHtml = `<audio src="${m.media_url}" controls preload="metadata" class="msg-media-audio"></audio>`;
          else mediaHtml = `<a href="${m.media_url}" target="_blank" download class="file-attach"><i class="fa-solid fa-file-arrow-down"></i><div><div class="f-name">${I.escapeHtml(m.file_name || '附件文件')}</div><div class="f-size">点击下载</div></div></a>`;
        }
        var textHtml = m.content ? `<div style="white-space: pre-wrap;">${I.escapeHtml(m.content)}</div>` : '';
        bubbleContent = `<div class="msg-bubble">${mediaHtml}${textHtml}</div>`;
      }

      html += `
        <div class="msg-row ${isMine ? 'mine' : 'other'}">
          <img src="${avatar}" class="msg-avatar" loading="lazy">
          <div class="msg-content-wrap">
            <div class="msg-info">
              ${!isMine ? `<b>${I.escapeHtml(author.username || '未知')}</b>` : ''}
              <span>${formatTime(m.created_at)}</span>
              ${canRecall ? `<span class="recall-btn" onclick="recallMessage('${m.id}')">撤回</span>` : ''}
            </div>
            ${bubbleContent}
          </div>
        </div>
      `;
    });
    wrap.innerHTML = html; if (isAtBottom) wrap.scrollTop = wrap.scrollHeight;
  }

  window.sendMessage = function () {
    var input = I.$('#chatInput'); var content = input.value.trim(); if (!content && !selectedFile) return;
    var btn = I.$('#btnSend'); btn.disabled = true;

    function doInsert(mediaUrl, mediaType, fileName) {
      I.client.from('posts').insert({ author_id: profile.id, content: content, media_url: mediaUrl, media_type: mediaType, file_name: fileName }).then(function (r) {
        btn.disabled = false; if (r.error) { I.toast(r.error.message, 'error'); return; }
        input.value = ''; input.style.height = '52px'; selectedFile = null;
        I.$('#fileHint').style.display = 'none'; I.$('#fileHint').textContent = ''; I.$('#mediaFile').value = '';
        currentSig = ''; loadMessages();
      });
    }

    if (selectedFile) {
      var file = selectedFile; var ext = (file.name.split('.').pop() || 'bin').toLowerCase(); var path = profile.id + '/' + Date.now() + '.' + ext;
      I.toast('正在上传附件...', 'success', 1000);
      I.client.storage.from('media').upload(path, file).then(function (r) {
        if (r.error) { btn.disabled = false; I.toast('上传失败：' + r.error.message, 'error'); return; }
        var url = I.client.storage.from('media').getPublicUrl(path).data.publicUrl;
        var type = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : file.type.startsWith('audio/') ? 'audio' : 'file';
        doInsert(url, type, file.name);
      });
    } else { doInsert(null, null, null); }
  };

  window.recallMessage = function (id) {
    if (!confirm('确认撤回该消息吗？')) return;
    I.client.from('posts').update({ is_recalled: true }).eq('id', id).eq('author_id', profile.id).select('id, is_recalled').then(function (r) {
      if (r.error) { I.toast('撤回失败：' + r.error.message, 'error'); return; }
      if (!r.data || !r.data.length) { I.toast('无法撤回（超过 2 分钟或无权操作）', 'error'); return; }
      I.toast('已撤回', 'success'); currentSig = ''; loadMessages();
    });
  };

  function loadDiplomacy() {
    if (!profile) return;
    I.client.from('diplomacy_requests').select('*, from_profile:profiles!diplomacy_requests_from_country_fkey(username)').eq('to_country', profile.id).eq('status', 'pending').order('created_at', { ascending: false }).then(function (res) {
      var list = res.data || []; var badge = I.$('#diploBadge');
      if (list.length > 0) { badge.style.display = 'inline-block'; badge.textContent = list.length; } else { badge.style.display = 'none'; }
      renderDiploList(list);
    });
  }

  function renderDiploList(list) {
    var wrap = I.$('#diploList');
    if (!list.length) { wrap.innerHTML = '<div style="text-align:center; padding:30px; color:var(--muted); font-size:13px;"><i class="fa-regular fa-envelope" style="font-size:24px; display:block; margin-bottom:8px; opacity:0.5;"></i>暂无待办外交事务</div>'; return; }
    var html = '';
    list.forEach(function (req) {
      var fromName = req.from_profile ? req.from_profile.username : '未知国家'; var safeName = I.escapeHtml(fromName); var rid = req.id; var fromId = req.from_country;
      
      if (req.request_type === 'war') {
        html += `<div class="diplo-item war"><div><div style="font-size:14px; font-weight:bold; color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> 遭遇宣战</div><div style="font-size:13px; color:var(--ink-2);">【${safeName}】已向你宣战！</div></div></div>`;
      } else if (req.request_type === 'diplomatic' || req.request_type === 'ally') {
        var isAlly = req.request_type === 'ally';
        var title = isAlly ? '结盟申请' : '建交申请';
        var color = isAlly ? 'var(--gold)' : '#22c55e';
        var icon = isAlly ? 'fa-shield-halved' : 'fa-handshake';
        
        html += `<div class="diplo-item"><div style="min-width:0">
          <div style="font-size:14px; font-weight:bold; color:${color};"><i class="fa-solid ${icon}"></i> ${title}</div>
          <div style="font-size:13px; color:var(--ink-2);">【${safeName}】申请与你${isAlly ? '结为军事同盟' : '建立外交关系'}。</div>
          </div><div style="display:flex; gap:8px; flex-shrink:0;">
          <button class="btn btn-cyan btn-sm" onclick="handleDiplo('${rid}','${fromId}','${req.request_type}','accept')">同意</button>
          <button class="btn btn-ghost btn-sm" onclick="handleDiplo('${rid}','${fromId}','${req.request_type}','reject')">拒绝</button>
          </div></div>`;
      } else if (req.request_type === 'peace') {
        html += `<div class="diplo-item"><div style="min-width:0"><div style="font-size:14px; font-weight:bold; color:var(--cyan);"><i class="fa-solid fa-dove"></i> 停战申请</div><div style="font-size:13px; color:var(--ink-2);">【${safeName}】请求结束战争。</div></div><div style="display:flex; gap:8px; flex-shrink:0;"><button class="btn btn-cyan btn-sm" onclick="handleDiplo('${rid}','${fromId}','peace','accept')">同意</button><button class="btn btn-ghost btn-sm" onclick="handleDiplo('${rid}','${fromId}','peace','reject')">拒绝</button></div></div>`;
      } else if (req.request_type === 'buy_territory') {
        var extra = req.extra_data || {}; var price = parseInt(extra.price || 0).toLocaleString();
        html += `<div class="diplo-item trade"><div style="min-width:0"><div style="font-size:14px; font-weight:bold; color:var(--gold);"><i class="fa-solid fa-money-bill-wave"></i> 购买领土申请</div><div style="font-size:13px; color:var(--ink-2);">【${safeName}】想购买你的 <b>${getGeoName(extra.region_code)}</b>，出价 <b>${price} ₽</b>。</div></div><div style="display:flex; gap:8px; flex-shrink:0;"><button class="btn btn-gold btn-sm" onclick="handleBuyTerritory('${rid}', 'accept')">出售</button><button class="btn btn-ghost btn-sm" onclick="handleBuyTerritory('${rid}', 'reject')">拒绝</button></div></div>`;
      }
    });
    wrap.innerHTML = html;
  }

  window.openDiploModal = function () { I.$('#diploModal').classList.add('open'); loadDiplomacy(); };
  window.closeDiploModal = function () { I.$('#diploModal').classList.remove('open'); };

  window.handleDiplo = function (reqId, fromId, type, action) {
    if (action === 'reject') {
      I.client.from('diplomacy_requests').update({ status: 'rejected' }).eq('id', reqId).then(function () { I.toast('已拒绝', 'info'); loadDiplomacy(); });
      return;
    }
    if (type === 'ally' || type === 'diplomatic') {
      // 1. 更新请求状态为已接受
      I.client.from('diplomacy_requests').update({ status: 'accepted' }).eq('id', reqId).then(function () {
        var a = profile.id < fromId ? profile.id : fromId; 
        var b = profile.id < fromId ? fromId : profile.id;
        
        // 🚨 核心修复：只精准删除这两个国家之间的旧外交关系，绝对不影响与其他国家的关系
        I.client.from('relations').delete().or(`and(country_a.eq.${a},country_b.eq.${b}),and(country_a.eq.${b},country_b.eq.${a})`).then(function(delRes) {
          if(delRes.error) console.error("清理旧关系失败", delRes.error);
          
          // 2. 插入新关系
          I.client.from('relations').insert({ country_a: a, country_b: b, relation_type: type }).then(function (insRes) {
            if (insRes.error) {
              console.error("建交写入失败", insRes.error);
              I.toast('建交失败（数据库拦截）：' + insRes.error.message, 'error');
            } else {
              I.toast(type === 'ally' ? '已结为同盟！' : '已建立外交关系', 'success');
            }
            loadDiplomacy();
          });
        });
      });
    } else if (type === 'peace') {
      I.client.rpc('accept_peace', { p_request_id: reqId }).then(function (r) { I.toast('已停战', 'success'); loadDiplomacy(); });
    }
  };

  window.handleBuyTerritory = function(reqId, action) {
    if (action === 'reject') { I.client.from('diplomacy_requests').update({ status: 'rejected' }).eq('id', reqId).then(function () { loadDiplomacy(); }); return; }
    I.client.rpc('accept_buy_territory', { p_request_id: reqId }).then(function(res) { if(res.data.ok) { I.toast('交易成功', 'success'); loadDiplomacy(); } });
  };

  function getGeoName(code) { return '远洋专属经济区'; }
})();
</script>
</body>
</html>
