<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>注册 · IECP 国际交流与合作平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { background-color: #05070a; overflow-x: hidden; }
  #particleCanvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  
  .aurora-bg {
    position: fixed; inset: 0; z-index: -2;
    background: 
      radial-gradient(circle at 15% 50%, rgba(79, 195, 247, 0.15), transparent 50%),
      radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.15), transparent 50%),
      radial-gradient(circle at 50% 80%, rgba(167, 139, 250, 0.1), transparent 50%);
    filter: blur(80px);
    animation: auroraMove 15s ease-in-out infinite alternate;
  }
  @keyframes auroraMove { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.2) translate(-5%, 5%); } }

  .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; box-sizing: border-box; }

  .auth-card {
    width: 100%; max-width: 680px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }

  /* 顶部扫描光效 */
  .auth-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: scanline 3s linear infinite;
  }
  @keyframes scanline { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .auth-header { text-align: center; margin-bottom: 30px; }
  .auth-header img { width: 70px; height: 70px; margin-bottom: 16px; filter: drop-shadow(0 0 20px rgba(212,175,55,0.6)); }
  .auth-header h2 { font-size: 26px; color: #fff; margin: 0 0 8px 0; letter-spacing: 3px; font-weight: 800; background: linear-gradient(135deg, #fff, #d4af37); -webkit-background-clip: text; color: transparent; }
  .auth-header p { font-size: 14px; color: var(--muted); margin: 0; letter-spacing: 1px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  
  .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .input-group label { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-left: 4px; }
  .input-wrap { position: relative; }
  .input-wrap i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; transition: 0.3s; }
  .input-wrap input, .input-wrap textarea {
    width: 100%; padding: 16px 18px 16px 48px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; color: #fff; font-size: 14.5px; outline: none; transition: 0.3s;
    box-sizing: border-box; font-family: inherit;
  }
  .input-wrap textarea { padding-left: 18px; min-height: 90px; resize: vertical; }
  .input-wrap input:focus, .input-wrap textarea:focus {
    border-color: var(--cyan); background: rgba(79, 195, 247, 0.05); box-shadow: 0 0 20px rgba(79,195,247,0.15);
  }
  .input-wrap input:focus ~ i { color: var(--cyan); }

  /* 高级上传框 */
  .upload-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 100px; padding: 16px;
    background: rgba(0,0,0,0.3); border: 1.5px dashed rgba(255,255,255,0.15);
    border-radius: 14px; cursor: pointer; transition: 0.3s;
    text-align: center; position: relative; overflow: hidden; box-sizing: border-box;
  }
  .upload-box:hover { border-color: var(--gold); background: rgba(212,175,55,0.05); box-shadow: 0 0 20px rgba(212,175,55,0.1); }
  .upload-box i { font-size: 26px; color: var(--gold); margin-bottom: 8px; }
  .upload-box span { font-size: 13px; color: var(--muted); }
  .upload-preview { display: none; align-items: center; gap: 14px; width: 100%; text-align: left; z-index: 2; }
  .upload-preview img { width: 56px; height: 38px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); }
  .upload-preview .file-info { flex: 1; min-width: 0; }
  .upload-preview .file-name { font-size: 13px; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .upload-preview .file-status { font-size: 11px; color: var(--cyan); margin-top: 4px; }
  .upload-box.has-file { border-style: solid; border-color: var(--cyan); background: rgba(79,195,247,0.08); }
  .upload-box.has-file > i, .upload-box.has-file > span { display: none; }
  .upload-box.has-file .upload-preview { display: flex; }

  .btn-auth {
    width: 100%; padding: 18px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--gold), #b8860b);
    color: #000; font-size: 17px; font-weight: 900; cursor: pointer; letter-spacing: 2px;
    transition: 0.3s; margin-top: 15px; box-shadow: 0 10px 30px rgba(212,175,55,0.3);
  }
  .btn-auth:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212,175,55,0.5); }
  .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

  .auth-msg { text-align: center; font-size: 14px; font-weight: 600; margin-top: 16px; min-height: 20px; padding: 10px; border-radius: 8px; }
  .auth-msg.error { color: #ef4444; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
  .auth-msg.success { color: #22c55e; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }

  .auth-links { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); }
  .auth-links a { color: var(--gold-2); text-decoration: none; margin-left: 5px; font-weight: bold; transition: 0.2s; }
  .auth-links a:hover { color: #fff; text-shadow: 0 0 10px var(--gold); }

  @media (max-width: 640px) {
    .auth-container { padding: 20px 15px; align-items: flex-start; }
    .auth-card { padding: 30px 20px; border-radius: 20px; margin-top: 10px; }
    .form-grid { grid-template-columns: 1fr; gap: 0; }
  }
</style>
</head>
<body>

<div class="aurora-bg"></div>
<canvas id="particleCanvas"></canvas>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="photo/un.png" alt="IECP">
      <h2>建立你的国家</h2>
      <p>填写国家信息，开启你的国际博弈之旅</p>
    </div>

    <form id="formRegister" onsubmit="handleRegister(event)">
      <div class="form-grid">
        <div class="input-group">
          <label>登录邮箱 <span style="color:var(--red)">*</span></label>
          <div class="input-wrap"><i class="fa-regular fa-envelope"></i><input type="email" id="regEmail" placeholder="用于登录" required></div>
        </div>
        <div class="input-group">
          <label>国家名 <span style="color:var(--red)">*</span></label>
          <div class="input-wrap"><i class="fa-solid fa-landmark-flag"></i><input type="text" id="regUsername" placeholder="如：亚斯共和国" required></div>
        </div>

        <div class="input-group">
          <label>密码 <span style="color:var(--red)">*</span></label>
          <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="regPassword" placeholder="至少6位" required></div>
        </div>
        <div class="input-group">
          <label>确认密码 <span style="color:var(--red)">*</span></label>
          <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="regPassword2" placeholder="再次输入" required></div>
        </div>

        <div class="input-group">
          <label>社会性质 <span style="color:var(--red)">*</span></label>
          <div class="input-wrap"><i class="fa-solid fa-scale-balanced"></i><input type="text" id="regSocial" placeholder="如：社会主义共和国" required></div>
        </div>
        <div class="input-group">
          <label>首都 <span style="color:var(--red)">*</span></label>
          <div class="input-wrap"><i class="fa-solid fa-city"></i><input type="text" id="regCapital" placeholder="如：蓬溪格勒" required></div>
        </div>
      </div>

      <div class="input-group">
        <label>官方语言 <span style="color:var(--red)">*</span></label>
        <div class="input-wrap"><i class="fa-solid fa-language"></i><input type="text" id="regLanguage" placeholder="如：亚斯语、俄语" required></div>
      </div>

      <div class="input-group">
        <label>国家介绍 <span style="color:var(--muted); font-weight:normal;">(选填)</span></label>
        <div class="input-wrap"><textarea id="regDescription" placeholder="向世界介绍你的国家历史、文化或现状..."></textarea></div>
      </div>

      <div class="form-grid" style="margin-top: 10px;">
        <div class="input-group">
          <label>上传国旗 <span style="color:var(--red)">*</span></label>
          <label class="upload-box" for="regFlag">
            <i class="fa-regular fa-image"></i><span>点击上传国旗</span>
            <div class="upload-preview">
              <img id="flagImgPreview" src="" alt="">
              <div class="file-info"><div class="file-name" id="flagName">已选择</div><div class="file-status">点击重新选择</div></div>
            </div>
            <input type="file" id="regFlag" accept="image/*" required style="display:none;">
          </label>
        </div>
        <div class="input-group">
          <label>上传国徽 <span style="color:var(--red)">*</span></label>
          <label class="upload-box" for="regEmblem">
            <i class="fa-regular fa-image"></i><span>点击上传国徽</span>
            <div class="upload-preview">
              <img id="emblemImgPreview" src="" alt="">
              <div class="file-info"><div class="file-name" id="emblemName">已选择</div><div class="file-status">点击重新选择</div></div>
            </div>
            <input type="file" id="regEmblem" accept="image/*" required style="display:none;">
          </label>
        </div>
      </div>

      <div class="auth-msg" id="msgReg"></div>
      <button type="submit" class="btn-auth" id="btnRegister">立即建国</button>

      <div class="auth-links">
        已有账号？<a href="login.html">返回登录 <i class="fa-solid fa-arrow-right"></i></a>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
// 粒子动态背景
(function initParticles() {
  const canvas = document.getElementById('particleCanvas'); const ctx = canvas.getContext('2d');
  let width, height; let particles = [];
  function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  class Particle {
    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.radius = Math.random() * 1.5 + 0.5; }
    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
    draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(79, 195, 247, 0.3)'; ctx.fill(); }
  }
  for (let i = 0; i < 70; i++) particles.push(new Particle());
  function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
      particles[i].update(); particles[i].draw();
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(79, 195, 247, ${0.15 - dist / 1000})`; ctx.stroke(); }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

// 文件预览
document.getElementById('regFlag').addEventListener('change', function() {
  var file = this.files[0];
  if (file) {
    this.parentNode.classList.add('has-file');
    document.getElementById('flagName').innerText = file.name;
    var reader = new FileReader();
    reader.onload = function(e) { document.getElementById('flagImgPreview').src = e.target.result; };
    reader.readAsDataURL(file);
  }
});
document.getElementById('regEmblem').addEventListener('change', function() {
  var file = this.files[0];
  if (file) {
    this.parentNode.classList.add('has-file');
    document.getElementById('emblemName').innerText = file.name;
    var reader = new FileReader();
    reader.onload = function(e) { document.getElementById('emblemImgPreview').src = e.target.result; };
    reader.readAsDataURL(file);
  }
});

function setMsg(text, type) {
  var el = document.getElementById('msgReg');
  el.innerText = text;
  el.className = 'auth-msg ' + (type || '');
}

async function handleRegister(e) {
  e.preventDefault();
  if (!window.IECP || !IECP.client) return setMsg('核心组件未加载，请刷新页面', 'error');

  const email = document.getElementById('regEmail').value.trim();
  const username = document.getElementById('regUsername').value.trim();
  const pwd = document.getElementById('regPassword').value;
  const pwd2 = document.getElementById('regPassword2').value;
  const social = document.getElementById('regSocial').value.trim();
  const capital = document.getElementById('regCapital').value.trim();
  const lang = document.getElementById('regLanguage').value.trim();
  const desc = document.getElementById('regDescription').value.trim();
  const flagFile = document.getElementById('regFlag').files[0];
  const emblemFile = document.getElementById('regEmblem').files[0];

  if (pwd !== pwd2) return setMsg('两次输入的密码不一致', 'error');
  if (pwd.length < 6) return setMsg('密码至少 6 位', 'error');
  if (!flagFile || !emblemFile) return setMsg('请上传国旗和国徽', 'error');

  const btn = document.getElementById('btnRegister');
  btn.disabled = true; btn.innerText = '正在建立国家...';
  setMsg('', '');

  try {
    const { data: authData, error: authErr } = await IECP.client.auth.signUp({
      email: email, password: pwd, options: { data: { nickname: username } }
    });

    // 🚨 核心修复：捕获被占用的情况
    if (authErr) {
      if (authErr.message.includes('User already registered') || authErr.message.includes('already exists')) {
        throw new Error('该邮箱已被注册！请直接点击下方 "返回登录" 进行登录。');
      }
      throw new Error(authErr.message);
    }
    
    if (!authData.user) throw new Error('注册失败，请重试');
    if (!authData.session) throw new Error('注册成功，但需前往邮箱点击验证链接后才能登录。');

    const userId = authData.user.id;

    const uploadFile = async (bucket, file, prefix) => {
      const ext = file.name.split('.').pop();
      const path = `${userId}/${prefix}-${Date.now()}.${ext}`;
      const { error } = await IECP.client.storage.from(bucket).upload(path, file);
      if (error) throw new Error('图片上传失败：' + error.message);
      return IECP.client.storage.from(bucket).getPublicUrl(path).data.publicUrl;
    };

    setMsg('正在上传国旗与国徽...', 'success');
    const flagUrl = await uploadFile('flags', flagFile, 'flag');
    const emblemUrl = await uploadFile('emblems', emblemFile, 'emblem');

    setMsg('正在建立国家档案...', 'success');
    const { error: dbErr } = await IECP.client.from('profiles').insert({
      id: userId, username: username, social_system: social, capital: capital,
      official_language: lang, description: desc || null, flag_url: flagUrl, emblem_url: emblemUrl
    });

    if (dbErr) throw new Error('写入档案失败：' + dbErr.message);

    setMsg('建立成功！正在跳转...', 'success');
    setTimeout(() => location.replace('index.html'), 1000);

  } catch (err) {
    setMsg(err.message, 'error');
    btn.disabled = false; btn.innerText = '立即建国';
  }
}
</script>
</body>
</html>
