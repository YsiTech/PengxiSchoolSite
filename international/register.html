<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 · IECP 国际交流与合作平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
<style>
  /* 修复上传框样式 */
  .custom-upload {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 80px; padding: 16px;
    background: rgba(0,0,0,0.2); border: 1.5px dashed rgba(255,255,255,0.2);
    border-radius: 10px; cursor: pointer; transition: 0.2s;
    text-align: center; position: relative; overflow: hidden; box-sizing: border-box;
  }
  .custom-upload:hover { border-color: #d4af37; background: rgba(255,255,255,0.05); }
  .custom-upload i { font-size: 24px; color: #d4af37; margin-bottom: 6px; }
  .custom-upload span { font-size: 12px; color: #a0aec0; }
  .custom-upload .file-preview { display: none; align-items: center; gap: 10px; z-index: 2; }
  .custom-upload .file-preview i { font-size: 18px; margin: 0; color: #4fc3f7; }
  .custom-upload .file-preview span { color: #fff; font-weight: 600; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .custom-upload.has-file { border-style: solid; border-color: #4fc3f7; background: rgba(79,195,247,0.05); }
  .custom-upload.has-file > i, .custom-upload.has-file > span.placeholder { display: none; }
  .custom-upload.has-file .file-preview { display: flex; }

  /* 新增：国家介绍多行文本框样式 */
  .auth-textarea {
    width: 100%;
    min-height: 100px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 14px 16px;
    color: #fff;
    font-size: 14.5px;
    outline: none;
    transition: all 0.3s;
    box-sizing: border-box;
    line-height: 1.6;
    resize: vertical;
    font-family: inherit;
  }
  .auth-textarea:focus {
    border-color: #4fc3f7;
    background: rgba(79, 195, 247, 0.08);
    box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.15);
  }
  .auth-textarea::placeholder { color: #64748b; }
</style>
</head>
<body>

<div class="auth-page" style="justify-content: center; align-items: flex-start; padding-top: 5vh; overflow-y: auto;">
  <div class="auth-form-container" style="width: 100%; max-width: 720px; border-left: none; border-radius: 20px; padding: 40px; background: rgba(17, 24, 39, 0.7);">
    <div class="auth-box" style="max-width: 100%;">
      
      <div class="auth-header">
        <img src="photo/un.png" alt="IECP">
        <h2>建立你的国家</h2>
        <p>填写国家信息，开启你的国际博弈之旅</p>
      </div>

      <form id="formRegister" onsubmit="handleRegister(event)">
        <!-- 账号信息 -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="auth-input-group">
            <label>登录邮箱 <span style="color:#f56565">*</span></label>
            <i class="fa-regular fa-envelope icon"></i>
            <input type="email" id="regEmail" placeholder="用于登录" required>
          </div>
          <div class="auth-input-group">
            <label>国家名 <span style="color:#f56565">*</span></label>
            <i class="fa-solid fa-landmark-flag icon"></i>
            <input type="text" id="regUsername" placeholder="如：亚斯共和国" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="auth-input-group">
            <label>密码 <span style="color:#f56565">*</span></label>
            <i class="fa-solid fa-lock icon"></i>
            <input type="password" id="regPassword" placeholder="至少6位" required>
          </div>
          <div class="auth-input-group">
            <label>确认密码 <span style="color:#f56565">*</span></label>
            <i class="fa-solid fa-lock icon"></i>
            <input type="password" id="regPassword2" placeholder="再次输入" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="auth-input-group">
            <label>社会性质 <span style="color:#f56565">*</span></label>
            <i class="fa-solid fa-scale-balanced icon"></i>
            <input type="text" id="regSocial" placeholder="如：社会主义共和国" required>
          </div>
          <div class="auth-input-group">
            <label>首都 <span style="color:#f56565">*</span></label>
            <i class="fa-solid fa-city icon"></i>
            <input type="text" id="regCapital" placeholder="如：蓬溪格勒" required>
          </div>
        </div>

        <div class="auth-input-group">
          <label>官方语言 <span style="color:#f56565">*</span></label>
          <i class="fa-solid fa-language icon"></i>
          <input type="text" id="regLanguage" placeholder="如：亚斯语、俄语" required>
        </div>

        <!-- 🚨 新增：国家介绍 -->
        <div class="auth-input-group">
          <label>国家介绍 <span style="color:#a0aec0; font-size:12px;">(选填)</span></label>
          <textarea id="regDescription" class="auth-textarea" placeholder="向世界介绍你的国家历史、文化或现状..."></textarea>
        </div>

        <!-- 图片上传：自定义虚线框 -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px;">
          <div class="auth-input-group">
            <label>上传国旗 <span style="color:#f56565">*</span></label>
            <label class="custom-upload" for="regFlag">
              <i class="fa-regular fa-image"></i>
              <span class="placeholder">点击上传国旗</span>
              <div class="file-preview">
                <i class="fa-solid fa-flag"></i>
                <span id="flagName">已选择</span>
              </div>
              <input type="file" id="regFlag" accept="image/*" required style="display:none;">
            </label>
          </div>
          <div class="auth-input-group">
            <label>上传国徽 <span style="color:#f56565">*</span></label>
            <label class="custom-upload" for="regEmblem">
              <i class="fa-regular fa-image"></i>
              <span class="placeholder">点击上传国徽</span>
              <div class="file-preview">
                <i class="fa-solid fa-shield-halved"></i>
                <span id="emblemName">已选择</span>
              </div>
              <input type="file" id="regEmblem" accept="image/*" required style="display:none;">
            </label>
          </div>
        </div>

        <div class="auth-msg" id="msgReg" style="color: #f56565; font-weight: bold; margin-top: 15px; text-align: center;"></div>
        <button type="submit" class="btn-auth" id="btnRegister" style="margin-top: 20px;">立即建国</button>
        
        <div class="auth-links" style="justify-content: center; margin-top: 20px;">
          <a href="login.html" style="color: #a0aec0; text-decoration: none;">已有账号？返回登录</a>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
// 监听文件选择，更新 UI
document.getElementById('regFlag').addEventListener('change', function() {
  if (this.files.length > 0) {
    this.parentNode.classList.add('has-file');
    document.getElementById('flagName').innerText = this.files[0].name;
  }
});
document.getElementById('regEmblem').addEventListener('change', function() {
  if (this.files.length > 0) {
    this.parentNode.classList.add('has-file');
    document.getElementById('emblemName').innerText = this.files[0].name;
  }
});

function setMsg(id, text, type) {
  const el = document.getElementById(id);
  el.innerText = text;
  el.style.color = type === 'error' ? '#f56565' : '#48bb78';
}

async function handleRegister(e) {
  e.preventDefault();
  
  if (!window.IECP || !IECP.client) {
    return setMsg('msgReg', '系统核心组件未加载，请检查网络并强制刷新页面（Ctrl+F5）', 'error');
  }

  const email = document.getElementById('regEmail').value.trim();
  const username = document.getElementById('regUsername').value.trim();
  const pwd = document.getElementById('regPassword').value;
  const pwd2 = document.getElementById('regPassword2').value;
  const social = document.getElementById('regSocial').value.trim();
  const capital = document.getElementById('regCapital').value.trim();
  const lang = document.getElementById('regLanguage').value.trim();
  const desc = document.getElementById('regDescription').value.trim(); // 🚨 获取介绍
  const flagFile = document.getElementById('regFlag').files[0];
  const emblemFile = document.getElementById('regEmblem').files[0];

  if (pwd !== pwd2) return setMsg('msgReg', '两次输入的密码不一致', 'error');
  if (pwd.length < 6) return setMsg('msgReg', '密码至少 6 位', 'error');
  if (!flagFile || !emblemFile) return setMsg('msgReg', '请上传国旗和国徽', 'error');

  const btn = document.getElementById('btnRegister');
  btn.disabled = true; btn.innerText = '正在建立国家...';
  setMsg('msgReg', '', '');

  try {
    // 1. 注册账号
    const { data: authData, error: authErr } = await IECP.client.auth.signUp({
      email: email,
      password: pwd,
      options: { data: { nickname: username } }
    });

    if (authErr) throw new Error(authErr.message);
    if (!authData.user) throw new Error('注册失败，请重试');

    if (!authData.session) {
      throw new Error('注册成功，但需要在邮箱点击验证链接后才能登录。请联系管理员关闭邮件验证。');
    }

    const userId = authData.user.id;

    // 2. 上传图片
    const uploadFile = async (bucket, file, prefix) => {
      const ext = file.name.split('.').pop();
      const path = `${userId}/${prefix}-${Date.now()}.${ext}`;
      const { error } = await IECP.client.storage.from(bucket).upload(path, file);
      if (error) throw new Error('图片上传失败：' + error.message);
      return IECP.client.storage.from(bucket).getPublicUrl(path).data.publicUrl;
    };

    const flagUrl = await uploadFile('flags', flagFile, 'flag');
    const emblemUrl = await uploadFile('emblems', emblemFile, 'emblem');

    // 3. 写入数据库（加入 description 字段）
    const { error: dbErr } = await IECP.client.from('profiles').insert({
      id: userId,
      username: username,
      social_system: social,
      capital: capital,
      official_language: lang,
      description: desc || null, // 🚨 保存介绍，没填就是 null
      flag_url: flagUrl,
      emblem_url: emblemUrl
    });

    if (dbErr) throw new Error('写入档案失败：' + dbErr.message);

    setMsg('msgReg', '建立成功！正在跳转...', 'success');
    setTimeout(() => location.replace('index.html'), 1000);

  } catch (err) {
    setMsg('msgReg', err.message, 'error');
    btn.disabled = false; btn.innerText = '立即建国';
  }
}
</script>
</body>
</html>
