<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IECP · 最高系统控制台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  #particle-canvas { position: fixed; inset: 0; z-index: -1; background: #05070a; }
  .admin-container { max-width: 1300px; margin: 40px auto; position: relative; z-index: 10; padding: 0 20px; }
  .admin-tabs { display: flex; gap: 10px; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 16px; overflow-x: auto; }
  .admin-tab { background: transparent; border: none; color: var(--muted); font-size: 15px; padding: 10px 20px; cursor: pointer; border-radius: 8px; transition: 0.3s; font-weight: bold; white-space: nowrap; }
  .admin-tab:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .admin-tab.active { color: var(--gold); background: rgba(212,175,55,0.1); box-shadow: inset 0 0 0 1px rgba(212,175,55,0.3); }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .panel-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  .panel-card h3 { margin: 0 0 20px; font-size: 18px; color: #fff; border-left: 4px solid var(--gold); padding-left: 12px; display: flex; justify-content: space-between; align-items: center;}

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; text-align: center; }
  .stat-box b { display: block; font-size: 28px; color: var(--gold-2); font-family: var(--mono); margin-bottom: 6px; }
  .stat-box span { font-size: 12.5px; color: var(--muted); letter-spacing: 1px; }

  .input-control { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 10px 14px; color: #fff; outline: none; font-family: inherit; transition: 0.2s; box-sizing: border-box; font-size: 13px; }
  .input-control:focus { border-color: var(--gold); }
  .input-control option { background: #111827; color: #fff; }

  .admin-table { width: 100%; border-collapse: collapse; text-align: left; }
  .admin-table th { padding: 12px; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: normal; }
  .admin-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; font-size: 13.5px;}
  .admin-table tr:hover td { background: rgba(255,255,255,0.02); }

  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
  
  .res-tags { display: flex; flex-wrap: wrap; gap: 4px; font-size: 11px; font-family: var(--mono); }
  .res-tag { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; }
  
  .war-card { background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.2); border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .war-vs { font-size: 24px; font-weight: 900; color: #ef4444; font-family: var(--mono); }
  .war-side { flex: 1; min-width: 200px; text-align: center; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; }
  .war-side b { display: block; font-size: 16px; color: #fff; margin-bottom: 8px; }
  .war-troops { font-size: 12px; color: var(--muted); text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  
  .admin-modal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; }
  .admin-modal.show { display: flex; }
  .admin-modal-box { width: 100%; max-width: 500px; background: #0f172a; border: 1px solid var(--border-2); border-radius: 16px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
  
  @media (max-width: 768px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .war-card { flex-direction: column; }
  }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<header class="iecp-topbar" id="adminHeader" style="background:rgba(5,7,10,0.8);">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span style="color:var(--red);">SYS_CORE</span></div></a>
    <div style="margin-left:auto; color:var(--red); font-weight:bold; letter-spacing:2px;">
      <i class="fa-solid fa-satellite-dish fa-fade"></i> 最高权限指挥中心
    </div>
  </div>
</header>

<main class="admin-container" id="adminWrap">
  <div class="loading-state"><div class="spinner"></div><span>正在验证最高权限...</span></div>
</main>

<!-- 发资源/道具弹窗 -->
<div class="admin-modal" id="giveModal">
  <div class="admin-modal-box">
    <h3 id="giveTitle" style="color:var(--gold); border-bottom:1px solid var(--border); padding-bottom:10px;">发放物资</h3>
    <input type="hidden" id="giveTargetId">
    
    <div style="margin-top:16px;">
      <label style="font-size:12px; color:var(--muted);">发放资金 (₽)</label>
      <input type="number" id="giveMoney" class="input-control" placeholder="留空或填0则不发" value="0">
    </div>
    
    <div style="margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div>
        <label style="font-size:12px; color:var(--muted);">资源类型</label>
        <select id="giveResType" class="input-control">
          <option value="">-- 不发资源 --</option>
          <option value="oil">原油</option>
          <option value="gas">天然气</option>
          <option value="iron_ore">铁矿石</option>
          <option value="rare_metal">稀有金属</option>
          <option value="food">粮食</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; color:var(--muted);">资源数量</label>
        <input type="number" id="giveResAmount" class="input-control" placeholder="数量">
      </div>
    </div>

    <div style="margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div>
        <label style="font-size:12px; color:var(--muted);">道具名称</label>
        <select id="giveItemName" class="input-control">
          <option value="">-- 不发道具 --</option>
          <option value="间谍卫星">间谍卫星</option>
          <option value="初级影响力包">初级影响力包</option>
          <option value="中级影响力包">中级影响力包</option>
          <option value="高级影响力包">高级影响力包</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; color:var(--muted);">道具数量</label>
        <input type="number" id="giveItemQty" class="input-control" placeholder="数量">
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button class="btn btn-ghost" onclick="document.getElementById('giveModal').classList.remove('show')">取消</button>
      <button class="btn btn-gold" onclick="submitGive()">确认发放</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
var I = IECP; var profile = null; 
var allUsers = []; var allResources = {}; var allMilitaries = {}; var allWars = [];

I.requireAuth().then(function(ok) {
  if (!ok) return;
  I.getProfile(true).then(function(p) {
    if (!p || p.role !== 'admin') { 
      I.$('#adminWrap').innerHTML = `<div class="empty-state"><i class="fa-solid fa-ban" style="color:var(--red); font-size:40px;"></i><p style="color:var(--red); font-size:18px;">拒绝访问</p></div>`; 
      return; 
    }
    profile = p;
    renderLayout(); loadData();
  });
});

function renderLayout() {
  I.$('#adminWrap').innerHTML = `
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchTab(this, 'tab-dash')"><i class="fa-solid fa-chart-pie"></i> 系统总览</button>
      <button class="admin-tab" onclick="switchTab(this, 'tab-users')"><i class="fa-solid fa-users-gear"></i> 国家管理</button>
      <button class="admin-tab" onclick="switchTab(this, 'tab-wars')"><i class="fa-solid fa-crosshairs"></i> 战争监控</button>
      <button class="admin-tab" onclick="switchTab(this, 'tab-shop')"><i class="fa-solid fa-crown"></i> 官方上架</button>
      <button class="admin-tab" onclick="switchTab(this, 'tab-shop-mgr')"><i class="fa-solid fa-list-check"></i> 官方商品管理</button>
      <button class="admin-tab" onclick="switchTab(this, 'tab-email')"><i class="fa-solid fa-envelope"></i> 邮件群发</button>
      <button class="admin-tab" onclick="switchTab(this, 'tab-broadcast')"><i class="fa-solid fa-rocket"></i> 全服空投</button>
      <button class="admin-tab" onclick="switchTab(this, 'tab-notify')"><i class="fa-solid fa-bullhorn"></i> 全服通知</button>
      <button class="admin-tab" onclick="switchTab(this, 'tab-disaster')"><i class="fa-solid fa-cloud-bolt"></i> 灾害设置</button>
    </div>

    <!-- 1. 总览 -->
    <div id="tab-dash" class="admin-panel active">
      <div class="panel-card">
        <h3>全服实时数据</h3>
        <div class="stats-grid">
          <div class="stat-box"><b id="statTotalUsers">-</b><span>注册国家总数</span></div>
          <div class="stat-box"><b id="statTotalMoney">-</b><span>全服资金总额 (₽)</span></div>
          <div class="stat-box"><b id="statTotalWars">-</b><span>进行中的战争</span></div>
          <div class="stat-box"><b id="statTotalTransfers">-</b><span>累计跨国转账</span></div>
        </div>
      </div>
      <div class="panel-card">
        <h3>全服财富榜 (Top 3)</h3>
        <ul id="topRichList" style="list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:12px;"></ul>
      </div>
      <div class="panel-card" style="border-color: rgba(239,68,68,0.3);">
        <h3 style="color:var(--red); border-left-color:var(--red);">紧急干预</h3>
        <button class="btn btn-red" onclick="forcePeace()"><i class="fa-solid fa-dove"></i> 一键强制全服停战</button>
      </div>
    </div>

    <!-- 2. 国家管理 -->
    <div id="tab-users" class="admin-panel">
      <div class="panel-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h3 style="margin:0; border:none; padding:0;">国家档案与物资操作</h3>
          <input type="text" id="userSearchInput" class="input-control" placeholder="搜索国家名称..." style="max-width:250px;" oninput="filterUserTable()">
        </div>
        <div style="max-height: 600px; overflow-y: auto; overflow-x: auto;">
          <table class="admin-table">
            <thead><tr><th>国家 / 银行信息</th><th>国库余额 / 影响力</th><th>战略资源</th><th style="text-align:right;">管理操作</th></tr></thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 3. 战争监控 -->
    <div id="tab-wars" class="admin-panel">
      <div class="panel-card">
        <h3><i class="fa-solid fa-radar" style="color:var(--red);"></i> 交战双方兵力实时对比</h3>
        <div id="warMonitorWrap"></div>
      </div>
    </div>

    <!-- 4. 官方上架 -->
    <div id="tab-shop" class="admin-panel">
      <div class="panel-card">
        <h3><i class="fa-solid fa-store" style="color:var(--gold);"></i> 官方商城上架</h3>
        <div style="display:flex; gap:16px; margin-bottom:16px;">
          <div style="flex:1;">
            <label style="font-size:12px; color:var(--muted);">商品类型</label>
            <select id="shopType" class="input-control" onchange="toggleShopFields()">
              <option value="resource">战略资源包</option>
              <option value="influence">影响力道具</option>
              <option value="spy">间谍卫星</option>
            </select>
          </div>
          <div style="flex:2;">
            <label style="font-size:12px; color:var(--muted);">商品标题</label>
            <input type="text" id="shopTitle" class="input-control" placeholder="如：官方特惠原油包">
          </div>
        </div>

        <div id="shopResRow" style="margin-bottom:16px;">
          <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:6px;">选择包含的资源 (可多选)</label>
          <div style="display:flex; gap:10px; margin-bottom:8px;"><label><input type="checkbox" id="cbOil"> 原油</label><input type="number" id="amtOil" class="input-control" style="width:100px;" placeholder="数量"></div>
          <div style="display:flex; gap:10px; margin-bottom:8px;"><label><input type="checkbox" id="cbGas"> 天然气</label><input type="number" id="amtGas" class="input-control" style="width:100px;" placeholder="数量"></div>
          <div style="display:flex; gap:10px; margin-bottom:8px;"><label><input type="checkbox" id="cbIron"> 铁矿石</label><input type="number" id="amtIron" class="input-control" style="width:100px;" placeholder="数量"></div>
          <div style="display:flex; gap:10px; margin-bottom:8px;"><label><input type="checkbox" id="cbRare"> 稀有金属</label><input type="number" id="amtRare" class="input-control" style="width:100px;" placeholder="数量"></div>
          <div style="display:flex; gap:10px; margin-bottom:8px;"><label><input type="checkbox" id="cbFood"> 粮食</label><input type="number" id="amtFood" class="input-control" style="width:100px;" placeholder="数量"></div>
        </div>

        <div id="shopInfluenceRow" style="display:none; margin-bottom:16px;">
          <label style="font-size:12px; color:var(--muted);">影响力等级</label>
          <select id="shopInfLevel" class="input-control">
            <option value="初级">初级影响力包 (+100)</option>
            <option value="中级">中级影响力包 (+500)</option>
            <option value="高级">高级影响力包 (+2000)</option>
          </select>
        </div>

        <div style="display:flex; gap:16px; margin-bottom:16px;">
          <div style="flex:1;"><label style="font-size:12px; color:var(--muted);">单价 (₽)</label><input type="number" id="shopPrice" class="input-control" placeholder="如：50000"></div>
          <div style="flex:1;"><label style="font-size:12px; color:var(--muted);">库存数量 (份)</label><input type="number" id="shopQty" class="input-control" placeholder="如：10"></div>
        </div>

        <button class="btn btn-gold" onclick="publishOfficialItem()"><i class="fa-solid fa-cloud-arrow-up"></i> 立即官方上架</button>
      </div>
    </div>

    <!-- 5. 官方商品管理 -->
    <div id="tab-shop-mgr" class="admin-panel">
      <div class="panel-card">
        <h3>在售官方商品</h3>
        <table class="admin-table">
          <thead><tr><th>商品</th><th>价格</th><th>库存</th><th style="text-align:right;">操作</th></tr></thead>
          <tbody id="officialShopBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 🚨 6. 邮件群发 -->
    <div id="tab-email" class="admin-panel">
      <div class="panel-card">
        <h3><i class="fa-solid fa-envelope" style="color:var(--gold);"></i> 全服电子邮箱群发</h3>
        <div style="background:rgba(79,195,247,0.1); border:1px solid rgba(79,195,247,0.3); border-radius:8px; padding:12px; margin-bottom:20px; font-size:13px; color:#94a3b8; line-height:1.6;">
          <b style="color:var(--cyan);"><i class="fa-solid fa-circle-info"></i> 操作说明：</b><br>
          出于安全和隐私限制，前端无法直接读取底层邮箱列表。请先在 Supabase 的 SQL Editor 中执行：<br>
          <code style="color:var(--gold-2); background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:4px;">SELECT email FROM auth.users;</code><br>
          将查出的邮箱复制，并用逗号（,）隔开粘贴在下方，点击发送会唤起您电脑上的邮箱软件。
        </div>
        
        <div style="margin-bottom:16px;">
          <label style="font-size:12px; color:var(--muted);">收件人邮箱列表 (逗号分隔)</label>
          <textarea id="emailRecipients" class="input-control" style="min-height:60px;" placeholder="admin@qq.com, player1@163.com, player2@gmail.com..."></textarea>
        </div>
        <div style="margin-bottom:16px;">
          <label style="font-size:12px; color:var(--muted);">邮件主题</label>
          <input type="text" id="emailSubject" class="input-control" placeholder="IECP 重要更新通知">
        </div>
        <div style="margin-bottom:16px;">
          <label style="font-size:12px; color:var(--muted);">邮件正文 (纯文本)</label>
          <textarea id="emailBody" class="input-control" style="min-height:120px;" placeholder="尊敬的国家元首，您好……"></textarea>
        </div>
        <button class="btn btn-gold" onclick="sendBatchEmail()"><i class="fa-solid fa-paper-plane"></i> 唤起邮件客户端发送</button>
      </div>
    </div>

    <!-- 7. 全服空投 -->
    <div id="tab-broadcast" class="admin-panel">
      <div class="panel-card">
        <h3>全服物资空投</h3>
        <div style="display:flex; gap:16px; margin-bottom:16px;">
          <div style="flex:1;"><label style="font-size:12px; color:var(--muted);">发放资金 (₽)</label><input type="number" id="bcMoney" class="input-control" placeholder="如：10000"></div>
          <div style="flex:1;">
            <label style="font-size:12px; color:var(--muted);">发放战略资源</label>
            <div style="display:flex; gap:10px;">
              <select id="bcResType" class="input-control" style="flex:1;">
                <option value="">-- 不发 --</option>
                <option value="oil">原油</option>
                <option value="gas">天然气</option>
                <option value="iron_ore">铁矿石</option>
                <option value="rare_metal">稀有金属</option>
                <option value="food">粮食</option>
              </select>
              <input type="number" id="bcResAmount" class="input-control" placeholder="数量" style="flex:1;">
            </div>
          </div>
        </div>
        <div style="display:flex; gap:16px; margin-bottom:16px;">
          <div style="flex:1;">
            <label style="font-size:12px; color:var(--muted);">发放全服道具</label>
            <select id="bcItemSelect" class="input-control">
              <option value="">-- 不发 --</option>
              <option value="间谍卫星">间谍卫星</option>
              <option value="初级影响力包">初级影响力包</option>
              <option value="中级影响力包">中级影响力包</option>
              <option value="高级影响力包">高级影响力包</option>
            </select>
          </div>
          <div style="flex:1;"><label style="font-size:12px; color:var(--muted);">每人数量</label><input type="number" id="bcItemQty" class="input-control" placeholder="如：1" min="1"></div>
        </div>
        
        <div style="display:flex; gap:16px; flex-direction:column; margin-top:16px;">
          <button class="btn btn-gold" style="width:100%; padding:12px;" onclick="doBroadcast()"><i class="fa-solid fa-rocket"></i> 执行全服空投</button>
        </div>

        <hr style="border-color:rgba(255,255,255,0.1); margin:24px 0;">
        
        <h3 style="margin-bottom:16px; border-left-color:var(--red); color:var(--red);"><i class="fa-solid fa-triangle-exclamation"></i> 降下全服天灾</h3>
        <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end;">
          <div style="flex:1; min-width:150px;">
            <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:6px;">灾害类型</label>
            <select id="disasterType" class="input-control">
              <option value="fire"><i class="fa-solid fa-fire"></i> 火灾 (损失原油)</option>
              <option value="flood"><i class="fa-solid fa-water"></i> 洪水 (损失稀有金属)</option>
              <option value="earthquake"><i class="fa-solid fa-house-crack"></i> 地震 (损失铁矿石)</option>
              <option value="drought"><i class="fa-solid fa-sun"></i> 旱灾 (损失粮食)</option>
            </select>
          </div>
          <div style="flex:1; min-width:150px;">
            <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:6px;">基础损失比例 (0.01 - 1)</label>
            <input type="number" id="disasterPct" class="input-control" placeholder="如：0.3" value="0.3" step="0.05" min="0.01" max="1">
          </div>
          <button class="btn btn-red" style="flex:1; min-width:120px; height:42px;" onclick="triggerGlobalDisaster()"><i class="fa-solid fa-cloud-bolt"></i> 降下天灾</button>
        </div>
      </div>
    </div>

    <!-- 8. 全服通知 -->
    <div id="tab-notify" class="admin-panel">
      <div class="panel-card">
        <h3>发送全服系统通知</h3>
        <input type="text" id="sysNotifTitle" class="input-control" placeholder="通知标题" style="margin-bottom:12px;">

async function loadData() {
  const [usersRes, resourcesRes, milRes, warsRes, txRes] = await Promise.all([
    I.client.from('profiles').select('*').order('created_at', { ascending: false }),
    I.client.from('country_resources').select('*'),
    I.client.from('military').select('*'),
    I.client.from('wars').select('*').eq('status', 'ongoing'),
    I.client.from('transfers').select('*', { count: 'exact', head: true })
  ]);
  
  allUsers = usersRes.data || [];
  var resources = resourcesRes.data || [];
  allMilitaries = milRes.data || [];
  allWars = warsRes.data || [];
  
  allResources = {};
  resources.forEach(r => { allResources[r.country_id] = r; });

  var milMap = {};
  allMilitaries.forEach(m => { milMap[m.country_id] = m; });

  var totalMoney = 0;
  allUsers.forEach(u => totalMoney += (u.balance || 0));
  
  if(I.$('#statTotalUsers')) {
    I.$('#statTotalUsers').innerText = allUsers.length;
    I.$('#statTotalMoney').innerText = I.fmtNumber(totalMoney);
    I.$('#statTotalWars').innerText = allWars.length;
    I.$('#statTotalTransfers').innerText = txRes.count || 0;
  }

  var topRichList = I.$('#topRichList');
  if (topRichList) {
    const topUsers = [...allUsers].sort((a,b) => (b.balance||0) - (a.balance||0)).slice(0, 3);
    topRichList.innerHTML = topUsers.map((u, i) => `
      <li style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); padding:12px 16px; border-radius:8px; border-left:3px solid ${i===0?'var(--gold)':i===1?'silver':i===2?'#cd7f32':'#fff'};">
        <div style="display:flex; align-items:center; gap:12px;"><span style="font-size:18px; font-weight:bold; color:var(--muted);">${i+1}</span><span style="color:#fff; font-weight:bold;">${I.escapeHtml(u.username)}</span></div>
        <span style="color:var(--gold-2); font-family:var(--mono); font-size:16px;">${I.fmtNumber(u.balance)} ₽</span>
      </li>
    `).join('');
  }

  var tbody = I.$('#userTableBody');
  if (tbody) {
    tbody.innerHTML = allUsers.map(u => {
      var r = allResources[u.id] || {};
      var resHtml = `
        <div class="res-tags">
          <span class="res-tag">油:${I.fmtNumber(r.oil||0)}</span>
          <span class="res-tag">气:${I.fmtNumber(r.gas||0)}</span>
          <span class="res-tag">铁:${I.fmtNumber(r.iron_ore||0)}</span>
          <span class="res-tag">稀:${I.fmtNumber(r.rare_metal||0)}</span>
          <span class="res-tag">粮:${I.fmtNumber(r.food||0)}</span>
        </div>
      `;
      return `
      <tr class="user-row" data-name="${I.escapeHtml(u.username).toLowerCase()}">
        <td>
          <div style="color:#fff; font-weight:bold; margin-bottom:4px;">${I.escapeHtml(u.username)}</div>
          <div style="color:var(--muted); font-size:11px;">银行: ${I.escapeHtml(u.bank_name || '未绑定')}</div>
          <div style="color:var(--cyan); font-size:12px; font-family:var(--mono);">卡号: ${I.escapeHtml(u.bank_card || '未绑定')}</div>
        </td>
        <td>
          <div style="color:var(--gold-2); font-weight:bold;">${I.fmtNumber(u.balance)} ₽</div>
          <div style="color:var(--purple); font-size:12px;">影响力: ${u.influence || 0}</div>
          <div style="color:${u.role==='admin'?'#ef4444':'#94a3b8'}; font-size:11px;">${u.role === 'admin' ? '管理员' : '普通'}</div>
        </td>
        <td>${resHtml}</td>
        <td style="text-align:right;">
          <button class="btn btn-cyan btn-sm" onclick="openGiveModal('${u.id}', '${I.escapeHtml(u.username)}')" style="margin-bottom:4px;"><i class="fa-solid fa-gift"></i> 发物资</button>
          <button class="btn btn-gold btn-sm" onclick="promptEditMoney('${u.id}', '${u.balance}')" style="margin-bottom:4px;"><i class="fa-solid fa-pen"></i> 改钱</button>
          <button class="btn btn-red btn-sm" onclick="deleteUser('${u.id}')"><i class="fa-solid fa-trash"></i> 抹除</button>
        </td>
      </tr>
      `;
    }).join('');
  }

  var warWrap = I.$('#warMonitorWrap');
  if (warWrap) {
    if (!allWars.length) {
      warWrap.innerHTML = '<div style="text-align:center; padding:40px; color:var(--green);"><i class="fa-solid fa-dove" style="font-size:30px; margin-bottom:10px;"></i><p>目前世界和平，无交战国家。</p></div>';
    } else {
      warWrap.innerHTML = allWars.map(w => {
        var atk = allUsers.find(u => u.id === w.attacker_id) || { username: '未知' };
        var def = allUsers.find(u => u.id === w.defender_id) || { username: '未知' };
        var atkMil = milMap[w.attacker_id] || {};
        var defMil = milMap[w.defender_id] || {};

        function renderTroops(mil) {
          var html = '';
          for (var k in mil) {
            if (k !== 'id' && k !== 'country_id' && k !== 'custom_troops' && mil[k] > 0) {
              html += `<span>${k}: ${mil[k]}</span>`;
            }
          }
          return html || '<span>无驻军</span>';
        }

        return `
          <div class="war-card">
            <div class="war-side" style="border:1px solid rgba(239,68,68,0.3);">
              <b style="color:#ef4444;"><i class="fa-solid fa-crosshairs"></i> 攻方: ${I.escapeHtml(atk.username)}</b>
              <div class="war-troops">${renderTroops(atkMil)}</div>
            </div>
            <div class="war-vs">VS</div>
            <div class="war-side" style="border:1px solid rgba(79,195,247,0.3);">
              <b style="color:#4fc3f7;"><i class="fa-solid fa-shield-halved"></i> 守方: ${I.escapeHtml(def.username)}</b>
              <div class="war-troops">${renderTroops(defMil)}</div>
            </div>
          </div>
        `;
      }).join('');
    }
  }
}

window.triggerGlobalDisaster = async function() {
  var type = I.$('#disasterType').value;
  var pct = parseFloat(I.$('#disasterPct').value);
  
  if (isNaN(pct) || pct <= 0 || pct > 1) return I.toast('请输入 0.01 到 1 之间的损失比例', 'error');
  
  var typeName = { fire: '火灾', flood: '洪水', earthquake: '地震', drought: '旱灾' }[type] || type;
  var resName = { fire: '原油', flood: '稀有金属', earthquake: '铁矿石', drought: '粮食' }[type] || '资源';
  
  if (!confirm(`警告：此操作将扣除全服所有国家的基础比例 ${(pct * 100).toFixed(0)}% 的【${resName}】（受各国预报系统减免），确定降下【${typeName}】吗？`)) return;
  
  I.toast('正在计算并执行天灾...', 'info', 1500);
  
  try {
    const { data: forecasts, error: fErr } = await I.client.from('forecasts').select('*');
    if (fErr) throw fErr;
    
    const { data: resources, error: rErr } = await I.client.from('country_resources').select('*');
    if (rErr) throw rErr;
    
    var forecastMap = {};
    if (forecasts) {
      forecasts.forEach(function(f) {
        forecastMap[f.country_id] = f;
      });
    }
    
    var updatePromises = [];
    var notifList = []; 
    var resCol = type === 'fire' ? 'oil' : type === 'flood' ? 'rare_metal' : type === 'earthquake' ? 'iron_ore' : 'food';
    
    resources.forEach(function(r) {
      var f = forecastMap[r.country_id] || {};
      var lvl = 0;
      if (type === 'fire') lvl = f.fire_lvl || 0;
      else if (type === 'flood') lvl = f.flood_lvl || 0;
      else if (type === 'earthquake') lvl = f.earthquake_lvl || 0;
      else if (type === 'drought') lvl = f.drought_lvl || 0;
      
      var reduction = Math.min(lvl * 0.1, 0.5); 
      var actualLoss = pct * (1 - reduction);   
      
      var currentVal = r[resCol] || 0;
      var newVal = Math.max(0, currentVal * (1 - actualLoss));
      var lostAmount = currentVal - newVal;
      
      if (newVal < currentVal) {
        var updateObj = {};
        updateObj[resCol] = newVal;
        updatePromises.push(
          I.client.from('country_resources').update(updateObj).eq('country_id', r.country_id)
        );
        
        notifList.push({
          user_id: r.country_id,
          type: 'disaster',
          title: `天灾预警：全服${typeName}降临`,
          content: `一场突如其来的【${typeName}】席卷了您的国家。由于您的预警系统等级为 Lv.${lvl}（减伤 ${(reduction*100).toFixed(0)}%），您共损失了 ${I.fmtNumber(lostAmount)} 单位【${resName}】。请尽快重建家园、补充物资。`
        });
      }
    });
    
    if (updatePromises.length === 0) {
      return I.toast('所有国家的对应资源均为 0，无需降灾', 'info');
    }
    
    var results = await Promise.all(updatePromises);
    var errs = results.filter(function(res) { return res.error; });
    
    if (errs.length > 0) {
      console.error('降灾部分失败', errs);
      I.toast('部分降灾失败：' + errs[0].error.message, 'error');
    } else {
      var notifSuccess = true;
      var notifErrMsg = '';
      
      if (notifList.length > 0) {
        for (let i = 0; i < notifList.length; i += 500) {
          const batch = notifList.slice(i, i + 500);
          const { error: nErr } = await I.client.from('notifications').insert(batch);
          if (nErr) {
            notifSuccess = false;
            notifErrMsg = nErr.message;
            console.error('通知插入失败：', nErr);
            break;
          }
        }
      }
      
      if (!notifSuccess) {
        I.toast('资源已扣除，但通知发送失败：' + notifErrMsg, 'error', 5000);
      } else {
        I.toast('全服天灾已降临，通知已发送至仓库。请去首页或其它页面查看铃铛。', 'success', 4000);
      }
      loadData(); 
    }
  } catch (err) {
    I.toast('降灾执行出错：' + err.message, 'error');
  }
};

window.sendBatchEmail = function() {

  // 尝试唤起系统默认邮箱客户端

window.publishOfficialItem = async function() {
  var type = I.$('#shopType').value;
  var title = I.$('#shopTitle').value.trim();
  var price = parseInt(I.$('#shopPrice').value, 10);
  var qty = parseInt(I.$('#shopQty').value, 10);

  if (!title || !price || !qty) return I.toast('请完整填写标题、价格和数量', 'error');

  var p_data = {}; var p_type = 'other'; var p_unit = '份'; var p_desc = '';

  if (type === 'resource') {
    var resObj = {};
    if (I.$('#cbOil').checked && I.$('#amtOil').value) resObj.oil = parseInt(I.$('#amtOil').value);
    if (I.$('#cbGas').checked && I.$('#amtGas').value) resObj.gas = parseInt(I.$('#amtGas').value);
    if (I.$('#cbIron').checked && I.$('#amtIron').value) resObj.iron_ore = parseInt(I.$('#amtIron').value);
    if (I.$('#cbRare').checked && I.$('#amtRare').value) resObj.rare_metal = parseInt(I.$('#amtRare').value);
    if (I.$('#cbFood').checked && I.$('#amtFood').value) resObj.food = parseInt(I.$('#amtFood').value);
    if (Object.keys(resObj).length === 0) return I.toast('请至少勾选并填写一种资源', 'error');
    p_data = { effect: 'resource', resources: resObj }; p_type = 'resource'; p_desc = `官方特供战略资源包。`;
  } else if (type === 'influence') {
    var infLevel = I.$('#shopInfLevel').value;
    p_data = { effect: infLevel === '初级' ? 'influence_low' : infLevel === '中级' ? 'influence_mid' : 'influence_high' };
    p_unit = '个'; p_desc = `使用后可增加${infLevel}国际影响力。`;
  } else if (type === 'spy') {
    p_data = { effect: 'spy' }; p_unit = '个'; p_desc = `使用后可获取敌国详细资产情报。`;
  }

  var { data, error } = await I.client.rpc('admin_publish_item', {
    p_title: title, p_price: price, p_quantity: qty, p_unit: p_unit, p_desc: p_desc, p_type: p_type, p_data: p_data, p_image_url: null
  });

  if (error) return I.toast('上架失败：' + error.message, 'error');
  if (!data.ok) return I.toast(data.msg, 'error');
  I.toast('官方商品上架成功', 'success');
  I.$('#shopTitle').value = ''; I.$('#shopPrice').value = ''; I.$('#shopQty').value = '';
};

      <td style="color:var(--gold-2);">${I.fmtNumber(item.price)} ₽</td>
      <td style="color:var(--cyan);">${item.quantity}</td>
      <td style="text-align:right;"><button class="btn btn-red btn-sm" onclick="removeOfficialItem('${item.id}')"><i class="fa-solid fa-arrow-down"></i> 下架</button></td>
    </tr>
  `).join('');
}

window.removeOfficialItem = async function(id) {
  if (!confirm('确认下架该官方商品？')) return;
  var { error } = await I.client.from('market_items').update({ status: 'removed' }).eq('id', id);
  if (error) return I.toast(error.message, 'error');
  I.toast('已下架', 'success'); loadOfficialItems();
};

async function loadDisasterCfg() {
  var {data} = await I.client.from('disaster_config').select('*').eq('id', 1).single();
  if(data) {
    I.$('#cfgFire').value = data.fire_prob; I.$('#cfgFlood').value = data.flood_prob;
    I.$('#cfgEarth').value = data.earthquake_prob; I.$('#cfgDrought').value = data.drought_prob;
    I.$('#cfgLossPct').value = data.max_loss_pct;
  }
}

window.saveDisasterCfg = async function() {
  var d = { fire_prob: parseFloat(I.$('#cfgFire').value), flood_prob: parseFloat(I.$('#cfgFlood').value), earthquake_prob: parseFloat(I.$('#cfgEarth').value), drought_prob: parseFloat(I.$('#cfgDrought').value), max_loss_pct: parseFloat(I.$('#cfgLossPct').value) };
  await I.client.from('disaster_config').update(d).eq('id', 1);
  I.toast('配置已保存', 'success');
};
</script>
</body>
</html>
