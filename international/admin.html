// 粒子特效
(function initParticles() {
  const canvas = document.getElementById('particle-canvas'); const ctx = canvas.getContext('2d');
  let width, height; let particles = [];
  function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  class Particle {
    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5; this.radius = Math.random() * 1.5 + 0.5; }
    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
    draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(212, 175, 55, 0.4)'; ctx.fill(); }
  }
  for (let i = 0; i < 100; i++) particles.push(new Particle());
  function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
      particles[i].update(); particles[i].draw();
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(212, 175, 55, ${0.15 - dist / 800})`; ctx.stroke(); }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

const ADMIN_SECRET = "IECP-ROOT-2026";

window.verifyKey = async function() {
  var key = document.getElementById('secretKey').value.trim();
  var msg = document.getElementById('lockMsg');
  if (key !== ADMIN_SECRET) { msg.innerText = '密钥错误'; return; }
  msg.style.color = 'var(--gold-2)'; msg.innerText = '密钥正确，正在验证...';
  I.requireAuth().then(function(ok) {
    if (!ok) return;
    I.getProfile(true).then(function(p) {
      if (!p || p.role !== 'admin') { msg.style.color = 'var(--red)'; msg.innerText = '拒绝访问：你的账号不是管理员！'; return; }
      profile = p;
      document.getElementById('lockScreen').classList.add('hide');
      document.getElementById('adminHeader').classList.remove('hide');
      document.getElementById('adminWrap').classList.remove('hide');
      renderLayout(); loadData();
    });
  });
};

window.switchTab = function(btn, tabId) {
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tabId).classList.add('active');
  if (tabId === 'tab-banks') loadBanks();
  if (tabId === 'tab-dash') loadData();
  if (tabId === 'tab-disaster') loadDisasterCfg();
};

async function loadData() {
  const [usersRes, resourcesRes, inventoryRes, warsRes, txRes] = await Promise.all([
    I.client.from('profiles').select('*').order('created_at', { ascending: false }),
    I.client.from('country_resources').select('*'),
    I.client.from('market_items').select('*').eq('status', 'sold'),
    I.client.from('wars').select('*', { count: 'exact', head: true }).eq('status', 'ongoing'),
    I.client.from('transfers').select('*', { count: 'exact', head: true })
  ]);

  allUsers = usersRes.data || [];
  allResources = {};
  (resourcesRes.data || []).forEach(r => { allResources[r.country_id] = r; });
  allInventory = {};
  (inventoryRes.data || []).forEach(item => {
    if (!allInventory[item.buyer_id]) allInventory[item.buyer_id] = [];
    allInventory[item.buyer_id].push(item);
  });

  var totalMoney = 0;
  allUsers.forEach(u => totalMoney += (u.balance || 0));
  I.$('#statTotalUsers').innerText = allUsers.length;
  I.$('#statTotalMoney').innerText = I.fmtNumber(totalMoney);
  I.$('#statTotalWars').innerText = warsRes.count || 0;
  I.$('#statTotalTransfers').innerText = txRes.count || 0;

  const topUsers = [...allUsers].sort((a,b) => (b.balance||0) - (a.balance||0)).slice(0, 3);
  I.$('#topRichList').innerHTML = topUsers.map((u, i) => `
    <li style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); padding:12px 16px; border-radius:8px; border-left:3px solid ${i===0?'var(--gold)':i===1?'silver':i===2?'#cd7f32':'#fff'};">
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:18px; font-weight:bold; color:var(--muted);">${i+1}</span>
        <img src="${u.flag_url || I.avatarFallback(u.username)}" style="width:30px; height:20px; object-fit:cover; border-radius:3px;">
        <span style="color:#fff; font-weight:bold;">${I.escapeHtml(u.username)}</span>
      </div>
      <span style="color:var(--gold-2); font-family:var(--mono); font-size:16px;">${I.fmtNumber(u.balance)} ₽</span>
    </li>
  `).join('');

  var tbody = I.$('#userTableBody');
  tbody.innerHTML = allUsers.map(u => `
    <tr>
      <td>
        <div style="display:flex; align-items:center; gap:10px;">
          <img src="${u.flag_url || I.avatarFallback(u.username)}" style="width:30px; height:20px; object-fit:cover; border-radius:3px;">
          <span style="color:#fff; font-weight:bold;">${I.escapeHtml(u.username)}</span>
        </div>
      </td>
      <td style="color:var(--gold-2); font-family:var(--mono);">${I.fmtNumber(u.balance)} ₽</td>
      <td>${u.role === 'admin' ? '<span class="market-tag admin" style="margin:0;">管理员</span>' : '<span class="market-tag" style="margin:0;">普通</span>'}</td>
      <td style="text-align:right; display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn btn-cyan btn-sm" onclick="viewUserAssets('${u.id}', '${I.escapeHtml(u.username)}')"><i class="fa-solid fa-eye"></i> 透视资产</button>
        <button class="btn btn-gold btn-sm" onclick="promptEditMoney('${u.id}', '${I.escapeHtml(u.username)}', ${u.balance})"><i class="fa-solid fa-coins"></i> 改钱</button>
        <button class="btn btn-red btn-sm" onclick="deleteUser('${u.id}', '${I.escapeHtml(u.username)}')"><i class="fa-solid fa-trash"></i> 抹除</button>
      </td>
    </tr>
  `).join('');
}

window.viewUserAssets = function(userId, username) {
  var res = allResources[userId] || { oil: 0, gas: 0, iron_ore: 0, rare_metal: 0, food: 0 };
  var inv = allInventory[userId] || [];
  I.$('#assetTitle').innerText = `资产透视 · ${username}`;
  var resHtml = `
    <div class="asset-section-title"><i class="fa-solid fa-cubes"></i> 战略资源</div>
    <div class="asset-res-grid">
      <div class="asset-res-item"><span>原油储备</span><span>${I.fmtNumber(res.oil)} 万吨</span></div>
      <div class="asset-res-item"><span>天然气</span><span>${I.fmtNumber(res.gas)} 亿m³</span></div>
      <div class="asset-res-item"><span>铁矿石</span><span>${I.fmtNumber(res.iron_ore)} 万吨</span></div>
      <div class="asset-res-item"><span>稀有金属</span><span>${I.fmtNumber(res.rare_metal)} 吨</span></div>
      <div class="asset-res-item"><span>粮食储备</span><span>${I.fmtNumber(res.food)} 万吨</span></div>
    </div>
  `;
  var invHtml = `<div class="asset-section-title"><i class="fa-solid fa-boxes-stacked"></i> 国家仓库 (${inv.length} 件)</div>`;
  if (inv.length === 0) { invHtml += `<div style="color:var(--muted); font-size:13px; text-align:center; padding:20px;">仓库空空如也</div>`; } 
  else {
    invHtml += `<div class="asset-inv-list">`;
    inv.forEach(item => { invHtml += `<div class="asset-inv-item"><div style="display:flex; flex-direction:column; gap:4px;"><b>${I.escapeHtml(item.title)}</b><span style="font-size:11px; color:var(--muted-2); background:none; padding:0;">${I.fmtDate(item.sold_at).split(' ')[0]} 获得</span></div><span>× ${item.quantity}</span></div>`; });
    invHtml += `</div>`;
  }
  I.$('#assetBody').innerHTML = resHtml + invHtml;
  I.$('#assetModal').classList.add('show');
};

window.promptEditMoney = async function(userId, username, currentBalance) {
  var input = prompt(`修改【${username}】的国库余额。\n当前余额：${currentBalance} ₽\n请输入新余额：`, currentBalance);
  if (input === null) return;
  var newBal = parseInt(input, 10);
  if (isNaN(newBal) || newBal < 0) return I.toast('请输入正确的数字', 'error');
  var { error } = await I.client.from('profiles').update({ balance: newBal }).eq('id', userId);
  if (error) return I.toast('修改失败：' + error.message, 'error', 4000);
  I.toast(`余额已修改`, 'success');
  loadData();
};

window.deleteUser = async function(userId, username) {
  if (profile.id === userId) return I.toast('不能删除自己', 'error');
  if (!confirm(`⚠️ 确定要彻底删除国家【${username}】吗？`)) return;
  var { error } = await I.client.from('profiles').delete().eq('id', userId);
  if (error) return I.toast('删除失败：' + error.message, 'error');
  I.toast('国家已抹除', 'success');
  loadData();
};

window.forcePeace = async function() {
  if (!confirm('⚠️ 强制结束全服所有正在进行的战争？')) return;
  I.toast('正在执行强制停战...', 'success');
  var { error } = await I.client.rpc('admin_force_peace');
  if (error) return I.toast('执行失败：' + error.message, 'error');
  I.toast('全服已恢复和平！', 'success');
  loadData();
};

window.doBroadcast = async function() {
  var money = parseInt(I.$('#bcMoney').value, 10) || 0;
  var resType = I.$('#bcResType').value;
  var resAmount = parseInt(I.$('#bcResAmount').value, 10) || 0;
  var itemName = I.$('#bcItemName').value.trim();
  var itemQty = parseInt(I.$('#bcItemQty').value, 10) || 0;

  if (money <= 0 && (!resType || resAmount <= 0) && (!itemName || itemQty <= 0)) return I.toast('请至少填写一项要发放的物资', 'error');
  if (!confirm('⚠️ 警告：你正在向全服所有国家发放物资，确认执行？')) return;

  I.toast('正在执行空投...', 'success', 2000);
  var { error } = await I.client.rpc('admin_give_all', { money_amount: money, res_type: resType || null, res_amount: resAmount, item_name: itemName || null, item_qty: itemQty });
  if (error) I.toast('空投失败：' + error.message, 'error', 4000);
  else { I.toast('全服空投成功！', 'success', 3000); loadData(); }
};

async function loadBanks() {
  var { data } = await I.client.from('banks').select('*').order('created_at', { ascending: true });
  var ul = I.$('#bankList');
  if (!data || !data.length) { ul.innerHTML = '<li style="color:var(--muted);">暂无银行</li>'; return; }
  ul.innerHTML = data.map(b => `<li style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); padding:12px 16px; border-radius:8px;"><span style="color:#fff; font-weight:600;">${I.escapeHtml(b.name)}</span><button class="btn btn-red btn-sm" onclick="deleteBank('${b.id}')"><i class="fa-solid fa-trash"></i> 删除</button></li>`).join('');
}

window.addBank = async function() {
  var name = I.$('#newBankName').value.trim();
  if (!name) return I.toast('请输入银行名称', 'error');
  var { error } = await I.client.from('banks').insert({ name: name });
  if (error) return I.toast('添加失败：' + error.message, 'error');
  I.$('#newBankName').value = ''; I.toast('银行添加成功', 'success'); loadBanks();
};

window.deleteBank = async function(id) {
  if (!confirm('确定删除该银行吗？')) return;
  var { error } = await I.client.from('banks').delete().eq('id', id);
  if (error) return I.toast('删除失败', 'error');
  I.toast('银行已删除', 'success'); loadBanks();
};

// ===== 灾害与通知 =====
async function loadDisasterCfg() {
  var {data} = await I.client.from('disaster_config').select('*').eq('id', 1).single();
  if(data) {
    I.$('#cfgFire').value = data.fire_prob;
    I.$('#cfgFlood').value = data.flood_prob;
    I.$('#cfgEarth').value = data.earthquake_prob;
    I.$('#cfgDrought').value = data.drought_prob;
    I.$('#cfgLossPct').value = data.max_loss_pct;
  }
}

window.saveDisasterCfg = async function() {
  var d = {
    fire_prob: parseFloat(I.$('#cfgFire').value),
    flood_prob: parseFloat(I.$('#cfgFlood').value),
    earthquake_prob: parseFloat(I.$('#cfgEarth').value),
    drought_prob: parseFloat(I.$('#cfgDrought').value),
    max_loss_pct: parseFloat(I.$('#cfgLossPct').value)
  };
  await I.client.from('disaster_config').update(d).eq('id', 1);
  I.toast('灾害配置已更新', 'success');
};

window.sendSysNotif = async function() {
  var t = I.$('#sysNotifTitle').value.trim();
  var c = I.$('#sysNotifContent').value.trim();
  if(!t || !c) return I.toast('请输入标题和内容', 'error');
  
  var {data: users} = await I.client.from('profiles').select('id');
  var notifs = users.map(u => ({ user_id: u.id, type: 'system', title: t, content: c }));
  
  if(notifs.length) {
    await I.client.from('notifications').insert(notifs);
    I.toast('全服通知发送成功', 'success');
    I.$('#sysNotifTitle').value = ''; I.$('#sysNotifContent').value = '';
  }
};
</script>
