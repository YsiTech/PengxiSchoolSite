<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交易行 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .market-card { cursor: pointer; }
  .market-qty { font-size: 11px; color: var(--muted); background: var(--glass-2); padding: 2px 6px; border-radius: 4px; }
  
  /* 自定义上传框 */
  .custom-upload {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 80px; padding: 16px;
    background: rgba(0,0,0,0.2); border: 1.5px dashed var(--border-2);
    border-radius: var(--r-sm); cursor: pointer; transition: 0.2s;
    text-align: center; position: relative; overflow: hidden;
  }
  .custom-upload:hover { border-color: var(--gold); background: var(--glass-2); }
  .custom-upload i { font-size: 24px; color: var(--gold); margin-bottom: 6px; }
  .custom-upload span { font-size: 12px; color: var(--muted); }
  .custom-upload .file-preview {
    display: none; align-items: center; gap: 10px; background: var(--glass-3);
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); z-index: 2;
  }
  .custom-upload .file-preview img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; }
  .custom-upload .file-preview span { color: var(--ink); font-weight: 600; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .custom-upload.has-file { border-style: solid; border-color: var(--cyan); background: rgba(79,195,247,0.05); }
  .custom-upload.has-file > i, .custom-upload.has-file > span.placeholder { display: none; }
  .custom-upload.has-file .file-preview { display: flex; }

  /* 🚨 优化下拉框：半透明暗底，拒绝死板深蓝色 */
  select {
    background-color: rgba(0, 0, 0, 0.3) !important;
    color: var(--ink) !important;
    border: 1px solid var(--border-2) !important;
    border-radius: var(--r-sm);
    outline: none;
    cursor: pointer;
  }
  select:focus {
    border-color: var(--gold) !important;
  }
  /* 修复 Windows 浏览器下 option 纯黑或白底问题，改为深空灰 */
  select option {
    background-color: #111827 !important; 
    color: #fff !important;
  }
</style>
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html">
      <img src="photo/un.png" alt="IECP">
      <div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div>
    </a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<section class="iecp-page-head">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb">
      <a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>交易行</span>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px">
      <div>
        <h1><i class="fa-solid fa-store"></i> 交易行</h1>
        <p>以亚斯卢布（₽）结算 · 发布并管理你的交易物品</p>
      </div>
      <button class="btn btn-gold" id="openPublishBtn"><i class="fa-solid fa-plus"></i> 发布物品</button>
    </div>
  </div>
</section>

<main class="iecp-main">
  <div id="marketList">
    <div class="loading-state"><div class="spinner"></div><span>正在加载…</span></div>
  </div>
</main>

<!-- 上架物品弹窗 -->
<div class="iecp-modal" id="publishModal">
  <div class="iecp-modal-box glass-2" style="max-width:550px">
    <h3><i class="fa-solid fa-plus" style="color:var(--gold)"></i> 发布商品</h3>
    
    <!-- 分类切换 -->
    <div style="display:flex; gap:10px; margin:20px 0;">
      <button class="btn btn-gold" id="tabResource" onclick="switchType('resource')" style="flex:1; padding:10px;">国家战略资源</button>
      <button class="btn btn-ghost" id="tabOther" onclick="switchType('other')" style="flex:1; padding:10px;">其他自定义物品</button>
    </div>

    <form id="itemForm" style="margin-top:10px">
      
      <!-- 🚨 资源专属表单区 -->
      <div id="resourceFields" class="field-group" style="display:none;">
        <div class="field">
          <label>选择要出售的库存种类 <span class="req">*</span></label>
          <select id="iResType" style="padding:12px 14px;">
            <option value="oil">原油储备</option>
            <option value="gas">天然气</option>
            <option value="iron_ore">铁矿石</option>
            <option value="rare_metal">稀有金属</option>
            <option value="food">粮食储备</option>
          </select>
          <span class="profile-hint" id="myResHint" style="color:var(--gold-2);">当前拥有：加载中...</span>
        </div>
      </div>

      <!-- 通用表单区 -->
      <div class="field-group two">
        <div class="field">
          <label>商品标题 <span class="req">*</span></label>
          <input id="iTitle" type="text" placeholder="如：亚斯精钢限时特惠" maxlength="60">
        </div>
        <div class="field">
          <label>单价（亚斯卢布 ₽ / 单位） <span class="req">*</span></label>
          <input id="iPrice" type="number" placeholder="如 5000" min="1">
        </div>
      </div>
      
      <div class="field-group two">
        <!-- 🚨 核心改动：数量与单位并列 -->
        <div class="field">
          <label>上架数量 <span class="req">*</span></label>
          <div style="display:flex; gap:8px;">
            <input id="iQuantity" type="number" placeholder="数量" min="1" value="1" style="flex:1;">
            <select id="iUnit" style="width:100px; padding:0 10px;">
              <!-- 选项由 JS 动态生成 -->
            </select>
          </div>
        </div>

        <div class="field">
          <label>商品图片（可选）</label>
          <label class="custom-upload" id="marketUploadBox" for="iFile" style="min-height: 60px;">
            <i class="fa-solid fa-image"></i>
            <span class="placeholder">点击上传</span>
            <div class="file-preview">
              <img id="iFilePreview" src="" style="display:none;">
              <i id="iFileIcon" class="fa-solid fa-file" style="display:none;"></i>
              <span id="iFileName">未选择</span>
            </div>
            <input id="iFile" type="file" accept="image/*" style="display:none">
          </label>
        </div>
      </div>
      
      <div class="field-group">
        <div class="field">
          <label>商品描述</label>
          <textarea id="iDesc" placeholder="简单描述一下你的商品……" style="min-height:80px"></textarea>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">
        <span id="itemHint" style="font-size:13px;color:var(--red);margin-right:auto;align-self:center;font-weight:bold;"></span>
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('publishModal').classList.remove('open')">取消</button>
        <button class="btn btn-gold" type="submit" id="itemSubmit"><i class="fa-solid fa-check"></i> 确认发布</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP;
  var profile = null;
  var myResources = null; 
  var currentPublishType = 'resource';

  // 🚨 核心字典：资源的基础单位换算率
  var RES_CONFIG = {
    oil: { name: '原油储备', units: [ { label: '万吨', rate: 1 }, { label: '千吨', rate: 0.1 }, { label: '吨', rate: 0.0001 } ] },
    gas: { name: '天然气',   units: [ { label: '亿m³', rate: 1 }, { label: '万m³', rate: 0.0001 } ] },
    iron_ore: { name: '铁矿石', units: [ { label: '万吨', rate: 1 }, { label: '千吨', rate: 0.1 }, { label: '吨', rate: 0.0001 } ] },
    rare_metal: { name: '稀有金属', units: [ { label: '吨', rate: 1 }, { label: '千克', rate: 0.001 } ] },
    food: { name: '粮食储备', units: [ { label: '万吨', rate: 1 }, { label: '千吨', rate: 0.1 }, { label: '吨', rate: 0.0001 } ] }
  };

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('market');
    I.getProfile(true).then(function (p) {
      profile = p;
      loadMyResources(); 
      loadMarket();
    });
  });

  I.$('#openPublishBtn').addEventListener('click', function(){
    switchType('resource');
    I.$('#publishModal').classList.add('open');
  });

  window.switchType = function(type) {
    currentPublishType = type;
    var isRes = type === 'resource';
    
    I.$('#tabResource').className = isRes ? 'btn btn-gold' : 'btn btn-ghost';
    I.$('#tabOther').className = !isRes ? 'btn btn-gold' : 'btn btn-ghost';
    
    I.$('#resourceFields').style.display = isRes ? 'block' : 'none';
    
    if (isRes) {
      I.$('#iResType').dispatchEvent(new Event('change'));
    } else {
      I.$('#iTitle').value = ''; 
      I.$('#iUnit').innerHTML = '<option value="1">个</option>';
    }
  };

  I.$('#iResType').addEventListener('change', function() {
    var type = this.value;
    
    var unitHtml = '';
    RES_CONFIG[type].units.forEach(function(u) {
      unitHtml += `<option value="${u.rate}">${u.label}</option>`;
    });
    I.$('#iUnit').innerHTML = unitHtml;

    if (myResources) {
      var baseQty = parseFloat(myResources[type]) || 0;
      var displayUnit = RES_CONFIG[type].units[0];
      var displayQty = baseQty / displayUnit.rate;
      I.$('#myResHint').innerHTML = `当前国家库存：<b style="color:var(--cyan); font-size:14px;">${I.fmtNumber(displayQty)} ${displayUnit.label}</b>`;
    }
    
    if (!I.$('#iTitle').value.trim()) {
      I.$('#iTitle').value = '【资源】' + RES_CONFIG[type].name;
    }
  });

  function loadMyResources() {
    I.client.from('country_resources').select('*').eq('country_id', profile.id).maybeSingle().then(function(res){
      if (res.data) {
        myResources = res.data;
        I.$('#iResType').dispatchEvent(new Event('change')); 
      }
    });
  }

  I.$('#iFile').addEventListener('change', function() {
    var file = this.files[0];
    var box = I.$('#marketUploadBox');
    if (file) {
      box.classList.add('has-file');
      I.$('#iFileName').textContent = file.name;
      if (file.type.startsWith('image/')) {
        var reader = new FileReader();
        reader.onload = function(e) {
          I.$('#iFilePreview').src = e.target.result;
          I.$('#iFilePreview').style.display = 'block';
          I.$('#iFileIcon').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    } else {
      box.classList.remove('has-file');
      I.$('#iFileName').textContent = '未选择';
    }
  });

  function loadMarket() {
    I.client.from('market_items')
      .select('*, seller:profiles!market_items_seller_id_fkey(id, username, flag_url, role)')
      .eq('status', 'on_sale')
      .order('created_at', { ascending: false })
      .then(function (res) {
        var wrap = I.$('#marketList');
        var list = res.data || [];
        if (!list.length) {
          wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-store"></i><p>交易行暂无物品</p></div>';
          return;
        }
        var html = '<div class="market-grid">';
        list.forEach(function (m) {
          var seller = m.seller || {};
          var isAdmin = m.is_admin_post || seller.role === 'admin';
          var tag = isAdmin ? '<span class="market-tag admin"><i class="fa-solid fa-crown"></i> 官方</span>' : '';
          if (m.item_type === 'resource') {
            tag += '<span class="market-tag" style="color:var(--cyan); border-color:var(--cyan);"><i class="fa-solid fa-cubes"></i> 资源</span>';
          }

          var unitDisplay = m.custom_unit ? ` ${m.custom_unit}` : '';

          html +=
            '<article class="market-card glass" onclick="location.href=\'market-detail.html?id=' + m.id + '\'">' +
              '<div class="market-img">' +
                (m.image_url ? '<img src="' + I.escapeHtml(m.image_url) + '" alt="">' : '<i class="fa-solid fa-box-open"></i>') +
              '</div>' +
              '<div class="market-body">' +
                tag +
                '<h4>' + I.escapeHtml(m.title) + '</h4>' +
                '<p>' + I.escapeHtml(m.description || '（暂无描述）') + '</p>' +
                '<div class="market-price">' + I.fmtNumber(m.price) + ' <span>₽ / 单位</span></div>' +
                '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">' +
                  '<div style="font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;">' +
                    '<img src="' + I.escapeHtml(seller.flag_url || I.avatarFallback(seller.username)) + '" style="width:16px;height:12px;border-radius:2px;"> ' +
                    I.escapeHtml(seller.username || '未知') +
                  '</div>' +
                  '<span class="market-qty">库存 ' + m.quantity + unitDisplay + '</span>' +
                '</div>' +
              '</div>' +
            '</article>';
        });
        html += '</div>';
        wrap.innerHTML = html;
      });
  }

  I.$('#itemForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = I.$('#itemSubmit');
    var hint = I.$('#itemHint');
    var price = parseFloat(I.$('#iPrice').value);
    var qty = parseFloat(I.$('#iQuantity').value);
    var title = I.$('#iTitle').value.trim();
    var unitRate = parseFloat(I.$('#iUnit').value);
    var unitLabel = I.$('#iUnit').options[I.$('#iUnit').selectedIndex].text;

    if (!title) { hint.textContent = '请填写商品标题'; return; }
    if (!price || price < 1) { hint.textContent = '单价必须大于 0'; return; }
    if (!qty || qty < 1) { hint.textContent = '数量必须大于 0'; return; }

    var desc = I.$('#iDesc').value.trim();
    var resType = null;
    var imgUrl = null;
    var file = I.$('#iFile').files[0];
    
    var baseDeductQty = 0;

    if (currentPublishType === 'resource') {
      resType = I.$('#iResType').value;
      baseDeductQty = qty * unitRate; 
      
      var myQty = myResources ? (parseFloat(myResources[resType]) || 0) : 0;
      if (myQty < baseDeductQty) { 
        hint.textContent = `库存不足！你只有相当于 ${I.fmtNumber(myQty / unitRate)} ${unitLabel} 的资源。`; 
        return; 
      }
      
      desc = `【战略资源：${RES_CONFIG[resType].name}】 ` + desc;
    }

    btn.disabled = true;
    hint.textContent = '正在处理...';

    var deductPromise = Promise.resolve();
    if (currentPublishType === 'resource') {
      var updateRes = {};
      updateRes[resType] = parseFloat((myResources[resType] - baseDeductQty).toFixed(4));
      deductPromise = I.client.from('country_resources').update(updateRes).eq('country_id', profile.id);
    }

    deductPromise.then(function(dedRes) {
      if (dedRes && dedRes.error) throw new Error('扣除库存失败：' + dedRes.error.message);
      
      if (file) {
        var ext = (file.name.split('.').pop() || 'png').toLowerCase();
        var path = profile.id + '/' + Date.now() + '.' + ext;
        
        return I.client.storage.from('media').upload(path, file).then(function(storageRes) {
          if (storageRes.error) throw storageRes.error;
          imgUrl = I.client.storage.from('media').getPublicUrl(path).data.publicUrl;
        });
      }
    }).then(function() {
      return I.client.from('market_items').insert({
        seller_id: profile.id,
        title: title,
        price: price,       
        quantity: qty,      
        custom_unit: unitLabel,   
        base_quantity: baseDeductQty, 
        description: desc || null,
        image_url: imgUrl,
        item_type: currentPublishType,
        resource_type: resType,
        is_admin_post: profile.role === 'admin'
      });
    }).then(function (r) {
      btn.disabled = false;
      if (r.error) { hint.textContent = r.error.message; return; }
      
      I.toast('商品已发布', 'success');
      I.$('#itemForm').reset();
      I.$('#marketUploadBox').classList.remove('has-file');
      I.$('#publishModal').classList.remove('open');
      loadMyResources(); 
      loadMarket();
    }).catch(function(err) {
      btn.disabled = false;
      hint.textContent = err.message || '网络异常，发布失败';
    });
  });
})();
</script>
</body>
</html>
