<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交易行 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .market-card { cursor: pointer; }
  .market-qty { font-size: 11px; color: var(--muted); background: var(--glass-2); padding: 2px 6px; border-radius: 4px; }
  .custom-upload { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 80px; padding: 16px; background: rgba(0,0,0,0.2); border: 1.5px dashed var(--border-2); border-radius: var(--r-sm); cursor: pointer; transition: 0.2s; }
  .custom-upload.has-file { border-style: solid; border-color: var(--cyan); background: rgba(79,195,247,0.05); }
  select { background-color: rgba(0, 0, 0, 0.3) !important; color: var(--ink) !important; border: 1px solid var(--border-2) !important; border-radius: var(--r-sm); outline: none; padding:12px; }
</style>
</head>
<body>

<header class="iecp-topbar"><div class="iecp-topbar-inner"><a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a><nav class="iecp-nav" id="iecp-nav"></nav><div class="iecp-user" id="iecp-user"></div></div></header>

<section class="iecp-page-head">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb"><a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>交易行</span></div>
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px">
      <div><h1><i class="fa-solid fa-store"></i> 交易行</h1><p>发布资源或出售自制兵种</p></div>
      <button class="btn btn-gold" id="openPublishBtn"><i class="fa-solid fa-plus"></i> 发布物品</button>
    </div>
  </div>
</section>

<main class="iecp-main"><div id="marketList"><div class="loading-state"><div class="spinner"></div><span>正在加载…</span></div></div></main>

<div class="iecp-modal" id="publishModal">
  <div class="iecp-modal-box glass-2" style="max-width:550px">
    <h3><i class="fa-solid fa-plus" style="color:var(--gold)"></i> 发布商品</h3>
    <div style="display:flex; gap:10px; margin:20px 0;">
      <button class="btn btn-gold" id="tabResource" onclick="switchType('resource')" style="flex:1; padding:10px;">战略资源</button>
      <button class="btn btn-ghost" id="tabUnit" onclick="switchType('unit')" style="flex:1; padding:10px;">自定义兵种</button>
    </div>

    <form id="itemForm">
      <div id="resourceFields" class="field-group" style="display:none;">
        <div class="field">
          <label>选择资源种类 <span class="req">*</span></label>
          <select id="iResType">
            <option value="oil">原油储备</option>
            <option value="gas">天然气</option>
            <option value="iron_ore">铁矿石</option>
            <option value="rare_metal">稀有金属</option>
            <option value="food">粮食储备</option>
          </select>
        </div>
      </div>

      <div id="unitFields" class="field-group" style="display:none;">
        <div class="field">
          <label>选择你要出售的自定义兵种 <span class="req">*</span></label>
          <select id="iUnitId"></select>
        </div>
      </div>

      <div class="field-group two">
        <div class="field"><label>商品标题 <span class="req">*</span></label><input id="iTitle" type="text" placeholder="如：皇家卫队特惠" required></div>
        <div class="field"><label>单价（亚斯卢布 ₽） <span class="req">*</span></label><input id="iPrice" type="number" placeholder="5000" min="1" required></div>
      </div>
      
      <div class="field-group two">
        <div class="field"><label>上架数量 <span class="req">*</span></label><input id="iQuantity" type="number" value="1" min="1" required></div>
        <div class="field">
          <label>图片（可选）</label>
          <label class="custom-upload" id="marketUploadBox" for="iFile" style="min-height: 60px; padding:10px;"><i class="fa-solid fa-image"></i><span>点击上传</span><input id="iFile" type="file" accept="image/*" style="display:none"></label>
        </div>
      </div>
      
      <div class="field-group"><div class="field"><label>描述</label><textarea id="iDesc" style="min-height:60px"></textarea></div></div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('publishModal').classList.remove('open')">取消</button>
        <button class="btn btn-gold" type="submit" id="itemSubmit">确认发布</button>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP; var profile = null; var myResources = null; var myMil = null; var myCustomUnits = {}; var currentPublishType = 'resource';

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('market');
    I.getProfile(true).then(function (p) { profile = p; loadData(); loadMarket(); });
  });

  I.$('#openPublishBtn').addEventListener('click', function(){ switchType('resource'); I.$('#publishModal').classList.add('open'); });

  function loadData() {
    Promise.all([
      I.client.from('country_resources').select('*').eq('country_id', profile.id).maybeSingle(),
      I.client.from('military').select('custom_troops').eq('country_id', profile.id).maybeSingle(),
      I.client.from('custom_units').select('*')
    ]).then(function(res) {
      myResources = res[0].data || {}; myMil = res[1].data || {custom_troops:{}};
      (res[2].data || []).forEach(u => { myCustomUnits[u.id] = u; });
    });
  }

  window.switchType = function(type) {
    currentPublishType = type;
    I.$('#tabResource').className = type === 'resource' ? 'btn btn-gold' : 'btn btn-ghost';
    I.$('#tabUnit').className = type === 'unit' ? 'btn btn-gold' : 'btn btn-ghost';
    I.$('#resourceFields').style.display = type === 'resource' ? 'block' : 'none';
    I.$('#unitFields').style.display = type === 'unit' ? 'block' : 'none';

    if (type === 'unit') {
      var inv = myMil.custom_troops || {}; var html = '';
      for (var id in inv) {
        if (inv[id] > 0 && myCustomUnits[id]) {
          html += `<option value="${id}">${I.escapeHtml(myCustomUnits[id].name)} (库存:${inv[id]})</option>`;
        }
      }
      if (!html) html = '<option value="">你没有任何自定义兵种库存</option>';
      I.$('#iUnitId').innerHTML = html;
    }
  };

  // 🚨 修复：取消连表查询，改为两步获取，彻底消灭 400 报错
  function loadMarket() {
    I.client.from('market_items').select('*').eq('status', 'on_sale').order('created_at', { ascending: false }).then(function (res) {
      if (res.error) { console.error(res.error); return I.toast('加载失败', 'error'); }
      
      var wrap = I.$('#marketList'); var list = res.data || [];
      if (!list.length) { wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-store"></i><p>交易行暂无物品</p></div>'; return; }
      
      var sellerIds = [...new Set(list.map(m => m.seller_id))].filter(id => id); // 去重并过滤空值
      
      I.client.from('profiles').select('id, username, flag_url, role').in('id', sellerIds).then(function (profileRes) {
        var profileMap = {};
        (profileRes.data || []).forEach(p => { profileMap[p.id] = p; });

        var html = '<div class="market-grid">';
        list.forEach(function (m) {
          var seller = profileMap[m.seller_id] || {};
          var isOfficial = m.is_admin_post === true;
          var tag = isOfficial ? '<span class="market-tag admin">官方</span>' : '';
          if (m.item_type === 'resource') tag += '<span class="market-tag" style="color:var(--cyan)">资源</span>';
          if (m.item_type === 'unit') tag += '<span class="market-tag" style="color:var(--gold)">兵种</span>';

          html +=
            '<article class="market-card glass" onclick="location.href=\'market-detail.html?id=' + m.id + '\'">' +
              '<div class="market-img">' + (m.image_url ? '<img src="' + I.escapeHtml(m.image_url) + '">' : '<i class="fa-solid fa-box-open"></i>') + '</div>' +
              '<div class="market-body">' + tag + '<h4>' + I.escapeHtml(m.title) + '</h4><p>' + I.escapeHtml(m.description || '暂无描述') + '</p>' +
                '<div class="market-price">' + I.fmtNumber(m.price) + ' <span>₽</span></div>' +
                '<div style="display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--muted);">' +
                  '<div>' + (isOfficial ? 'IECP官方' : I.escapeHtml(seller.username || '未知')) + '</div>' +
                  '<span class="market-qty">库存 ' + I.fmtNumber(m.quantity) + '</span>' +
                '</div></div></article>';
        });
        wrap.innerHTML = html + '</div>';
      });
    });
  }

  I.$('#itemForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = I.$('#itemSubmit'); btn.disabled = true;
    var title = I.$('#iTitle').value.trim(); var price = parseFloat(I.$('#iPrice').value); var qty = parseFloat(I.$('#iQuantity').value);
    var file = I.$('#iFile').files[0]; var item_data = {};

    if (!title || price < 1 || qty < 1) { btn.disabled = false; return I.toast('填写有误', 'error'); }

    if (currentPublishType === 'resource') {
      var resType = I.$('#iResType').value;
      if ((myResources[resType] || 0) < qty) { btn.disabled = false; return I.toast('库存不足', 'error'); }
      item_data = { res_type: resType };
    } else {
      var uid = I.$('#iUnitId').value;
      var inv = myMil.custom_troops || {};
      if (!uid || (inv[uid] || 0) < qty) { btn.disabled = false; return I.toast('兵种库存不足', 'error'); }
      item_data = { unit_id: uid };
      inv[uid] -= qty;
      I.client.from('military').update({ custom_troops: inv }).eq('country_id', profile.id);
    }

    var uploadPromise = Promise.resolve(null);
    if (file) {
      var ext = file.name.split('.').pop(); var path = profile.id + '/' + Date.now() + '.' + ext;
      uploadPromise = I.client.storage.from('media').upload(path, file).then(r => I.client.storage.from('media').getPublicUrl(path).data.publicUrl);
    }

    uploadPromise.then(function(imgUrl) {
      if (currentPublishType === 'resource') {
        var resType = I.$('#iResType').value;
        var upRes = {}; upRes[resType] = (myResources[resType] || 0) - qty;
        I.client.from('country_resources').update(upRes).eq('country_id', profile.id);
      }
      return I.client.from('market_items').insert({
        seller_id: profile.id, title: title, price: price, quantity: qty,
        description: I.$('#iDesc').value, image_url: imgUrl,
        item_type: currentPublishType, item_data: item_data
      });
    }).then(function(r){
      btn.disabled = false; if(r.error) return I.toast(r.error.message, 'error');
      I.toast('发布成功', 'success'); I.$('#itemForm').reset(); I.$('#publishModal').classList.remove('open'); loadData(); loadMarket();
    });
  });
})();
</script>
</body>
</html>
