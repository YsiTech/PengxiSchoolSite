<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交易行 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .market-card { cursor: pointer; }
  .market-qty { font-size: 11px; color: var(--muted); background: var(--glass-2); padding: 2px 6px; border-radius: 4px; }
  
  /* 高颜值上传框 (复用样式) */
  .custom-upload {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 80px; padding: 16px;
    background: rgba(0,0,0,0.2); border: 1.5px dashed var(--border-2);
    border-radius: var(--r-sm); cursor: pointer; transition: 0.2s;
    text-align: center; position: relative; overflow: hidden;
  }
  .custom-upload:hover { border-color: var(--gold); background: var(--glass-2); }
  .custom-upload i { font-size: 24px; color: var(--gold); margin-bottom: 6px; }
  .custom-upload span { font-size: 12px; color: var(--muted); }
  .custom-upload .file-preview {
    display: none; align-items: center; gap: 10px; background: var(--glass-3);
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); z-index: 2;
  }
  .custom-upload .file-preview img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; }
  .custom-upload .file-preview span { color: var(--ink); font-weight: 600; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .custom-upload.has-file { border-style: solid; border-color: var(--cyan); background: rgba(79,195,247,0.05); }
  .custom-upload.has-file > i, .custom-upload.has-file > span.placeholder { display: none; }
  .custom-upload.has-file .file-preview { display: flex; }
</style>
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html">
      <img src="photo/un.png" alt="IECP">
      <div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div>
    </a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<section class="iecp-page-head">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb">
      <a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>交易行</span>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px">
      <div>
        <h1><i class="fa-solid fa-store"></i> 交易行</h1>
        <p>以亚斯卢布（₽）结算 · 发布并管理你的交易物品</p>
      </div>
      <button class="btn btn-gold" id="openPublishBtn"><i class="fa-solid fa-plus"></i> 发布物品</button>
    </div>
  </div>
</section>

<main class="iecp-main">
  <div id="marketList">
    <div class="loading-state"><div class="spinner"></div><span>正在加载…</span></div>
  </div>
</main>

<!-- 上架物品弹窗 -->
<div class="iecp-modal" id="publishModal">
  <div class="iecp-modal-box glass-2" style="max-width:550px">
    <h3><i class="fa-solid fa-plus" style="color:var(--gold)"></i> 发布物品</h3>
    <form id="itemForm" style="margin-top:20px">
      <div class="field-group two">
        <div class="field">
          <label>物品名称 <span class="req">*</span></label>
          <input id="iTitle" type="text" placeholder="如：稀有矿产" maxlength="60">
        </div>
        <div class="field">
          <label>总价（亚斯卢布 ₽） <span class="req">*</span></label>
          <input id="iPrice" type="number" placeholder="如 5000" min="1">
        </div>
      </div>
      <div class="field-group two">
        <div class="field">
          <label>数量 <span class="req">*</span></label>
          <input id="iQuantity" type="number" placeholder="如 100" min="1" value="1">
        </div>
        <div class="field">
          <label>物品图片（可选）</label>
          <!-- 自定义上传框 -->
          <label class="custom-upload" id="marketUploadBox" for="iFile" style="min-height: 60px;">
            <i class="fa-solid fa-image"></i>
            <span class="placeholder">点击上传图片</span>
            <div class="file-preview">
              <img id="iFilePreview" src="" style="display:none;">
              <i id="iFileIcon" class="fa-solid fa-file" style="display:none;"></i>
              <span id="iFileName">未选择</span>
            </div>
            <input id="iFile" type="file" accept="image/*" style="display:none">
          </label>
        </div>
      </div>
      <div class="field-group">
        <div class="field">
          <label>物品描述</label>
          <textarea id="iDesc" placeholder="简单描述一下你的物品……" style="min-height:80px"></textarea>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">
        <span id="itemHint" style="font-size:13px;color:var(--muted);margin-right:auto;align-self:center;"></span>
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('publishModal').classList.remove('open')">取消</button>
        <button class="btn btn-gold" type="submit" id="itemSubmit"><i class="fa-solid fa-check"></i> 确认发布</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP;
  var profile = null;

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('market');
    I.getProfile(true).then(function (p) {
      profile = p;
      loadMarket();
    });
  });

  I.$('#openPublishBtn').addEventListener('click', function(){
    I.$('#publishModal').classList.add('open');
  });

  // 监听图片选择，显示预览
  I.$('#iFile').addEventListener('change', function() {
    var file = this.files[0];
    var box = I.$('#marketUploadBox');
    if (file) {
      box.classList.add('has-file');
      I.$('#iFileName').textContent = file.name;
      
      // 如果是图片，显示缩略图
      if (file.type.startsWith('image/')) {
        var reader = new FileReader();
        reader.onload = function(e) {
          I.$('#iFilePreview').src = e.target.result;
          I.$('#iFilePreview').style.display = 'block';
          I.$('#iFileIcon').style.display = 'none';
        };
        reader.readAsDataURL(file);
      } else {
        I.$('#iFilePreview').style.display = 'none';
        I.$('#iFileIcon').style.display = 'block';
      }
    } else {
      box.classList.remove('has-file');
      I.$('#iFileName').textContent = '未选择';
    }
  });

  function loadMarket() {
    I.client.from('market_items')
      .select('*, seller:profiles!market_items_seller_id_fkey(id, username, flag_url, role)')
      .eq('status', 'on_sale')
      .order('created_at', { ascending: false })
      .then(function (res) {
        var wrap = I.$('#marketList');
        var list = res.data || [];
        if (!list.length) {
          wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-store"></i><p>交易行暂无物品</p></div>';
          return;
        }
        var html = '<div class="market-grid">';
        list.forEach(function (m) {
          var seller = m.seller || {};
          var isAdmin = m.is_admin_post || seller.role === 'admin';
          var tag = isAdmin ? '<span class="market-tag admin"><i class="fa-solid fa-crown"></i> 官方</span>' : '';

          html +=
            '<article class="market-card glass" onclick="location.href=\'market-detail.html?id=' + m.id + '\'">' +
              '<div class="market-img">' +
                (m.image_url ? '<img src="' + I.escapeHtml(m.image_url) + '" alt="">' : '<i class="fa-solid fa-box-open"></i>') +
              '</div>' +
              '<div class="market-body">' +
                tag +
                '<h4>' + I.escapeHtml(m.title) + '</h4>' +
                '<p>' + I.escapeHtml(m.description || '（暂无描述）') + '</p>' +
                '<div class="market-price">' + I.fmtNumber(m.price) + ' <span>₽</span></div>' +
                '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">' +
                  '<div style="font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;">' +
                    '<img src="' + I.escapeHtml(seller.flag_url || I.avatarFallback(seller.username)) + '" style="width:16px;height:12px;border-radius:2px;"> ' +
                    I.escapeHtml(seller.username || '未知') +
                  '</div>' +
                  '<span class="market-qty">库存 ' + m.quantity + '</span>' +
                '</div>' +
              '</div>' +
            '</article>';
        });
        html += '</div>';
        wrap.innerHTML = html;
      });
  }

  I.$('#itemForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = I.$('#itemSubmit');
    var hint = I.$('#itemHint');
    var title = I.$('#iTitle').value.trim();
    var price = parseInt(I.$('#iPrice').value, 10);
    var qty = parseInt(I.$('#iQuantity').value, 10);
    var desc = I.$('#iDesc').value.trim();
    var file = I.$('#iFile').files[0];

    if (!title) { hint.textContent = '请填写名称'; return; }
    if (!price || price < 1) { hint.textContent = '价格必须大于 0'; return; }
    if (!qty || qty < 1) { hint.textContent = '数量必须大于 0'; return; }

    btn.disabled = true;
    hint.textContent = file ? '正在上传图片…' : '正在发布…';

    function resetForm() {
      I.$('#itemForm').reset();
      I.$('#marketUploadBox').classList.remove('has-file');
      I.$('#iFileName').textContent = '未选择';
      I.$('#publishModal').classList.remove('open');
    }

    function insert(imgUrl) {
      return I.client.from('market_items').insert({
        seller_id: profile.id, title: title, price: price, quantity: qty, description: desc || null,
        image_url: imgUrl || null, is_admin_post: profile.role === 'admin'
      }).then(function (r) {
        btn.disabled = false;
        if (r.error) { hint.textContent = r.error.message; return; }
        I.toast('发布成功', 'success');
        resetForm();
        loadMarket();
      });
    }

    if (file) {
      var ext = (file.name.split('.').pop() || 'png').toLowerCase();
      var path = profile.id + '/' + Date.now() + '.' + ext;
      I.client.storage.from('media').upload(path, file, { upsert: true }).then(function (r) {
        if (r.error) { btn.disabled = false; hint.textContent = r.error.message; return; }
        var pub = I.client.storage.from('media').getPublicUrl(path);
        insert(pub.data.publicUrl);
      });
    } else {
      insert(null);
    }
  });
})();
</script>
</body>
</html>
