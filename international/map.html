<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界地图 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .map-container {
    position: relative;
    width: 100%;
    height: calc(100vh - 180px);
    min-height: 500px;
    background: rgba(10, 14, 26, 0.8);
    border: 1px solid var(--border-2);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #worldMap { width: 100%; height: 100%; }

  .map-panel {
    position: absolute;
    bottom: 20px; left: 20px;
    width: 320px;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 20px;
    display: none;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    z-index: 10;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  
  .map-panel h3 { margin: 0; font-size: 18px; color: #fff; display: flex; align-items: center; justify-content: space-between; }
  .map-panel .close-btn { cursor: pointer; color: var(--muted); transition: 0.2s; }
  .map-panel .close-btn:hover { color: var(--red); }
  
  .region-info { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .region-info b { color: var(--gold-2); }
  
  .panel-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  
  .map-legend {
    position: absolute;
    top: 20px; right: 20px;
    background: rgba(10, 14, 26, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-2);
    z-index: 10;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-color { width: 14px; height: 14px; border-radius: 4px; }

  @media (max-width: 768px) {
    .map-panel { width: calc(100% - 40px); bottom: 20px; left: 20px; }
    .map-legend { top: 10px; right: 10px; padding: 8px; font-size: 11px; }
  }
</style>
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<main class="iecp-main">
  <div class="iecp-page-head" style="margin-bottom: 20px;">
    <div class="iecp-page-head-inner">
      <div class="iecp-breadcrumb"><a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>世界版图</span></div>
      <div><h1><i class="fa-solid fa-earth-americas"></i> 世界版图</h1><p>点击无主之地进行殖民认领，或者对敌国领土发起突袭。</p></div>
    </div>
  </div>

  <div class="map-container">
    <div id="worldMap"></div>
    
    <div class="map-legend">
      <div class="legend-item"><div class="legend-color" style="background:#1e293b; border:1px solid #475569;"></div> 无主之地</div>
      <div class="legend-item"><div class="legend-color" style="background:#d4af37;"></div> 我的领土</div>
      <div class="legend-item"><div class="legend-color" style="background:#22c55e;"></div> 盟友领土</div>
      <div class="legend-item"><div class="legend-color" style="background:#ef4444;"></div> 敌国领土</div>
      <div class="legend-item"><div class="legend-color" style="background:#334155;"></div> 其他主权国</div>
    </div>

    <div class="map-panel" id="mapPanel">
      <h3>
        <span id="pRegionName">地区名称</span>
        <i class="fa-solid fa-xmark close-btn" onclick="closePanel()"></i>
      </h3>
      <div class="region-info" id="pRegionInfo">所有者：无主</div>
      <div class="panel-actions" id="pActions"></div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/echarts@4.9.0/dist/echarts.min.js"></script>
<script src="https://unpkg.com/echarts@4.9.0/map/js/world.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>

<script>
(function () {
  var I = IECP;
  var profile = null;
  var myChart = null;
  var allTerritories = []; 
  var allEnemies = [];     
  var allAllies = [];      
  var targetRegion = null; 

  // 🚨 详细的地理位置中文字典 (涵盖各个大洲、主要国家与岛屿)
  var NAME_MAP = {
    'China': '东亚大陆', 'Russia': '东欧及北亚', 'United States': '北美大陆', 'Canada': '北美洲北部',
    'Australia': '澳洲大陆', 'Brazil': '南美大陆', 'Indonesia': '东南亚群岛', 'India': '南亚次大陆',
    'Japan': '日本列岛', 'South Korea': '朝鲜半岛', 'North Korea': '朝鲜半岛北部',
    'United Kingdom': '不列颠群岛', 'France': '西欧平原', 'Germany': '中欧地区', 'Italy': '亚平宁半岛',
    'Spain': '伊比利亚半岛', 'Portugal': '伊比利亚半岛西部', 'Ukraine': '东欧平原', 'Poland': '东欧平原西部',
    'Kazakhstan': '中亚草原', 'Mongolia': '蒙古高原', 'Saudi Arabia': '阿拉伯半岛', 'Iran': '伊朗高原',
    'Turkey': '安纳托利亚半岛', 'Egypt': '尼罗河流域', 'South Africa': '南部非洲', 'Nigeria': '西非地区',
    'Argentina': '南美南部', 'Chile': '安第斯山脉西麓', 'Mexico': '中美洲', 'Greenland': '格陵兰岛',
    'New Zealand': '新西兰群岛', 'Philippines': '菲律宾群岛', 'Vietnam': '中南半岛东部',
    'Thailand': '中南半岛中南部', 'Malaysia': '马来半岛', 'Myanmar': '中南半岛西部',
    'Pakistan': '南亚西北部', 'Afghanistan': '中亚南部', 'Sweden': '斯堪的纳维亚半岛', 'Norway': '斯堪的纳维亚半岛西部',
    'Finland': '北欧地区', 'Iceland': '冰岛', 'Cuba': '加勒比海地区', 'Peru': '南美西部',
    'Colombia': '南美西北部', 'Venezuela': '南美北部', 'Sudan': '北非地区', 'Algeria': '北非地区',
    'Libya': '北非地区', 'Ethiopia': '东非高原', 'Kenya': '东非高原', 'Tanzania': '东非高原',
    'Democratic Republic of the Congo': '刚果盆地', 'Angola': '西南非洲',
    'Madagascar': '马达加斯加岛', 'Sri Lanka': '斯里兰卡岛', 'Taiwan': '台湾岛', 'Hainan': '海南岛'
  };

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('map'); 
    I.getProfile(true).then(function (p) {
      profile = p;
      initMap();
      loadData();
    });
  });

  function initMap() {
    myChart = echarts.init(document.getElementById('worldMap'));
    
    myChart.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        formatter: function (params) {
          var cnName = NAME_MAP[params.name] || params.name;
          if (!params.data) return cnName + '<br/>无主之地';
          return cnName + '<br/>归属：' + params.data.customData.ownerName;
        },
        backgroundColor: 'rgba(15, 23, 42, 0.9)',
        borderColor: '#d4af37',
        textStyle: { color: '#fff', fontSize: 13 }
      },
      geo: {
        map: 'world', 
        roam: true, 
        zoom: 1.2,
        // 🚨 开启地图上常驻的中文地名显示
        label: {
          normal: {
            show: true,
            color: 'rgba(255, 255, 255, 0.4)', // 半透明白色，不干扰视线
            fontSize: 10,
            formatter: function (params) {
              // 如果字典里有就显示中文，没有就默认隐藏英文名
              return NAME_MAP[params.name] || '';
            }
          },
          emphasis: {
            show: true,
            color: '#fff',
            fontWeight: 'bold',
            textShadowBlur: 4,
            textShadowColor: '#000'
          }
        },
        itemStyle: { 
          normal: { areaColor: '#1e293b', borderColor: '#475569', borderWidth: 1 },
          emphasis: { areaColor: '#4fc3f7' } 
        }
      },
      series: [{ type: 'map', geoIndex: 0, data: [] }]
    });

    myChart.on('click', function (params) {
      if (params.name) showRegionPanel(params.name);
    });

    window.addEventListener('resize', function() { myChart.resize(); });
  }

  function loadData() {
    Promise.all([
      I.client.from('territories').select('*'),
      I.client.from('relations').select('*').or(`country_a.eq.${profile.id},country_b.eq.${profile.id}`),
      I.client.from('profiles').select('id, username')
    ]).then(function(res) {
      allTerritories = res[0].data || [];
      var relations = res[1].data || [];
      var profiles = res[2].data || [];

      allEnemies = []; allAllies = [];
      relations.forEach(function(r) {
        var enemyId = r.country_a === profile.id ? r.country_b : r.country_a;
        if (r.relation_type === 'war') allEnemies.push(enemyId);
        if (r.relation_type === 'ally') allAllies.push(enemyId);
      });

      var mapData = [];
      allTerritories.forEach(function(t) {
        var owner = profiles.find(p => p.id === t.owner_id);
        var ownerName = owner ? owner.username : '未知';
        
        var color = '#334155'; 
        if (t.owner_id === profile.id) color = '#d4af37'; 
        else if (allEnemies.includes(t.owner_id)) color = '#ef4444'; 
        else if (allAllies.includes(t.owner_id)) color = '#22c55e'; 
        
        mapData.push({
          name: t.region_code,
          value: 1,
          // 🚨 核心修复：ECharts 4 必须加 normal 才能变色！
          itemStyle: { 
            normal: { areaColor: color },
            emphasis: { areaColor: color } // 鼠标悬浮时保持该颜色，防止被默认高亮盖住
          },
          customData: { ownerName: ownerName, ownerId: t.owner_id }
        });
      });

      if(myChart) {
        myChart.setOption({
          series: [{ type: 'map', geoIndex: 0, data: mapData }]
        });
      }
    });
  }

  // 显示点击区域的面板
  window.showRegionPanel = function(regionCode) {
    targetRegion = regionCode;
    var regionName = NAME_MAP[regionCode] || regionCode; // 优先显示中文翻译
    var record = allTerritories.find(t => t.region_code === regionCode);
    var pName = document.getElementById('pRegionName');
    var pInfo = document.getElementById('pRegionInfo');
    var pActions = document.getElementById('pActions');

    pName.innerText = regionName + ' (' + regionCode + ')';

    if (!record) {
      pInfo.innerHTML = '所有者：<b style="color:#94a3b8">无主之地</b><br>认领后该地块将受你保护。';
      // 🚨 传参时，region_code 依然传英文名，但显示中文名
      pActions.innerHTML = `<button class="btn btn-gold" onclick="claimLand('${regionCode}', '${regionName}')"><i class="fa-solid fa-flag"></i> 认领该领土 (2万 ₽)</button>`;
    } else if (record.owner_id === profile.id) {
      pInfo.innerHTML = '所有者：<b style="color:var(--gold-2)">我的国家</b>';
      pActions.innerHTML = `<button class="btn btn-ghost" disabled><i class="fa-solid fa-check"></i> 这是你的领土</button>`;
    } else {
      var enemy = allEnemies.includes(record.owner_id);
      var ally = allAllies.includes(record.owner_id);
      var relationText = enemy ? '<b style="color:#ef4444">交战中</b>' : (ally ? '<b style="color:#22c55e">盟友</b>' : '<b style="color:#94a3b8">中立</b>');
      
      pInfo.innerHTML = `所有者：<b style="color:var(--cyan)">主权国家</b><br>外交状态：${relationText}`;
      
      if (enemy) {
        pActions.innerHTML = `
          <button class="btn btn-red" onclick="location.href='wars.html'"><i class="fa-solid fa-bomb"></i> 前往战争大厅突袭</button>
          <button class="btn btn-cyan" onclick="requestBuy('${regionCode}')"><i class="fa-solid fa-money-bill"></i> 协商购买</button>
        `;
      } else {
        pActions.innerHTML = `
          <button class="btn btn-cyan" onclick="requestBuy('${regionCode}')"><i class="fa-solid fa-money-bill"></i> 协商购买该领土</button>
        `;
      }
    }
    document.getElementById('mapPanel').style.display = 'flex';
  };

  window.closePanel = function() {
    document.getElementById('mapPanel').style.display = 'none';
    targetRegion = null;
  };

  window.claimLand = function(code, name) {
    if (!confirm(`确认花费 20,000 ₽ 认领【${name}】吗？`)) return;
    I.toast('正在签署领土协议...', 'success', 1000);
    
    // 🚨 数据库里存的是英文代码（如 China），不是中文名
    I.client.rpc('claim_territory', {
      p_user_id: profile.id,
      p_region_code: code,
      p_region_name: name
    }).then(function(res) {
      if (res.error) return I.toast('失败：' + res.error.message, 'error');
      if (!res.data.ok) return I.toast(res.data.msg, 'error');
      I.toast('认领成功！', 'success');
      closePanel();
      loadData(); 
    });
  };

  window.requestBuy = function(code) {
    var price = prompt("请输入你愿意支付的金额 (₽)：", "50000");
    if (!price || isNaN(price) || price <= 0) return;
    
    var record = allTerritories.find(t => t.region_code === code);
    var cnName = NAME_MAP[code] || code;
    
    I.client.from('diplomacy_requests').insert({
      from_country: profile.id,
      to_country: record.owner_id,
      request_type: 'buy_territory',
      message: `申请购买你的【${cnName}】领土，出价 ${price} ₽。`,
      extra_data: { region_code: code, price: parseInt(price) }
    }).then(function(res) {
      if (res.error) return I.toast('发送请求失败', 'error');
      I.toast('购买请求已发送至对方外交事务', 'success');
    });
  };

})();
</script>
</body>
</html>
