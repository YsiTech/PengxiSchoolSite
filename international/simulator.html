<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>战术模拟终端 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { background-color: #05070a; overflow-x: hidden; background-image: radial-gradient(circle at 50% 50%, rgba(79,195,247,0.1) 0%, transparent 60%); }
  
  .sim-container { max-width: 900px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 10; }
  
  /* 战术显示器外壳 */
  .tactical-console { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(79, 195, 247, 0.3); border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(79, 195, 247, 0.05); position: relative; overflow: hidden; text-align: center; }
  
  /* 雷达网格背景 */
  .tactical-console::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(79,195,247,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(79,195,247,0.05) 1px, transparent 1px); background-size: 30px 30px; z-index: 0; pointer-events: none; }
  
  .console-content { position: relative; z-index: 2; }
  
  .sim-title { font-size: 28px; font-weight: 900; color: #fff; font-family: var(--mono); letter-spacing: 4px; margin-bottom: 10px; text-shadow: 0 0 15px rgba(79,195,247,0.6); display: flex; align-items: center; justify-content: center; gap: 16px; }
  .sim-title i { color: var(--cyan); animation: pulseBlue 2s infinite; }
  @keyframes pulseBlue { 0% { text-shadow: 0 0 10px rgba(79,195,247,0.5); } 50% { text-shadow: 0 0 30px rgba(79,195,247,1); } 100% { text-shadow: 0 0 10px rgba(79,195,247,0.5); } }
  
  .sim-subtitle { color: var(--cyan); font-size: 13px; font-family: var(--mono); letter-spacing: 2px; margin-bottom: 40px; opacity: 0.8; }
  
  /* 加载条 */
  .loading-box { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 20px; margin-bottom: 30px; text-align: left; }
  .loading-text { font-family: var(--mono); font-size: 13px; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .loading-bar-bg { height: 6px; background: rgba(255,255,255,0.05); border-radius: 99px; overflow: hidden; }
  .loading-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), #fff); border-radius: 99px; transition: width 0.1s linear; box-shadow: 0 0 10px var(--cyan); }
  
  /* 启动按钮 */
  .launch-btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 48px; font-size: 20px; font-weight: 900; color: #000; background: linear-gradient(135deg, var(--cyan), #0288d1); border: none; border-radius: 12px; cursor: not-allowed; transition: 0.3s; letter-spacing: 2px; opacity: 0.5; box-shadow: 0 10px 30px rgba(79,195,247,0.2); }
  .launch-btn.active { cursor: pointer; opacity: 1; background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; box-shadow: 0 10px 30px rgba(34,197,94,0.4); }
  .launch-btn.active:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 40px rgba(34,197,94,0.6); }
  .launch-btn i { font-size: 24px; }
  
  /* 警告标识 */
  .warning-box { margin-top: 30px; padding: 16px; border: 1px dashed rgba(239,68,68,0.4); background: rgba(239,68,68,0.05); border-radius: 10px; color: #fca5a5; font-size: 13px; display: flex; align-items: center; gap: 12px; text-align: left; line-height: 1.6; }
  .warning-box i { color: #ef4444; font-size: 24px; flex-shrink: 0; }
  
  /* 底部日志 */
  .console-logs { text-align: left; font-family: var(--mono); font-size: 12px; color: #475569; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
  .console-logs div { margin-bottom: 4px; }
  .console-logs .success { color: #22c55e; }
</style>
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<main class="sim-container">
  <div class="tactical-console">
    <div class="console-content">
      
      <h1 class="sim-title"><i class="fa-solid fa-satellite-dish"></i> 战术模拟终端</h1>
      <p class="sim-subtitle">TACTICAL SIMULATION TERMINAL · RED ALERT 2 ENGINE</p>
      
      <!-- 接入进度条 -->
      <div class="loading-box">
        <div class="loading-text">
          <span>正在建立与【外部超级计算机】的加密链路...</span>
          <span id="loadingPercent">0%</span>
        </div>
        <div class="loading-bar-bg">
          <div class="loading-bar-fill" id="loadingFill"></div>
        </div>
      </div>
      
      <!-- 启动按钮 -->
      <button class="launch-btn" id="launchBtn" disabled onclick="launchSimulator()">
        <i class="fa-solid fa-person-rifle"></i> 启动战术模拟
      </button>
      
      <!-- 警告说明 -->
      <div class="warning-box">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <div>
          <strong>系统提示：</strong>由于战术模拟引擎体积庞大且使用了独立的网络协议，IECP 无法直接将其内嵌至当前面板。<br>
          点击启动后，系统将打开新的独立作战窗口。请确保您的网络环境畅通。
        </div>
      </div>
      
      <!-- 动态日志面板 -->
      <div class="console-logs" id="logBox">
        <div>[SYS] 正在初始化战术接口协议 v2.4.1 ...</div>
      </div>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP;
  
  // 初始化顶部导航
  I.requireAuth().then(function(ok) {
    if (!ok) return;
    I.initTopbar('wars'); // 高亮战争系统
    
    // 开始模拟加载过程
    startSimulationLoad();
  });

  function startSimulationLoad() {
    var progress = 0;
    var fillEl = document.getElementById('loadingFill');
    var textEl = document.getElementById('loadingPercent');
    var btn = document.getElementById('launchBtn');
    var logBox = document.getElementById('logBox');

    var logs = [
      { p: 15, text: '正在验证军方安全凭证...', log: '[AUTH] 凭证验证通过。' },
      { p: 35, text: '正在拉取红警2作战引擎核心...', log: '[NET] 正在下载资产包 (1.2GB)...' },
      { p: 60, text: '正在预载超时空传送仪...', log: '[SYS] 时间线锚点已锁定。' },
      { p: 85, text: '正在同步全球卫星地形数据...', log: '[GEO] 战场地形加载完成。' },
      { p: 100, text: '链路建立完毕，准备就绪。', log: '[DONE] 战术终端就绪！', success: true }
    ];

    var currentLogIndex = 0;

    var interval = setInterval(function() {
      // 随机增加进度，看起来更真实
      progress += Math.floor(Math.random() * 5) + 2;
      if (progress > 100) progress = 100;
      
      fillEl.style.width = progress + '%';
      textEl.innerText = progress + '%';

      // 触发对应阶段的日志
      if (currentLogIndex < logs.length && progress >= logs[currentLogIndex].p) {
        var logData = logs[currentLogIndex];
        var logDiv = document.createElement('div');
        logDiv.innerHTML = logData.success 
          ? `<span style="color:#22c55e;">${logData.log}</span>` 
          : logData.log;
        logBox.appendChild(logDiv);
        currentLogIndex++;
      }

      // 加载完毕
      if (progress >= 100) {
        clearInterval(interval);
        btn.disabled = false;
        btn.classList.add('active');
        
        // 按钮增加闪烁特效
        setInterval(function() {
          btn.style.boxShadow = btn.style.boxShadow === '0 10px 30px rgba(34,197,94,0.4)' 
            ? '0 15px 40px rgba(34,197,94,0.8)' 
            : '0 10px 30px rgba(34,197,94,0.4)';
        }, 800);
      }
    }, 150);
  }

  window.launchSimulator = function() {
    // 打开外部链接，在新标签页
    window.open('https://gonghui.k0s.cn/', '_blank');
    
    // 提示用户
    IECP.toast('正在打开外部战场，请稍候...', 'success');
  };
})();
</script>
</body>
</html>
