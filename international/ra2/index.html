      return cache.match(vendorUrl).then(function (cached) {
        if (cached) return;
        var compatibleUrl = new URL(vendorUrl);
        compatibleUrl.searchParams.set('v', config.assetVersion);
        return fetch(compatibleUrl.href, { cache: 'no-cache', integrity: config.vendorIntegrity }).then(function (response) {
          if (!response.ok) throw new Error('Dependency migration failed: HTTP ' + response.status);
          return cache.put(vendorUrl, new Response(response.body, {
            status: response.status, statusText: response.statusText, headers: response.headers
          }));
        });
      });
    });
  }

  var ready = document.readyState !== 'loading' ? Promise.resolve() : new Promise(function (resolve) {
    document.addEventListener('DOMContentLoaded', resolve, { once: true });
  });
  Promise.all([ready, controllerInfo().then(prepareLegacyController)]).then(start, function (error) {
    window.__ra2webStartupLoadCheck.fail('启动依赖加载失败', error, vendorUrl, 'resource');
  });
})();

    <script id="startup-load-check-runtime">
      if (window.__ra2webStartupLoadCheck && window.__ra2webStartupLoadCheck.mount) {
        window.__ra2webStartupLoadCheck.mount();
      }

      (function() {
        var originalSetPhase = window.__ra2webStartupLoadCheck.setPhase;
        window.__ra2webStartupLoadCheck.setPhase = function(msg, desc, val) {
          if (originalSetPhase) originalSetPhase(msg, desc, val);
          if (msg) document.getElementById('iecp-status-text').innerText = msg;
          if (desc) document.getElementById('iecp-detail-text').innerText = desc;
          if (typeof val === 'number') {
            document.getElementById('iecp-progress-fill').style.width = val + '%';
            document.getElementById('iecp-progress-percent').innerText = val + '%';
          }
        };

        var originalSetProgress = window.__ra2webStartupLoadCheck.setProgress;
        window.__ra2webStartupLoadCheck.setProgress = function(val) {
          if (originalSetProgress) originalSetProgress(val);
          if (typeof val === 'number') {
            document.getElementById('iecp-progress-fill').style.width = val + '%';
            document.getElementById('iecp-progress-percent').innerText = val + '%';
          }
        };

        var originalFail = window.__ra2webStartupLoadCheck.fail;
        window.__ra2webStartupLoadCheck.fail = function(title, msg, url, type, event) {
          if (originalFail) originalFail(title, msg, url, type, event);
          document.getElementById('iecp-title-text').innerText = '战术链路阻断';
          document.getElementById('iecp-title-text').style.color = '#ef4444';
          document.querySelector('.iecp-spinner').style.background = 'rgba(239, 68, 68, 0.1)';
          document.querySelector('.iecp-spinner').style.borderColor = 'rgba(239, 68, 68, 0.4)';
          document.querySelector('.iecp-spinner').style.color = '#ef4444';
          document.querySelector('.iecp-spinner i').className = 'fa-solid fa-triangle-exclamation';
          document.querySelector('.iecp-progress-fill').style.background = '#ef4444';
          if (msg) document.getElementById('iecp-detail-text').innerText = msg;
        };

        var originalReady = window.__ra2webStartupLoadCheck.ready;
        window.__ra2webStartupLoadCheck.ready = function() {
          if (originalReady) originalReady();
          var overlay = document.getElementById('iecp-loading-overlay');
          if (overlay) {
            overlay.classList.add('hidden');
            setTimeout(function() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 1000);
          }
        };
      })();

      // 防止引擎插出来的元素在遮罩之上
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.tagName === 'CANVAS' || (node.tagName === 'DIV' && node.id !== 'iecp-loading-overlay' && !node.closest('#iecp-loading-overlay'))) {
              if (document.getElementById('iecp-loading-overlay')) {
                 if(node.style) node.style.zIndex = '-1';
              }
            }
          });
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
