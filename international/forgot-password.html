<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>找回密码 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="iecp-auth-wrap">
  <div class="iecp-auth-card glass-2" style="max-width:520px">

    <div class="auth-logo">
      <img src="photo/un.png" alt="IECP">
      <b>IECP</b>
    </div>

    <h2>找回密码</h2>
    <p class="auth-sub">通过邮箱验证码重置你的账号密码</p>

    <form id="forgotForm">
      <div class="field-group two" style="grid-template-columns: 2fr 1fr; align-items:start;">
        <div class="field">
          <label for="forgotEmail"><i class="fa-regular fa-envelope"></i> 注册邮箱</label>
          <input id="forgotEmail" type="email" placeholder="请输入注册时的邮箱">
        </div>
        <div class="field">
          <label style="opacity:0">操作</label>
          <button type="button" class="btn btn-ghost" id="sendForgotCodeBtn" style="width:100%; padding:12px 0;">获取验证码</button>
        </div>
      </div>

      <div class="field-group">
        <div class="field">
          <label for="forgotCode"><i class="fa-solid fa-shield-halved"></i> 验证码</label>
          <input id="forgotCode" type="text" placeholder="请输入 6 位验证码" maxlength="6">
        </div>
      </div>

      <div class="field-group">
        <div class="field">
          <label for="newPassword"><i class="fa-solid fa-lock"></i> 新密码</label>
          <input id="newPassword" type="password" placeholder="至少 6 位">
        </div>
        <div class="field">
          <label for="newPassword2"><i class="fa-solid fa-lock"></i> 确认新密码</label>
          <input id="newPassword2" type="password" placeholder="再次输入新密码">
        </div>
      </div>

      <div class="auth-hint" id="forgotHint"></div>

      <button class="btn-submit" type="submit" id="forgotSubmitBtn">
        <i class="fa-solid fa-key"></i> 重置密码
      </button>
    </form>

    <div class="auth-bottom">
      想起来了？<a href="login.html">返回登录</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/auth.js"></script>
<script>IECP.initForgot();</script>

</body>
</html>
