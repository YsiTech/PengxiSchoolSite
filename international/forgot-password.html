<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>找回密码 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="auth-page" style="justify-content: center;">
  <div class="auth-form-container" style="width: 480px; border-left: none; border-radius: 20px; padding: 40px;">
    <div class="auth-box">
      
      <div class="auth-header">
        <img src="photo/un.png" alt="IECP">
        <h2>找回密码</h2>
        <p>通过邮箱验证码重置你的账号密码</p>
      </div>

      <form id="formReset" onsubmit="handleReset(event)">
        
        <div class="auth-input-group">
          <label>注册邮箱</label>
          <i class="fa-regular fa-envelope icon"></i>
          <input type="email" id="resetEmail" placeholder="请输入注册时的邮箱" required>
        </div>

        <div class="auth-input-group">
          <label>验证码</label>
          <i class="fa-solid fa-shield-halved icon"></i>
          <div class="auth-code-row">
            <input type="text" id="resetCode" placeholder="请输入 6 位验证码" maxlength="6" required>
            <button type="button" class="btn-code" id="btnSendCode" onclick="sendResetCode()">获取验证码</button>
          </div>
        </div>

        <div class="auth-input-group">
          <label>新密码</label>
          <i class="fa-solid fa-lock icon"></i>
          <input type="password" id="resetPwd" placeholder="至少 6 位" required>
        </div>

        <div class="auth-input-group">
          <label>确认新密码</label>
          <i class="fa-solid fa-lock icon"></i>
          <input type="password" id="resetPwd2" placeholder="再次输入新密码" required>
        </div>

        <div class="auth-msg" id="msgReset"></div>
        <button type="submit" class="btn-auth" id="btnReset">重置密码</button>

        <div class="auth-links" style="justify-content: center;">
          <a href="login.html"><i class="fa-solid fa-arrow-left"></i> 返回登录</a>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
function setMsg(id, text, type) {
  const el = document.getElementById(id);
  el.innerText = text;
  el.className = 'auth-msg ' + type;
}

// 发送验证码
let countdown = 0;
async function sendResetCode() {
  const email = document.getElementById('resetEmail').value.trim();
  if (!email) return setMsg('msgReset', '请先输入邮箱', 'error');

  const btn = document.getElementById('btnSendCode');
  btn.disabled = true;
  btn.innerText = '发送中...';
  setMsg('msgReset', '', '');

  const { error } = await IECP.client.auth.signInWithOtp({
    email: email,
    options: { shouldCreateUser: false }
  });

  if (error) {
    setMsg('msgReset', '发送失败，请确认邮箱是否已注册', 'error');
    btn.disabled = false; btn.innerText = '获取验证码';
    return;
  }

  setMsg('msgReset', '验证码已发送至邮箱', 'success');
  countdown = 60;
  btn.innerText = `${countdown}s 后重试`;
  
  const timer = setInterval(() => {
    countdown--;
    btn.innerText = `${countdown}s 后重试`;
    if (countdown <= 0) {
      clearInterval(timer);
      btn.disabled = false;
      btn.innerText = '获取验证码';
    }
  }, 1000);
}

// 提交新密码
async function handleReset(e) {
  e.preventDefault();
  const email = document.getElementById('resetEmail').value.trim();
  const code = document.getElementById('resetCode').value.trim();
  const pwd = document.getElementById('resetPwd').value;
  const pwd2 = document.getElementById('resetPwd2').value;
  const btn = document.getElementById('btnReset');

  if (pwd !== pwd2) return setMsg('msgReset', '两次输入的密码不一致', 'error');
  if (pwd.length < 6) return setMsg('msgReset', '密码至少 6 位', 'error');

  btn.disabled = true; btn.innerText = '正在重置...';
  setMsg('msgReset', '', '');

  // 1. 校验 OTP 获取临时会话
  const { error: verifyErr } = await IECP.client.auth.verifyOtp({
    email: email,
    token: code,
    type: 'email'
  });

  if (verifyErr) {
    setMsg('msgReset', '验证码错误或已过期', 'error');
    btn.disabled = false; btn.innerText = '重置密码';
    return;
  }

  // 2. 更新密码
  const { error: updateErr } = await IECP.client.auth.updateUser({ password: pwd });

  if (updateErr) {
    setMsg('msgReset', '重置失败：' + updateErr.message, 'error');
    btn.disabled = false; btn.innerText = '重置密码';
    return;
  }

  setMsg('msgReset', '密码重置成功！正在跳转登录...', 'success');
  setTimeout(async () => {
    await IECP.client.auth.signOut(); // 重置后登出，让用户重新登录
    location.replace('login.html');
  }, 1500);
}
</script>
</body>
</html>
