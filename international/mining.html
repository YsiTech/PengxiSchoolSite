<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>国家基建 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .build-console {
    background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .build-console-info { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .build-select { 
    background: rgba(0,0,0,0.3); border: 1px solid var(--border-2); color: #fff; 
    padding: 10px 16px; border-radius: 8px; outline: none; cursor: pointer; font-weight: bold;
  }
  .btn-build { 
    background: linear-gradient(135deg, var(--gold), #b8860b); color: #0a0e1a; 
    font-weight: bold; padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; 
  }
  .btn-build:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(212,175,55,0.4); }
  .btn-build:disabled { background: #333; color: #888; box-shadow: none; transform: none; cursor: not-allowed; }

  .type-tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px;
    scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .type-tabs::-webkit-scrollbar { display: none; }
  .type-tab {
    padding: 10px 20px; font-size: 14px; font-weight: 600; color: var(--muted);
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; cursor: pointer; white-space: nowrap; transition: 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  .type-tab:hover { background: rgba(255,255,255,0.08); color: var(--ink); }
  .type-tab.active {
    background: rgba(212,175,55,0.15); color: var(--gold-2); border-color: rgba(212,175,55,0.4);
    box-shadow: 0 4px 12px rgba(212,175,55,0.15);
  }

  .mine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .mine-card { background: linear-gradient(150deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9)); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: 0.3s; }
  .mine-card:hover { border-color: var(--gold); box-shadow: 0 10px 30px rgba(212,175,55,0.1); transform: translateY(-2px); }
  
  .mine-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .mine-icon { width: 64px; height: 64px; border-radius: 12px; background: rgba(0,0,0,0.3); display: grid; place-items: center; padding: 10px; }
  .mine-icon img { width: 100%; height: 100%; object-fit: contain; }
  .mine-icon i { font-size: 30px; color: var(--gold); }
  .mine-title { font-size: 18px; font-weight: bold; color: #fff; }
  .mine-level { font-size: 12px; color: var(--gold-2); background: rgba(212,175,55,0.15); padding: 2px 8px; border-radius: 99px; display: inline-block; margin-top: 4px; }

  .storage-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .storage-info b { color: var(--cyan); font-family: var(--mono); }
  
  .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; margin-bottom: 16px; position: relative; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--cyan)); border-radius: 99px; transition: width 0.5s; }
  .progress-fill.full { background: #22c55e; }

  .cost-box { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
  .cost-title { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .cost-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .cost-tag { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; font-size: 12px; color: #fff; font-family: var(--mono); border: 1px solid rgba(255,255,255,0.1); }
  .cost-tag i { font-size: 12px; }
  
  .upgrading-overlay { position: absolute; inset: 0; background: rgba(10, 14, 26, 0.85); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
  .upgrading-overlay .pulse-icon { width: 60px; height: 60px; border-radius: 50%; background: rgba(79,195,247,0.1); display: grid; place-items: center; margin-bottom: 12px; animation: pulse 2s infinite; }
  .upgrading-overlay .pulse-icon i { font-size: 30px; color: var(--cyan); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(79,195,247,0.4); } 70% { box-shadow: 0 0 0 15px rgba(79,195,247,0); } 100% { box-shadow: 0 0 0 0 rgba(79,195,247,0); } }
  
  .upgrading-overlay .countdown { font-family: var(--mono); font-size: 22px; color: #fff; font-weight: bold; letter-spacing: 1px; margin-bottom: 4px; }
  .upgrading-overlay .label { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  
  .btn-cancel-upgrade { padding: 6px 16px; font-size: 12px; border-radius: 20px; background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); cursor: pointer; transition: 0.2s; }
  .btn-cancel-upgrade:hover { background: #ef4444; color: #fff; }

  .mine-actions { display: flex; gap: 10px; margin-top: auto; }
  .btn-collect { flex: 1; background: linear-gradient(135deg, var(--cyan), #0284c7); color: #fff; font-weight: bold; }
  .btn-collect:disabled { background: #333; color: #888; }
  .btn-upgrade { flex: 1; background: rgba(255,255,255,0.05); color: var(--ink); border: 1px solid var(--border-2); }
  .btn-upgrade:hover { background: rgba(212,175,55,0.15); color: var(--gold); border-color: var(--gold); }

  .float-text { position: absolute; color: var(--green); font-weight: bold; font-size: 18px; pointer-events: none; animation: floatUp 1.5s ease-out forwards; z-index: 20; }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

  .empty-mining { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; background: rgba(17, 24, 39, 0.4); border: 2px dashed rgba(255,255,255,0.1); border-radius: 16px; text-align: center; }
  .empty-mining i { font-size: 50px; color: var(--muted-2); margin-bottom: 16px; opacity: 0.5; }
  .empty-mining p { color: var(--muted); font-size: 14px; }

  @media (max-width: 768px) {
    .build-console { flex-direction: column; align-items: stretch; }
    .build-console-info { justify-content: center; margin-bottom: 10px; }
    .mine-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<section class="iecp-page-head">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb"><a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>国家基建</span></div>
    <div>
      <h1><i class="fa-solid fa-industry" style="color:var(--gold)"></i> 国家基建与资源开采</h1>
      <p>你的矿场正在持续产出资源，请及时收取，否则将面临被敌国掠夺的风险！</p>
    </div>
  </div>
</section>

<main class="iecp-main">
  
  <div class="build-console">
    <div class="build-console-info" id="buildCostDisplay">
      <!-- JS 动态渲染 -->
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <select class="build-select" id="newBuildType" onchange="updateBuildCostUI()">
        <option value="oil">原油钻井</option>
        <option value="gas">天然气田</option>
        <option value="iron_ore">露天铁矿</option>
        <option value="rare_metal">稀土矿井</option>
        <option value="food">农业基地</option>
      </select>
      <button class="btn-build" id="btnNewBuild" onclick="createBuilding()"><i class="fa-solid fa-hammer"></i> 新建采集器</button>
    </div>
  </div>

  <div class="type-tabs" id="typeTabs">
    <div class="type-tab active" onclick="switchTab('all', this)"><i class="fa-solid fa-layer-group"></i> 全部设施</div>
    <div class="type-tab" onclick="switchTab('oil', this)"><i class="fa-solid fa-oil-well" style="color:#f59e0b"></i> 原油</div>
    <div class="type-tab" onclick="switchTab('gas', this)"><i class="fa-solid fa-fire-flame-simple" style="color:#ef4444"></i> 天然气</div>
    <div class="type-tab" onclick="switchTab('iron_ore', this)"><i class="fa-solid fa-mountain" style="color:#a78bfa"></i> 铁矿</div>
    <div class="type-tab" onclick="switchTab('rare_metal', this)"><i class="fa-solid fa-atom" style="color:#4fc3f7"></i> 稀有金属</div>
    <div class="type-tab" onclick="switchTab('food', this)"><i class="fa-solid fa-wheat-awn" style="color:#22c55e"></i> 粮食</div>
  </div>

  <div class="mine-grid" id="mineGrid">
    <div class="loading-state" style="grid-column:1/-1;"><div class="spinner"></div><span>正在连接矿场主控台...</span></div>
  </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP;
  var profile = null;
  var buildings = [];
  var timer = null;
  var activeTab = 'all';

  var TYPE_INFO = {
    oil: { name: '原油钻井', unit: '吨', img: 'oil.png', icon: 'fa-oil-well', color: '#f59e0b', max: 5 },
    gas: { name: '天然气田', unit: 'm³', img: 'gas.png', icon: 'fa-fire-flame-simple', color: '#ef4444', max: 5 },
    iron_ore: { name: '露天铁矿', unit: '吨', img: 'iron.png', icon: 'fa-mountain', color: '#a78bfa', max: 3 },
    rare_metal: { name: '稀土矿井', unit: '吨', img: 'rare.png', icon: 'fa-atom', color: '#4fc3f7', max: 2 },
    food: { name: '农业基地', unit: '吨', img: 'food.png', icon: 'fa-wheat-awn', color: '#22c55e', max: 10 }
  };

  var BUILD_COST = {
    oil: [{ t: 'gas', a: 5000 }, { t: 'iron_ore', a: 2000 }, { t: 'rare_metal', a: 20 }],
    gas: [{ t: 'oil', a: 5000 }, { t: 'iron_ore', a: 2000 }, { t: 'rare_metal', a: 20 }],
    iron_ore: [{ t: 'oil', a: 5000 }, { t: 'food', a: 5000 }, { t: 'rare_metal', a: 20 }],
    rare_metal: [{ t: 'oil', a: 8000 }, { t: 'gas', a: 8000 }, { t: 'food', a: 5000 }],
    food: [{ t: 'gas', a: 5000 }, { t: 'iron_ore', a: 2000 }, { t: 'rare_metal', a: 20 }]
  };

  var UPGRADE_COST = {
    oil: {
      1: [{ t: 'gas', a: 10000 }, { t: 'iron_ore', a: 5000 }, { t: 'rare_metal', a: 50 }],
      2: [{ t: 'gas', a: 30000 }, { t: 'iron_ore', a: 15000 }, { t: 'rare_metal', a: 150 }],
      3: [{ t: 'gas', a: 80000 }, { t: 'iron_ore', a: 40000 }, { t: 'rare_metal', a: 400 }],
      4: [{ t: 'gas', a: 200000 }, { t: 'iron_ore', a: 100000 }, { t: 'rare_metal', a: 1000 }]
    },
    gas: {
      1: [{ t: 'oil', a: 10000 }, { t: 'iron_ore', a: 5000 }, { t: 'rare_metal', a: 50 }],
      2: [{ t: 'oil', a: 30000 }, { t: 'iron_ore', a: 15000 }, { t: 'rare_metal', a: 150 }],
      3: [{ t: 'oil', a: 80000 }, { t: 'iron_ore', a: 40000 }, { t: 'rare_metal', a: 400 }],
      4: [{ t: 'oil', a: 200000 }, { t: 'iron_ore', a: 100000 }, { t: 'rare_metal', a: 1000 }]
    },
    iron_ore: {
      1: [{ t: 'oil', a: 8000 }, { t: 'food', a: 8000 }, { t: 'rare_metal', a: 50 }],
      2: [{ t: 'oil', a: 24000 }, { t: 'food', a: 24000 }, { t: 'rare_metal', a: 150 }],
      3: [{ t: 'oil', a: 64000 }, { t: 'food', a: 64000 }, { t: 'rare_metal', a: 400 }],
      4: [{ t: 'oil', a: 160000 }, { t: 'food', a: 160000 }, { t: 'rare_metal', a: 1000 }]
    },
    rare_metal: {
      1: [{ t: 'oil', a: 15000 }, { t: 'gas', a: 15000 }, { t: 'food', a: 10000 }],
      2: [{ t: 'oil', a: 45000 }, { t: 'gas', a: 45000 }, { t: 'food', a: 30000 }],
      3: [{ t: 'oil', a: 120000 }, { t: 'gas', a: 120000 }, { t: 'food', a: 80000 }],
      4: [{ t: 'oil', a: 300000 }, { t: 'gas', a: 300000 }, { t: 'food', a: 200000 }]
    },
    food: {
      1: [{ t: 'gas', a: 8000 }, { t: 'iron_ore', a: 5000 }, { t: 'rare_metal', a: 50 }],
      2: [{ t: 'gas', a: 24000 }, { t: 'iron_ore', a: 15000 }, { t: 'rare_metal', a: 150 }],
      3: [{ t: 'gas', a: 64000 }, { t: 'iron_ore', a: 40000 }, { t: 'rare_metal', a: 400 }],
      4: [{ t: 'gas', a: 160000 }, { t: 'iron_ore', a: 100000 }, { t: 'rare_metal', a: 1000 }]
    }
  };

  var DURATIONS = [0, 2, 6, 12, 24];

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('mining'); 
    I.getProfile(true).then(function (p) {
      profile = p;
      updateBuildCostUI();
      loadBuildings();
    });
  });

  // 🚨 动态更新顶部成本 UI，展示：当前数量/上限
  window.updateBuildCostUI = function() {
    var type = I.$('#newBuildType').value;
    var reqs = BUILD_COST[type];
    var info = TYPE_INFO[type];

    // 统计该类当前数量
    var currentCount = buildings.filter(b => b.type === type).length;
    var isMaxed = currentCount >= info.max;

    var html = `<span style="color:var(--muted); margin-right:4px;">新建消耗：</span>`;
    reqs.forEach(function(req) {
      var rInfo = TYPE_INFO[req.t];
      html += `<span class="cost-tag"><i class="fa-solid ${rInfo.icon}" style="color:${rInfo.color}"></i> ${I.fmtNumber(req.a)}</span>`;
    });
    
    // 添加数量显示
    html += `<span style="margin-left:8px; font-size:12px; color:${isMaxed ? 'var(--red)' : 'var(--cyan)'}; font-weight:bold;">(${currentCount}/${info.max})</span>`;

    I.$('#buildCostDisplay').innerHTML = html;
    
    // 如果满级，禁用按钮
    I.$('#btnNewBuild').disabled = isMaxed;
    I.$('#btnNewBuild').innerHTML = isMaxed ? '<i class="fa-solid fa-ban"></i> 已达上限' : '<i class="fa-solid fa-hammer"></i> 新建采集器';
  };

  window.switchTab = function(type, btn) {
    activeTab = type;
    document.querySelectorAll('.type-tab').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    renderUI();
  };

  function loadBuildings() {
    I.client.from('resource_buildings').select('*').eq('country_id', profile.id).order('type', { ascending: true }).then(function(res) {
      if (res.data) {
        buildings = res.data;
        renderUI();
        startTimer();
        updateBuildCostUI(); // 🚨 数据加载完，刷新一下顶部的数量
      }
    });
  }

  function getStats(level) {
    var rate = [0, 50, 120, 250, 500, 1000][level];
    var cap = [0, 1000, 3000, 8000, 20000, 50000][level];
    return { rate: rate, cap: cap };
  }

  function renderUI() {
    var wrap = I.$('#mineGrid');
    var html = '';

    var filtered = buildings.filter(function(b) {
      return activeTab === 'all' || b.type === activeTab;
    });

    if (filtered.length === 0) {
      wrap.innerHTML = `<div class="empty-mining">
        <i class="fa-solid fa-trowel"></i>
        <p>你还没有此类采集器，快去右上角新建一个吧！</p>
      </div>`;
      return;
    }

    filtered.forEach(function(b) {
      var info = TYPE_INFO[b.type];
      var stats = getStats(b.level);
      var isUpgrading = b.upgrading_until && new Date(b.upgrading_until) > new Date();
      
      var secs = (new Date() - new Date(b.last_collected_at)) / 1000;
      var currentAmount = Math.min(stats.cap, (secs / 3600) * stats.rate);
      var pct = Math.min(100, (currentAmount / stats.cap) * 100);
      var isFull = currentAmount >= stats.cap;

      var costHtml = '';
      if (b.level < 5) {
        var reqs = UPGRADE_COST[b.type][b.level];
        var duration = DURATIONS[b.level];

        var costItemsHtml = reqs.map(req => {
          var rInfo = TYPE_INFO[req.t];
          return `<span class="cost-tag"><i class="fa-solid ${rInfo.icon}" style="color:${rInfo.color}"></i> ${rInfo.name.substring(0,2)} <b>${I.fmtNumber(req.a)}</b></span>`;
        }).join('');

        costHtml = `
          <div class="cost-box">
            <div class="cost-title">升级消耗（${duration}小时）：</div>
            <div class="cost-list">${costItemsHtml}</div>
          </div>
        `;
      } else {
        costHtml = `<div class="cost-box" style="text-align:center; color:var(--muted); padding:20px;">已达到最高等级</div>`;
      }
      
      html += `
        <div class="mine-card" id="card-${b.id}">
          ${isUpgrading ? `
            <div class="upgrading-overlay">
              <div class="pulse-icon"><i class="fa-solid fa-person-digging"></i></div>
              <div class="countdown" id="timer-${b.id}">计算中...</div>
              <div class="label">正在升级，暂时停产</div>
              <button class="btn-cancel-upgrade" onclick="cancelUpgrade('${b.id}')">取消升级 (退50%)</button>
            </div>
          ` : ''}

          <div class="mine-header">
            <div class="mine-icon">
              <img src="photo/${info.img}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
              <i class="fa-solid ${info.icon}" style="display:none; color:${info.color}"></i>
            </div>
            <div>
              <div class="mine-title">${info.name}</div>
              <div class="mine-level">Lv.${b.level} · ${stats.rate}/h</div>
            </div>
          </div>

          <div class="storage-info">
            <span>已产出:</span>
            <span><b class="amount-text">${I.fmtNumber(currentAmount)}</b> ${info.unit}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill ${isFull ? 'full' : ''}" style="width: ${pct}%"></div>
          </div>
          
          ${costHtml}

          <div class="mine-actions">
            <button class="btn btn-collect btn-sm" onclick="collect('${b.id}', this)" ${isUpgrading || currentAmount < 1 ? 'disabled' : ''}>
              <i class="fa-solid fa-hand-holding-droplet"></i> 收取
            </button>
            <button class="btn btn-upgrade btn-sm" onclick="upgrade('${b.id}')" ${isUpgrading || b.level >= 5 ? 'disabled' : ''}>
              <i class="fa-solid fa-arrow-up-from-bracket"></i> 升级
            </button>
          </div>
        </div>
      `;
    });
    wrap.innerHTML = html;
  }

  function startTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(function() {
      var now = new Date();
      
      buildings.forEach(function(b) {
        var card = I.$('#card-' + b.id);
        if (!card) return;

        var stats = getStats(b.level);
        
        if (b.upgrading_until) {
          var upEnd = new Date(b.upgrading_until);
          if (now < upEnd) {
            var diff = Math.floor((upEnd - now) / 1000);
            var h = Math.floor(diff / 3600);
            var m = Math.floor((diff % 3600) / 60);
            var s = diff % 60;
            var timerEl = I.$('#timer-' + b.id);
            if (timerEl) timerEl.textContent = `${h}时 ${m}分 ${s}秒`;
          } else {
            loadBuildings();
          }
        }

        if (!b.upgrading_until) {
          var secs = (now - new Date(b.last_collected_at)) / 1000;
          var amount = Math.min(stats.cap, (secs / 3600) * stats.rate);
          var pct = Math.min(100, (amount / stats.cap) * 100);
          
          var amountText = card.querySelector('.amount-text');
          var bar = card.querySelector('.progress-fill');
          
          if (amountText) amountText.textContent = I.fmtNumber(amount);
          if (bar) {
            bar.style.width = pct + '%';
            if (pct >= 100) bar.classList.add('full');
          }
        }
      });
    }, 1000);
  }

  window.createBuilding = function() {
    var type = I.$('#newBuildType').value;
    var typeName = TYPE_INFO[type].name;
    var reqs = BUILD_COST[type];
    var costStr = reqs.map(r => TYPE_INFO[r.t].name + ' ' + I.fmtNumber(r.a)).join('、');
    
    if (!confirm(`确认花费 [${costStr}] 新建一个【${typeName}】吗？`)) return;
    
    I.toast('正在施工...', 'success', 1000);
    I.client.rpc('create_building', { p_type: type }).then(function(res) {
      if (res.error) { I.toast('建造失败', 'error'); return; }
      if (!res.data.ok) { I.toast(res.data.msg, 'error'); return; }
      
      I.toast('新建成功！', 'success');
      var tabBtns = document.querySelectorAll('.type-tab');
      tabBtns.forEach(btn => {
        if (btn.textContent.includes(typeName.substring(0,2))) {
          switchTab(type, btn);
        }
      });
      loadBuildings();
    });
  };

  window.collect = function(id, btn) {
    btn.disabled = true;
    I.client.rpc('collect_building', { b_id: id }).then(function(res) {
      if (res.error) { I.toast('收取失败', 'error'); btn.disabled = false; return; }
      if (!res.data.ok) { I.toast(res.data.msg, 'error'); btn.disabled = false; return; }
      
      var gained = res.data.gained;
      var type = res.data.type;
      
      var card = I.$('#card-' + id);
      var float = document.createElement('div');
      float.className = 'float-text';
      float.textContent = '+' + I.fmtNumber(gained);
      float.style.left = '50%';
      float.style.bottom = '50px';
      float.style.transform = 'translateX(-50%)';
      card.appendChild(float);
      setTimeout(() => float.remove(), 1500);

      I.toast(`成功收取 ${I.fmtNumber(gained)} ${TYPE_INFO[type].unit}`, 'success');
      
      var b = buildings.find(x => x.id === id);
      if (b) b.last_collected_at = new Date().toISOString();
      setTimeout(function(){ btn.disabled = false; }, 500);
    });
  };

  window.upgrade = function(id) {
    if (!confirm('确认升级该设施吗？升级期间将停止产出。')) return;
    I.client.rpc('upgrade_building', { b_id: id }).then(function(res) {
      if (res.error) { I.toast('升级失败', 'error'); return; }
      if (!res.data.ok) { I.toast(res.data.msg, 'error'); return; }
      I.toast(`开始升级，耗时 ${res.data.hours} 小时`, 'success');
      loadBuildings();
    });
  };

  window.cancelUpgrade = function(id) {
    if (!confirm('⚠️ 确定要取消升级吗？\n取消后将只会退还 50% 的升级资源！')) return;
    I.toast('正在取消升级...', 'success', 1000);
    I.client.rpc('cancel_upgrade_building', { b_id: id }).then(function(res) {
      if (res.error) { I.toast('取消失败', 'error'); return; }
      if (!res.data.ok) { I.toast(res.data.msg, 'error'); return; }
      I.toast('已取消升级，资源已退还', 'success');
      loadBuildings();
    });
  };

})();
</script>
</body>
</html>
