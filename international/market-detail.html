<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品详情 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .detail-container { max-width: 900px; margin: 30px auto 100px; padding: 0 16px; display: flex; gap: 30px; flex-wrap: wrap; }
  .product-img-box { flex: 1; min-width: 300px; border-radius: 16px; background: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 300px; border: 1px solid rgba(255,255,255,0.1); }
  .product-img-box img { width: 100%; max-height: 500px; object-fit: contain; }
  .product-info { flex: 1.2; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }
  .product-title { font-size: 24px; font-weight: 800; color: #fff; }
  .product-price { font-size: 36px; color: var(--gold-2); font-family: var(--mono); }
  .btn-buy { width: 100%; height: 50px; border-radius: 12px; background: linear-gradient(135deg, var(--gold), #b8860b); color: #000; font-size: 16px; font-weight: bold; border: none; cursor: pointer; }
  @media (max-width: 768px) { .detail-container { flex-direction: column; } .product-img-box { min-height: 200px; } }
</style>
</head>
<body>
<header class="iecp-topbar"><div class="iecp-topbar-inner"><a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a><nav class="iecp-nav" id="iecp-nav"></nav><div class="iecp-user" id="iecp-user"></div></div></header>

<main id="detailWrap"><div class="loading-state"><div class="spinner"></div><span>正在读取交易数据…</span></div></main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP; var itemId = new URLSearchParams(location.search).get('id'); var profile = null; var currentItem = null; var sellerProfile = null;

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('market');
    if (!itemId) { location.replace('market.html'); return; }
    
    I.getProfile(true).then(function(p) {
      profile = p;
      // 🚨 修复：先查商品
      return I.client.from('market_items').select('*').eq('id', itemId).maybeSingle();
    }).then(function(res){
      if (!res || res.error || !res.data) { I.$('#detailWrap').innerHTML = `<div style="text-align:center; padding:50px;">商品不存在</div>`; return; }
      currentItem = res.data;
      
      // 🚨 修复：再查卖家
      return I.client.from('profiles').select('id, username, flag_url').eq('id', currentItem.seller_id).maybeSingle();
    }).then(function(sellerRes) {
      sellerProfile = sellerRes.data || {};
      renderItem(currentItem);
    });
  });

  function renderItem(m) {
    var seller = sellerProfile;
    var isMine = m.seller_id === profile.id; var isSold = m.status === 'sold';
    var isOfficial = m.is_admin_post === true; var isUnit = m.item_type === 'unit';
    
    var actionHtml = isSold ? `<button class="btn-buy" disabled>已售罄</button>` : 
      (isMine ? `<button class="btn-buy" disabled>这是你的商品</button>` : 
      `<button class="btn-buy" onclick="buyItem('${m.id}', ${m.price}, ${isUnit})"><i class="fa-solid fa-cart-shopping"></i> 立即购买</button>`);

    I.$('#detailWrap').innerHTML = `
      <div class="detail-container">
        <div class="product-img-box">${m.image_url ? `<img src="${m.image_url}">` : `<i class="fa-solid fa-box-open" style="font-size:80px; color:rgba(255,255,255,0.1)"></i>`}</div>
        <div class="product-info">
          <div><a href="market.html" style="color:var(--muted);"><i class="fa-solid fa-arrow-left"></i> 返回交易行</a></div>
          <h1 class="product-title">${I.escapeHtml(m.title)} ${isOfficial ? '【官方】' : ''}</h1>
          <div style="background:rgba(212,175,55,0.1); padding:15px; border-radius:12px; display:flex; justify-content:space-between;">
            <div class="product-price">${I.fmtNumber(m.price)} ₽</div><div style="color:var(--muted);">库存: ${m.quantity}</div>
          </div>
          <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px;">
            <div style="font-size:12px; color:var(--muted);">卖家</div>
            <div style="font-weight:bold; color:var(--cyan);">${isOfficial ? 'IECP 官方' : I.escapeHtml(seller.username || '未知')}</div>
          </div>
          <div style="background:rgba(0,0,0,0.2); padding:20px; border-radius:12px; font-size:14px; white-space:pre-wrap;">${I.escapeHtml(m.description || '暂无描述')}</div>
          ${isUnit ? `<div style="color:var(--gold); font-size:13px;"><i class="fa-solid fa-bolt"></i> 提示：购买兵种后，将直接装备至你的军队库中，无需制造时间！</div>` : ''}
          ${actionHtml}
        </div>
      </div>`;
  }

  window.buyItem = function(itemId, price, isUnit) {
    if (profile.balance < price) return I.toast('国库余额不足', 'error');
    if (!confirm(`确认花费 ${I.fmtNumber(price)} ₽ 购买？`)) return;
    I.toast('正在处理...', 'success');

    if (isUnit) {
      I.client.rpc('buy_custom_unit', { p_buyer_id: profile.id, p_market_item_id: itemId }).then(function(res){
        if(res.error) return I.toast('购买失败: ' + res.error.message, 'error');
        if(!res.data.ok) return I.toast(res.data.msg, 'error');
        I.toast('购买成功，兵种已直接装备入库！', 'success');
        setTimeout(() => location.href = 'military.html', 1500);
      });
    } else {
      I.client.rpc('add_balance', { uid: profile.id, amount: -price, note: '交易行购买' }).then(function(r){
        I.client.from('market_items').update({ status: 'sold', buyer_id: profile.id }).eq('id', itemId).then(function(){
           I.toast('购买成功', 'success'); setTimeout(() => location.reload(), 1000);
        });
      });
    }
  };
})();
</script>
</body>
</html>
