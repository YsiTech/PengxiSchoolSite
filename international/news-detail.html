<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新闻详情 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { background-color: #05070a; }
  #news-particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

  /* 顶部扫描光效 */
  .glass { position: relative; overflow: hidden; }
  .glass::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: scanline 3s linear infinite; opacity: 0.6;
  }
  @keyframes scanline { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  /* 富文本渲染 */
  .rich-content { font-size: 16px; line-height: 1.9; color: var(--ink-2); white-space: pre-wrap; word-wrap: break-word; }
  .rich-content img, .rich-content video { max-width: 100%; border-radius: 12px; margin: 16px 0; border: 1px solid var(--border); display: block; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
  .rich-content audio { width: 100%; margin: 16px 0; outline: none; }

  /* 操作栏 */
  .detail-actions { display: flex; gap: 16px; align-items: center; border-top: 1px solid var(--border); padding-top: 24px; margin-top: 30px; }
  .detail-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: 24px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; white-space: nowrap; }
  .detail-btn:hover { background: rgba(255,255,255,0.08); color: var(--ink); border-color: var(--border-2); transform: translateY(-2px); }
  .detail-btn.liked { color: #ef4444; border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.1); }
  .detail-btn i { font-size: 16px; }

  /* 评论区 */
  .comment-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
  .comment-input-wrapper { background: rgba(0,0,0,0.3); border: 1px solid var(--border-2); border-radius: 8px; overflow: hidden; transition: border-color 0.2s; }
  .comment-input-wrapper:focus-within { border-color: var(--gold); box-shadow: 0 0 15px rgba(212,175,55,0.1); }
  .comment-input-wrapper textarea { width: 100%; min-height: 80px; background: transparent; border: none; padding: 12px; color: var(--ink); font-size: 14px; resize: vertical; outline: none; display: block; }
  .comment-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.1); }
  .comment-toolbar .img-btn { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; transition: color 0.2s; padding: 4px; }
  .comment-toolbar .img-btn:hover { color: var(--cyan); }
  
  .comment-item { display: flex; gap: 12px; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); position: relative; }
  .comment-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .comment-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-2); flex-shrink: 0; }
  .comment-content-box { flex: 1; min-width: 0; }
  .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .comment-user-info { display: flex; align-items: center; gap: 10px; }
  .comment-name { font-size: 14px; font-weight: 600; color: var(--gold-2); }
  .comment-time { font-size: 12px; color: var(--muted); }
  
  .comment-ops { display: flex; gap: 12px; opacity: 0; transition: opacity 0.2s; }
  .comment-item:hover .comment-ops { opacity: 1; }
  .op-btn { font-size: 12px; color: var(--muted); cursor: pointer; transition: 0.2s; }
  .op-btn:hover { color: var(--cyan); }
  .op-btn.del:hover { color: #ef4444; }

  .comment-text { font-size: 14px; color: var(--ink-2); line-height: 1.6; white-space: pre-wrap; margin-bottom: 8px; word-break: break-all; }
  .comment-text .at-user { color: var(--cyan); font-weight: bold; }
  .comment-img { max-width: 200px; border-radius: 8px; cursor: zoom-in; border: 1px solid var(--border); transition: transform 0.2s; }
  .comment-img:hover { transform: scale(1.02); }

  /* 移动端优化 */
  @media (max-width: 768px) {
    .iecp-main { padding: 16px 12px 40px !important; }
    .glass { padding: 20px 16px !important; }
    .glass h1 { font-size: 22px !important; line-height: 1.4 !important; }
    
    .detail-actions { gap: 8px !important; padding-top: 20px !important; margin-top: 20px !important; justify-content: space-between !important; }
    .detail-btn { flex: 1 !important; padding: 8px 0 !important; font-size: 12px !important; gap: 4px !important; border-radius: 12px !important; }
    .detail-btn i { font-size: 14px !important; }

    .comment-ops { opacity: 1 !important; }
    .comment-box { padding: 12px !important; }
    .comment-input-wrapper textarea { font-size: 16px !important; }
    .comment-avatar { width: 32px !important; height: 32px !important; }
    div[style*="display:flex; gap:10px; margin-left:auto;"] { margin-left: 0 !important; margin-top: 10px !important; width: 100% !important; justify-content: flex-end !important; }
  }
</style>
</head>
<body>

<canvas id="news-particle-canvas"></canvas>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<main class="iecp-main" id="detailWrap" style="max-width:900px; margin:40px auto;">
  <div class="loading-state"><div class="spinner"></div><span>正在解密新闻数据…</span></div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
// 粒子背景
(function initParticles() {
  const canvas = document.getElementById('news-particle-canvas'); const ctx = canvas.getContext('2d');
  let width, height; let particles = [];
  function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  class Particle {
    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3; this.radius = Math.random() * 1.5 + 0.5; }
    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
    draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(212, 175, 55, 0.2)'; ctx.fill(); }
  }
  for (let i = 0; i < 60; i++) particles.push(new Particle());
  function animate() { 
    ctx.clearRect(0, 0, width, height); 
    for (let i = 0; i < particles.length; i++) { 
      particles[i].update(); particles[i].draw(); 
      for (let j = i + 1; j < particles.length; j++) { 
        const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y; 
        const dist = Math.sqrt(dx * dx + dy * dy); 
        if (dist < 120) { 
          ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); 
          ctx.strokeStyle = `rgba(212, 175, 55, ${0.1 - dist / 1200})`; ctx.stroke(); 
        } 
      } 
    } 
    requestAnimationFrame(animate); 
  }
  animate();
})();

(function () {
  var I = IECP;
  var newsId = new URLSearchParams(location.search).get('id');
  var profile = null;
  var currentCommentImgUrl = null; 

  I.initTopbar('news');
  if (!newsId) { location.replace('news.html'); return; }

  // 🚨 取消强制登录，改为检测 Session
  I.client.auth.getSession().then(function (res) {
    var hasSession = !!(res.data && res.data.session);
    var profilePromise = hasSession ? I.getProfile(true) : Promise.resolve(null);

    profilePromise.then(function (p) {
      profile = p;
      
      var likePromise = profile 
        ? I.client.from('news_likes').select('id').eq('news_id', newsId).eq('user_id', profile.id).maybeSingle()
        : Promise.resolve({ data: null });

      Promise.all([
        I.client.from('news').select('*, profiles(id, username, flag_url, social_system)').eq('id', newsId).maybeSingle(),
        likePromise,
        I.client.from('news_comments').select('*, profiles(username, flag_url)').eq('news_id', newsId).order('created_at', { ascending: true })
      ]).then(function(results) {
        var newsRes = results[0], likeRes = results[1], commentsRes = results[2];
        if (newsRes.error || !newsRes.data) {
          I.$('#detailWrap').innerHTML = `<div class="empty-state glass"><i class="fa-solid fa-triangle-exclamation" style="color:var(--red)"></i><p>新闻不存在</p><a href="news.html" class="btn btn-ghost" style="margin-top:20px">返回</a></div>`;
          return;
        }
        renderNews(newsRes.data, !!likeRes.data);
        renderComments(commentsRes.data || []);
      });
    });
  });

  // 解析富文本中的占位符
  function renderRichContent(text, mediaList) {
    if (!text) return '';
    var safeText = I.escapeHtml(text);
    var map = {};
    if (mediaList && Array.isArray(mediaList)) {
      mediaList.forEach(m => { map[m.id] = m; });
    }
    var regex = /\[(图片|视频|音频):\s*([a-zA-Z0-9_]+)\]/g;
    return safeText.replace(regex, function(match, type, id) {
      var media = map[id];
      if (!media) return match;
      if (type === '图片') return `<img src="${media.url}" alt="新闻图片">`;
      if (type === '视频') return `<video src="${media.url}" controls></video>`;
      if (type === '音频') return `<audio src="${media.url}" controls></audio>`;
      return match;
    });
  }

  function renderNews(n, isLiked) {
    var author = n.profiles || {};
    var avatar = author.flag_url || I.avatarFallback(author.username || '?');
    var isAuthor = profile && author.id === profile.id;
    var contentHtml = renderRichContent(n.content, n.media_list);

    var unplacedMediaHtml = '';
    if (n.media_list && n.media_list.length > 0) {
      var usedIds = [];
      var regex = /\[(图片|视频|音频):\s*([a-zA-Z0-9_]+)\]/g;
      var match;
      while ((match = regex.exec(n.content)) !== null) { usedIds.push(match[2]); }
      n.media_list.forEach(function(m) {
        if (!usedIds.includes(m.id)) {
          if (m.type === 'image') unplacedMediaHtml += `<img src="${m.url}" style="max-width:100%; border-radius:12px; margin:16px 0; border:1px solid var(--border);">`;
          else if (m.type === 'video') unplacedMediaHtml += `<video src="${m.url}" controls style="max-width:100%; border-radius:12px; margin:16px 0; border:1px solid var(--border);"></video>`;
          else if (m.type === 'audio') unplacedMediaHtml += `<audio src="${m.url}" controls style="width:100%; margin:16px 0;"></audio>`;
        }
      });
    }

    var heartClass = isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
    var btnClass = isLiked ? 'detail-btn liked' : 'detail-btn';

    var authorActions = isAuthor ? `
      <div style="display:flex; gap:10px; margin-left:auto;">
        <button class="btn btn-ghost btn-sm" onclick="location.href='news.html'"><i class="fa-solid fa-pen"></i> 编辑</button>
        <button class="btn btn-red btn-sm" onclick="deleteCurrentNews()"><i class="fa-solid fa-trash"></i> 删除</button>
      </div>
    ` : '';

    // 🚨 评论框：未登录显示引导按钮，已登录显示输入框
    var commentBoxHtml = !profile ? `
      <div class="comment-box" style="text-align:center; padding: 30px; background: rgba(0,0,0,0.2); border: 1px dashed var(--border-2);">
        <p style="color: var(--muted); margin-bottom: 16px; font-size: 14px;">参与国际讨论，分享您的观点</p>
        <a href="login.html" class="btn btn-gold" style="padding: 10px 30px; border-radius: 8px;"><i class="fa-solid fa-arrow-right-to-bracket"></i> 登录后发表评论</a>
      </div>
    ` : `
      <div class="comment-box">
        <div class="comment-input-wrapper">
          <textarea id="commentInput" placeholder="发表你的看法，支持附带图片..."></textarea>
          <div class="comment-toolbar">
            <label class="img-btn" for="commentImgFile">
              <i class="fa-solid fa-image"></i> 添加图片
              <input type="file" id="commentImgFile" accept="image/*" style="display:none">
            </label>
            <button class="btn btn-gold btn-sm" id="submitCommentBtn" onclick="submitComment()" style="padding:6px 16px; font-size:12px; border-radius:6px;"><i class="fa-solid fa-paper-plane"></i> 发送</button>
          </div>
        </div>
        <div id="commentImgPreviewWrap" style="display: none; margin-top: 12px; position: relative; width: fit-content;">
          <img id="commentImgPreview" style="height:80px; border-radius:6px; border:1px solid var(--border); display: block;">
          <i class="fa-solid fa-circle-xmark" onclick="removeCommentImg()" style="position:absolute; top:-8px; right:-8px; color:#ef4444; font-size:18px; cursor:pointer; background:#0a0e1a; border-radius:50%;"></i>
        </div>
      </div>
    `;

    I.$('#detailWrap').innerHTML = `
      <div style="margin-bottom:20px;">
        <a href="news.html" style="color:var(--muted); font-size:14px;"><i class="fa-solid fa-arrow-left"></i> 返回新闻列表</a>
      </div>
      
      <div class="glass" style="padding:40px;">
        <h1 style="font-size:28px; line-height:1.4; margin-bottom:20px; color:var(--ink); font-weight:800;">${I.escapeHtml(n.title)}</h1>
        
        <div style="display:flex; align-items:center; gap:16px; padding-bottom:24px; border-bottom:1px solid var(--border); margin-bottom:30px; flex-wrap: wrap;">
          <img src="${I.escapeHtml(avatar)}" style="width:48px;height:32px;object-fit:cover;border-radius:4px;border:1px solid var(--border-2);">
          <div>
            <div style="font-size:15px; font-weight:600;"><a href="country.html?id=${author.id}" style="color:var(--gold-2);">${I.escapeHtml(author.username || '未知')}</a></div>
            <div style="font-size:12px; color:var(--muted); margin-top:2px;">${I.fmtDate(n.created_at)}</div>
          </div>
          ${authorActions}
        </div>

        <div class="rich-content">${contentHtml}</div>
        
        ${unplacedMediaHtml ? `<div style="margin-top:30px; padding-top:20px; border-top:1px dashed var(--border);"><h4 style="color:var(--muted); font-size:14px; margin-bottom:10px;">附加媒体</h4>${unplacedMediaHtml}</div>` : ''}
        
        <div class="detail-actions">
          <div class="${btnClass}" onclick="toggleLikeDetail(this)">
            <i class="${heartClass}"></i> <span id="likeCount">${n.like_count || 0}</span> 点赞
          </div>
          <div class="detail-btn" style="cursor:default">
            <i class="fa-regular fa-comment"></i> <span id="commentCount">${n.comment_count || 0}</span> 评论
          </div>
          <div class="detail-btn" onclick="shareDetail(this)">
            <i class="fa-solid fa-share-nodes"></i> <span id="shareCount">${n.share_count || 0}</span> 分享
          </div>
        </div>
      </div>

      <div class="glass" style="padding: 30px; margin-top: 24px;">
        <h3 style="margin-bottom: 20px; font-size: 18px; color: var(--ink);"><i class="fa-solid fa-comments" style="color:var(--gold);"></i> 国际评论</h3>
        
        ${commentBoxHtml}

        <div id="commentList" style="display: flex; flex-direction: column;"></div>
      </div>
    `;

    if (profile) {
      I.$('#commentImgFile').addEventListener('change', function() {
        var file = this.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { I.toast('图片不能超过 5MB', 'error'); return; }
        
        I.toast('正在上传图片...', 'success', 1000);
        var ext = (file.name.split('.').pop() || 'png').toLowerCase();
        var path = profile.id + '/comments/' + Date.now() + '.' + ext;
        
        I.client.storage.from('media').upload(path, file).then(function(r) {
          if (r.error) { I.toast('上传失败：' + r.error.message, 'error'); return; }
          var url = I.client.storage.from('media').getPublicUrl(path).data.publicUrl;
          currentCommentImgUrl = url;
          I.$('#commentImgPreview').src = url;
          I.$('#commentImgPreviewWrap').style.display = 'block'; 
        });
      });
    }
  }

  window.removeCommentImg = function() {
    currentCommentImgUrl = null;
    I.$('#commentImgFile').value = '';
    I.$('#commentImgPreviewWrap').style.display = 'none'; 
  };

  function renderComments(list) {
    var wrap = I.$('#commentList');
    if (!list.length) {
      wrap.innerHTML = '<div style="text-align:center; color:var(--muted); padding: 20px 0; font-size: 13px;">暂无评论，快来抢沙发吧~</div>';
      return;
    }
    var html = '';
    list.forEach(function(c) {
      var p = c.profiles || {};
      var avatar = p.flag_url || I.avatarFallback(p.username || '?');
      var imgHtml = c.image_url ? `<div style="margin-top:8px;"><img src="${c.image_url}" class="comment-img" onclick="window.open(this.src)"></div>` : '';
      
      var isMyComment = profile && (c.user_id === profile.id);
      var formattedContent = I.escapeHtml(c.content).replace(/@([a-zA-Z0-9_\u4e00-\u9fa5]+)/g, '<span class="at-user">@$1</span>');

      html += `
        <div class="comment-item" id="comment-${c.id}">
          <img src="${avatar}" class="comment-avatar">
          <div class="comment-content-box">
            <div class="comment-header">
              <div class="comment-user-info">
                <span class="comment-name">${I.escapeHtml(p.username || '未知')}</span>
                <span class="comment-time">${I.relativeTime(c.created_at)}</span>
              </div>
              <div class="comment-ops">
                ${profile ? `<span class="op-btn" onclick="replyTo('${I.escapeHtml(p.username)}')"><i class="fa-solid fa-reply"></i> 回复</span>` : ''}
                ${isMyComment ? `<span class="op-btn del" onclick="deleteComment('${c.id}')"><i class="fa-solid fa-trash"></i> 删除</span>` : ''}
              </div>
            </div>
            <div class="comment-text">${formattedContent}</div>
            ${imgHtml}
          </div>
        </div>
      `;
    });
    wrap.innerHTML = html;
  }

  window.replyTo = function(username) {
    if (!profile) return I.toast('请先登录后再操作', 'error');
    var input = I.$('#commentInput');
    if (!input) return;
    var prefix = '@' + username + ' ';
    if (!input.value.startsWith('@')) { input.value = prefix + input.value; } 
    else { input.value = prefix; }
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    I.$('.comment-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  window.deleteComment = function(commentId) {
    if (!profile) return I.toast('请先登录后再操作', 'error');
    if (!confirm('⚠️ 确定要删除这条评论吗？')) return;
    I.toast('正在删除...', 'success', 1000);
    I.client.from('news_comments').delete().eq('id', commentId).then(function(r) {
      if (r.error) return I.toast('删除失败：' + r.error.message, 'error');
      I.toast('评论已删除', 'success');
      var cSpan = I.$('#commentCount');
      if (cSpan) cSpan.textContent = Math.max(0, parseInt(cSpan.textContent) - 1);
      I.client.from('news_comments').select('*, profiles(username, flag_url)').eq('news_id', newsId).order('created_at', { ascending: true }).then(function(res) {
        renderComments(res.data || []);
      });
    });
  };

  window.deleteCurrentNews = function() {
    if (!profile) return I.toast('请先登录后再操作', 'error');
    if (!confirm('⚠️ 确定要彻底删除这条新闻吗？')) return;
    I.client.from('news').delete().eq('id', newsId).then(function(r) {
      if (r.error) return I.toast('删除失败：' + r.error.message, 'error');
      I.toast('新闻已删除', 'success');
      setTimeout(() => location.href = 'news.html', 800);
    });
  };

  window.toggleLikeDetail = function(el) {
    if (!profile) return I.toast('请先登录后再点赞', 'error');
    var icon = el.querySelector('i');
    var span = I.$('#likeCount');
    var currentCount = parseInt(span.textContent) || 0;
    var isLiked = el.classList.contains('liked');
    if (isLiked) {
      I.client.from('news_likes').delete().eq('news_id', newsId).eq('user_id', profile.id).then(function() {
        el.classList.remove('liked');
        icon.classList.replace('fa-solid', 'fa-regular');
        span.textContent = Math.max(0, currentCount - 1);
      });
    } else {
      I.client.from('news_likes').insert({news_id: newsId, user_id: profile.id}).then(function() {
        el.classList.add('liked');
        icon.classList.replace('fa-regular', 'fa-solid');
        span.textContent = currentCount + 1;
      });
    }
  };

  window.shareDetail = function(el) {
    if (!profile) return I.toast('请先登录后再分享', 'error');
    if (el.style.pointerEvents === 'none') return;
    navigator.clipboard.writeText(location.href).then(function() {
      I.toast('链接已复制到剪贴板', 'success');
      var span = I.$('#shareCount');
      span.textContent = (parseInt(span.textContent) || 0) + 1;
      I.client.rpc('increment_share_count', { n_id: newsId });
      el.style.opacity = '0.5';
      el.style.pointerEvents = 'none';
      setTimeout(function() { el.style.opacity = '1'; el.style.pointerEvents = 'auto'; }, 3000);
    });
  };

  window.submitComment = function() {
    if (!profile) return I.toast('请先登录后再评论', 'error');
    var input = I.$('#commentInput');
    if (!input) return;
    var content = input.value.trim();
    if (!content && !currentCommentImgUrl) { I.toast('请输入评论或上传图片', 'error'); return; }
    var btn = I.$('#submitCommentBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 发送中';
    I.client.from('news_comments').insert({ news_id: newsId, user_id: profile.id, content: content || '', image_url: currentCommentImgUrl }).then(function(r) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 发送';
      if (r.error) { I.toast(r.error.message, 'error'); return; }
      input.value = '';
      removeCommentImg(); 
      I.toast('评论发布成功', 'success');
      var cSpan = I.$('#commentCount');
      cSpan.textContent = parseInt(cSpan.textContent) + 1;
      I.client.from('news_comments').select('*, profiles(username, flag_url)').eq('news_id', newsId).order('created_at', { ascending: true }).then(function(res) {
        renderComments(res.data || []);
      });
    });
  };
})();
</script>
</body>
</html>
