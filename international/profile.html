<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户中心 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/profile.css">
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html">
      <img src="photo/un.png" alt="IECP">
      <div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div>
    </a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<main class="iecp-main" id="profileWrap">
  <div class="loading-state"><div class="spinner"></div><span>正在读取国家档案…</span></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP;
  var profile = null;

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('profile');
    
    I.getProfile(true).then(function (p) {
      if (!p) throw new Error('未找到国家档案。');
      profile = p;
      render();
    }).catch(function (err) {
      console.error('[IECP] 加载失败:', err);
      I.$('#profileWrap').innerHTML = `
        <div class="empty-state glass" style="margin:40px auto;max-width:600px">
          <i class="fa-solid fa-triangle-exclamation" style="color:var(--red);font-size:40px;margin-bottom:15px"></i>
          <p style="font-size:18px;font-weight:bold;color:var(--ink)">无法读取国家数据</p>
          <p style="color:var(--red);margin:10px 0">${err.message || '网络请求超时'}</p>
          <div style="margin-top:20px">
            <button class="btn btn-ghost" onclick="location.reload()">刷新重试</button>
            <button class="btn btn-ghost" onclick="IECP.logout()">退出登录</button>
          </div>
        </div>
      `;
    });
  });

  function render() {
    var wrap = I.$('#profileWrap');

    wrap.innerHTML = `
      <div class="profile-grid">
        <!-- 左列 -->
        <aside class="profile-side">
          <div class="profile-card glass">
            <div class="profile-avatar-wrap">
              <div class="profile-avatar" id="avatarDisplay">
                <img src="${I.escapeHtml(profile.flag_url || I.avatarFallback(profile.username))}" alt="">
              </div>
              <label class="profile-avatar-edit" for="pFlag" title="更换国旗">
                <i class="fa-solid fa-camera"></i>
              </label>
              <input id="pFlag" type="file" accept="image/*" style="display:none">
            </div>

            <h2 class="profile-name">${I.escapeHtml(profile.username)}</h2>
            <p class="profile-email">${I.escapeHtml(profile.social_system)}</p>
            
            <div style="margin-bottom:14px">
              <span class="role-tag"><i class="fa-solid fa-shield-halved"></i> 主权国家</span>
            </div>

            <div class="exp-bar-wrap">
              <div class="exp-text">
                <span>Lv.<span>1</span></span>
                <span>国际影响力 <span>100</span> / 500</span>
              </div>
              <div class="exp-track">
                <div class="exp-fill" style="width: 20%;"></div>
              </div>
            </div>
            
            <p class="profile-hint">加入时间：${I.fmtDate(profile.created_at).split(' ')[0]}</p>
          </div>

          <!-- 国库储备卡片 -->
          <div class="balance-card">
            <div class="bc-top">
              <div class="bc-emblem">₽</div>
              <div class="bc-title-group">
                <div class="bc-title">国库储备</div>
                <div class="bc-subtitle">National Treasury</div>
              </div>
            </div>
            <div class="bc-amount-group">
              <div class="bc-amount">${I.fmtNumber(profile.balance)}</div>
              <div class="bc-amount-unit">亚斯卢布 · АСР ₽</div>
            </div>
            <div class="bc-bottom">
              <div class="bc-holder">
                <span class="bc-holder-label">国家元首 / 户名</span>
                <span class="bc-holder-value">${I.escapeHtml(profile.username)}</span>
              </div>
              <img src="${I.escapeHtml(profile.emblem_url || I.avatarFallback(profile.username))}" style="width:38px;height:38px;object-fit:contain;opacity:0.8;border-radius:50%;">
            </div>
            <div class="bc-shine"></div>
          </div>

          <!-- 国家仓库入口卡片 -->
          <div class="inventory-card" onclick="location.href='inventory.html'">
            <div class="ic-top">
              <div class="ic-emblem"><i class="fa-solid fa-boxes-stacked"></i></div>
              <div class="ic-title-group">
                <div class="ic-title">国家仓库</div>
                <div class="ic-subtitle">National Inventory</div>
              </div>
            </div>
            <div class="ic-content">
              <span>查看你拥有的国际物资</span>
              <i class="fa-solid fa-arrow-right ic-arrow"></i>
            </div>
          </div>

        </aside>

        <!-- 右列 -->
        <section class="profile-content">
          
          <!-- 国家档案编辑 -->
          <div class="card glass">
            <div class="card-head">
              <h3><i class="fa-solid fa-pen-to-square" style="color:var(--gold)"></i> 编辑国家档案</h3>
            </div>
            <div class="form-grid two">
              <div class="field full">
                <label>国家名</label>
                <input id="pUsername" type="text" value="${I.escapeHtml(profile.username)}" maxlength="30">
              </div>
              <div class="field">
                <label>社会性质</label>
                <input id="pSocial" type="text" value="${I.escapeHtml(profile.social_system)}" maxlength="40">
              </div>
              <div class="field">
                <label>首都</label>
                <input id="pCapital" type="text" value="${I.escapeHtml(profile.capital)}" maxlength="40">
              </div>
              <div class="field full">
                <label>官方语言</label>
                <input id="pLanguage" type="text" value="${I.escapeHtml(profile.official_language)}" maxlength="80">
              </div>
              <div class="field full">
                <label>更换国徽</label>
                <input id="pEmblem" type="file" accept="image/*" style="padding:9px 12px;font-size:13px">
              </div>
            </div>
            <div class="profile-actions">
              <button class="btn btn-gold" id="saveProfileBtn"><i class="fa-solid fa-floppy-disk"></i> 保存修改</button>
            </div>
          </div>

          <!-- 账号安全 -->
          <div class="card glass">
            <div class="card-head">
              <h3><i class="fa-solid fa-shield-halved" style="color:var(--gold)"></i> 账号安全</h3>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label>登录邮箱</label>
                <input type="text" id="pEmail" disabled style="background:rgba(255,255,255,0.02);color:var(--muted)">
              </div>
              <div class="field">
                <label>新密码</label>
                <input id="pPassword" type="password" placeholder="留空则不修改">
              </div>
              <div class="field">
                <label>确认新密码</label>
                <input id="pPassword2" type="password" placeholder="再次输入新密码">
              </div>
            </div>
            <div class="profile-actions">
              <button class="btn btn-cyan" id="savePwdBtn"><i class="fa-solid fa-key"></i> 修改密码</button>
            </div>
          </div>

          <!-- 危险操作 -->
          <div class="card glass danger-card">
            <div class="card-head"><h3><i class="fa-solid fa-triangle-exclamation" style="color:var(--red)"></i> 账号操作</h3></div>
            <p class="muted small" style="margin:0 0 16px">退出登录后需要重新输入邮箱和密码才能进入。</p>
            <button class="btn btn-red" id="logoutBtn" style="width:100%;max-width:200px"><i class="fa-solid fa-arrow-right-from-bracket"></i> 退出登录</button>
          </div>

        </section>
      </div>
    `;

    I.client.auth.getUser().then(function (res) {
      var u = res.data && res.data.user;
      if (u) I.$('#pEmail').value = u.email || '';
    });

    I.$('#pFlag').addEventListener('change', function() {
      var file = this.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          I.$('#avatarDisplay').innerHTML = `<img src="${e.target.result}" alt="">`;
        };
        reader.readAsDataURL(file);
      }
    });

    I.$('#saveProfileBtn').addEventListener('click', function () {
      var btn = this; btn.disabled = true;
      var data = {
        username: I.$('#pUsername').value.trim(),
        social_system: I.$('#pSocial').value.trim(),
        capital: I.$('#pCapital').value.trim(),
        official_language: I.$('#pLanguage').value.trim()
      };

      var flagFile = I.$('#pFlag').files[0];
      var emblemFile = I.$('#pEmblem').files[0];

      function up(bucket, file, field) {
        if (!file) return Promise.resolve();
        var ext = (file.name.split('.').pop() || 'png').toLowerCase();
        var path = profile.id + '/' + field + '-' + Date.now() + '.' + ext;
        return I.client.storage.from(bucket).upload(path, file, { upsert: true }).then(function (r) {
          if (r.error) throw r.error;
          var pub = I.client.storage.from(bucket).getPublicUrl(path);
          data[field === 'flag' ? 'flag_url' : 'emblem_url'] = pub.data.publicUrl;
        });
      }

      up('flags', flagFile, 'flag')
        .then(function () { return up('emblems', emblemFile, 'emblem'); })
        .then(function () { return I.client.from('profiles').update(data).eq('id', profile.id); })
        .then(function (r) {
          btn.disabled = false;
          if (r && r.error) { I.toast(r.error.message, 'error'); return; }
          I.toast('档案已更新', 'success');
          I.clearProfileCache();
          setTimeout(function() { location.reload(); }, 800);
        })
        .catch(function(err){
          btn.disabled = false;
          I.toast('保存失败: ' + err.message, 'error');
        });
    });

    I.$('#savePwdBtn').addEventListener('click', function () {
      var p1 = I.$('#pPassword').value;
      var p2 = I.$('#pPassword2').value;
      if (!p1) { I.toast('请输入新密码', 'error'); return; }
      if (p1.length < 6) { I.toast('密码至少 6 位', 'error'); return; }
      if (p1 !== p2) { I.toast('两次输入不一致', 'error'); return; }
      
      var btn = this; btn.disabled = true;
      I.client.auth.updateUser({ password: p1 }).then(function (r) {
        btn.disabled = false;
        if (r.error) { I.toast(r.error.message, 'error'); return; }
        I.toast('密码修改成功', 'success');
        I.$('#pPassword').value = '';
        I.$('#pPassword2').value = '';
      });
    });

    I.$('#logoutBtn').addEventListener('click', function () {
      if (confirm('确定退出登录吗？')) I.logout();
    });
  }
})();
</script>

</body>
</html>
