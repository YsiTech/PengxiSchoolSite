<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户中心 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html">
      <img src="photo/un.png" alt="IECP">
      <div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div>
    </a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<section class="iecp-page-head">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb">
      <a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>用户中心</span>
    </div>
    <h1><i class="fa-solid fa-user"></i> 用户中心</h1>
    <p>管理你的国家档案与账号信息</p>
  </div>
</section>

<main class="iecp-main" id="profileWrap">
  <div class="loading-state"><div class="spinner"></div><span>正在加载…</span></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP;
  var profile = null;

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('profile');
    I.getProfile(true).then(function (p) {
      profile = p;
      render();
    });
  });

  function render() {
    if (!profile) return;
    var wrap = I.$('#profileWrap');

    wrap.innerHTML =
      '<section class="glass" style="padding:32px;margin-bottom:24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap">' +
        '<img src="' + I.escapeHtml(profile.flag_url || I.avatarFallback(profile.username)) + '" style="width:100px;height:66px;object-fit:cover;border-radius:8px;border:1px solid var(--border-2)">' +
        '<div style="flex:1;min-width:200px">' +
          '<h2 style="font-size:22px;margin:0 0 4px">' + I.escapeHtml(profile.username) + '</h2>' +
          '<p style="color:var(--muted);margin:0">' + I.escapeHtml(profile.social_system) + '</p>' +
        '</div>' +
        '<div style="text-align:right">' +
          '<div style="font-size:11.5px;color:var(--muted);letter-spacing:1px">国库余额</div>' +
          '<div style="font-family:var(--mono);font-size:22px;color:var(--gold-2)">' + I.fmtNumber(profile.balance) + ' ₽</div>' +
        '</div>' +
      '</section>' +

      '<div class="field-group two" style="grid-template-columns:1fr 1fr;gap:22px">' +

        '<section class="glass" style="padding:28px">' +
          '<h3 style="margin:0 0 20px;font-size:15.5px;letter-spacing:1px"><i class="fa-solid fa-pen" style="color:var(--gold)"></i> 编辑国家档案</h3>' +
          '<div class="field-group">' +
            '<div class="field"><label>国家名</label><input id="pUsername" type="text" value="' + I.escapeHtml(profile.username) + '" maxlength="30"></div>' +
            '<div class="field"><label>社会性质</label><input id="pSocial" type="text" value="' + I.escapeHtml(profile.social_system) + '" maxlength="40"></div>' +
            '<div class="field"><label>首都</label><input id="pCapital" type="text" value="' + I.escapeHtml(profile.capital) + '" maxlength="40"></div>' +
            '<div class="field"><label>官方语言</label><input id="pLanguage" type="text" value="' + I.escapeHtml(profile.official_language) + '" maxlength="80"></div>' +
            '<div class="field-group two" style="gap:12px">' +
              '<div class="field"><label>国旗</label><input id="pFlag" type="file" accept="image/*" style="padding:8px 10px;font-size:12.5px"></div>' +
              '<div class="field"><label>国徽</label><input id="pEmblem" type="file" accept="image/*" style="padding:8px 10px;font-size:12.5px"></div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;justify-content:flex-end;margin-top:16px">' +
            '<button class="btn btn-gold" id="saveProfileBtn"><i class="fa-solid fa-floppy-disk"></i> 保存</button>' +
          '</div>' +
        '</section>' +

        '<section class="glass" style="padding:28px">' +
          '<h3 style="margin:0 0 20px;font-size:15.5px;letter-spacing:1px"><i class="fa-solid fa-shield-halved" style="color:var(--gold)"></i> 账号安全</h3>' +
          '<div class="field-group">' +
            '<div class="field"><label>邮箱</label><input type="text" value="' + I.escapeHtml((I.client.auth.getUser && '') || '') + '" disabled placeholder="—" id="pEmail"></div>' +
            '<div class="field"><label>新密码（留空不修改）</label><input id="pPassword" type="password" placeholder="至少 6 位"></div>' +
            '<div class="field"><label>确认新密码</label><input id="pPassword2" type="password" placeholder="再次输入"></div>' +
          '</div>' +
          '<div style="display:flex;justify-content:space-between;margin-top:16px;gap:10px;flex-wrap:wrap">' +
            '<button class="btn btn-red" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> 退出登录</button>' +
            '<button class="btn btn-gold" id="savePwdBtn"><i class="fa-solid fa-key"></i> 修改密码</button>' +
          '</div>' +
        '</section>' +

      '</div>';

    /* 显示邮箱 */
    I.client.auth.getUser().then(function (res) {
      var u = res.data && res.data.user;
      if (u) I.$('#pEmail').value = u.email || '';
    });

    /* 保存资料 */
    I.$('#saveProfileBtn').addEventListener('click', function () {
      var btn = this;
      btn.disabled = true;
      var data = {
        username: I.$('#pUsername').value.trim(),
        social_system: I.$('#pSocial').value.trim(),
        capital: I.$('#pCapital').value.trim(),
        official_language: I.$('#pLanguage').value.trim()
      };

      var flagFile = I.$('#pFlag').files[0];
      var emblemFile = I.$('#pEmblem').files[0];

      function up(bucket, file, field) {
        if (!file) return Promise.resolve();
        var ext = (file.name.split('.').pop() || 'png').toLowerCase();
        var path = profile.id + '/' + field + '-' + Date.now() + '.' + ext;
        return I.client.storage.from(bucket).upload(path, file, { upsert: true }).then(function (r) {
          if (r.error) throw r.error;
          var pub = I.client.storage.from(bucket).getPublicUrl(path);
          data[field === 'flag' ? 'flag_url' : 'emblem_url'] = pub.data.publicUrl;
        });
      }

      up('flags', flagFile, 'flag')
        .then(function () { return up('emblems', emblemFile, 'emblem'); })
        .then(function () {
          return I.client.from('profiles').update(data).eq('id', profile.id);
        })
        .then(function (r) {
          btn.disabled = false;
          if (r && r.error) { I.toast(r.error.message, 'error'); return; }
          I.toast('已保存', 'success');
          I.clearProfileCache();
          setTimeout
