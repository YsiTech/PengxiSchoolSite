<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>军工厂 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .mil-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 30px; }
  .unit-card { background: linear-gradient(150deg, #1a2b4c 0%, #0f1f3d 100%); border: 1px solid rgba(212,175,55,0.25); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .defense-card { border-color: rgba(79,195,247,0.4); background: linear-gradient(150deg, #102a43 0%, #0f1f3d 100%); }
  .unit-header { display: flex; align-items: center; gap: 16px; }
  .unit-icon { width: 50px; height: 50px; border-radius: 12px; background: rgba(212,175,55,0.15); color: var(--gold); display: grid; place-items: center; font-size: 24px; }
  .defense-card .unit-icon { background: rgba(79,195,247,0.15); color: var(--cyan); }
  .unit-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .unit-count { font-size: 13px; color: var(--cyan); }
  .unit-cost { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; }
  .cost-item { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .cost-item i { color: var(--gold-2); }
  .build-row { display: flex; gap: 10px; }
  .build-row input { width: 80px; text-align: center; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff; font-weight: bold; }
</style>
</head>
<body>
<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>
<section class="iecp-page-head">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb"><a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>军工厂</span></div>
    <div><h1><i class="fa-solid fa-industry"></i> 军工与防御</h1><p>扩充你的武装力量，巩固国家防线</p></div>
  </div>
</section>
<main class="iecp-main">
  <div id="resTop" class="glass" style="padding:20px; margin-bottom:24px; display:flex; justify-content:space-around; flex-wrap:wrap; gap:20px;"></div>
  <h2 style="color:var(--gold); font-size:18px; margin-bottom:16px;"><i class="fa-solid fa-jet-fighter-up"></i> 进攻部队</h2>
  <div class="mil-grid" id="unitList"></div>
  <h2 style="color:var(--cyan); font-size:18px; margin-top:40px; margin-bottom:16px;"><i class="fa-solid fa-shield-halved"></i> 防御工事</h2>
  <div class="mil-grid" id="defenseList"></div>
</main>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP;
  var profile = null;
  var myRes = null;
  var myMil = null;

  var UNITS = [
    { type: 'infantry', name: '机械化步兵', icon: 'fa-person-rifle', cost: { food: 10, iron_ore: 5 }, desc: '基础作战单位。' },
    { type: 'tanks', name: '主战坦克', icon: 'fa-truck-monster', cost: { oil: 20, iron_ore: 30 }, desc: '钢铁洪流。' },
    { type: 'fighters', name: '第五代战机', icon: 'fa-jet-fighter', cost: { oil: 50, rare_metal: 15 }, desc: '制空权。' }
  ];
  var DEFENSES = [
    { type: 'bunkers', name: '地下碉堡', icon: 'fa-torii-gate', cost: { iron_ore: 50, food: 20 }, desc: '提供 5 点基础防御战力。' },
    { type: 'aaa', name: '防空导弹阵地', icon: 'fa-rocket', cost: { iron_ore: 80, rare_metal: 10 }, desc: '提供 15 点高额防御战力。' }
  ];

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('military'); 
    I.getProfile(true).then(function (p) {
      profile = p;
      loadData();
    });
  });

  function loadData() {
    Promise.all([
      I.client.from('country_resources').select('*').eq('country_id', profile.id).maybeSingle(),
      I.client.from('military').select('*').eq('country_id', profile.id).maybeSingle()
    ]).then(function(results) {
      myRes = results[0].data;
      myMil = results[1].data;
      if (!myMil) {
         I.client.from('military').insert({country_id: profile.id}).then(function(){ location.reload(); });
         return;
      }
      renderRes();
      renderList(UNITS, 'unitList');
      renderList(DEFENSES, 'defenseList');
    });
  }

  function renderRes() {
    I.$('#resTop').innerHTML = `
      <div class="cost-item"><i class="fa-solid fa-wheat-awn"></i> 粮食: <b>${I.fmtNumber(myRes.food)}</b></div>
      <div class="cost-item"><i class="fa-solid fa-mountain"></i> 铁矿: <b>${I.fmtNumber(myRes.iron_ore)}</b></div>
      <div class="cost-item"><i class="fa-solid fa-oil-well"></i> 原油: <b>${I.fmtNumber(myRes.oil)}</b></div>
      <div class="cost-item"><i class="fa-solid fa-atom"></i> 稀有金属: <b>${I.fmtNumber(myRes.rare_metal)}</b></div>
    `;
  }

  function renderList(listData, containerId) {
    var html = '';
    listData.forEach(function(u) {
      var owned = myMil[u.type] || 0;
      var costHtml = '';
      for (var key in u.cost) {
        var resName = { food:'粮食', iron_ore:'铁矿', oil:'原油', rare_metal:'稀有金属' }[key];
        costHtml += `<div class="cost-item"><i class="fa-solid fa-caret-right" style="font-size:10px;color:var(--muted)"></i> ${resName} ${u.cost[key]}</div>`;
      }
      var isDefense = containerId === 'defenseList';
      html += `
        <div class="unit-card ${isDefense ? 'defense-card' : ''}">
          <div class="unit-header">
            <div class="unit-icon"><i class="fa-solid ${u.icon}"></i></div>
            <div><div class="unit-title">${u.name}</div><div class="unit-count">当前拥有: ${I.fmtNumber(owned)}</div></div>
          </div>
          <p style="font-size:12px; color:var(--muted); margin:0;">${u.desc}</p>
          <div class="unit-cost">${costHtml}</div>
          <div class="build-row">
            <input type="number" id="qty_${u.type}" value="1" min="1">
            <button class="btn ${isDefense ? 'btn-cyan' : 'btn-gold'}" onclick="build('${u.type}', ${isDefense})" style="flex:1"><i class="fa-solid fa-hammer"></i> ${isDefense ? '建造' : '制造'}</button>
          </div>
        </div>
      `;
    });
    I.$('#' + containerId).innerHTML = html;
  }

  window.build = function(type, isDefense) {
    var qty = parseInt(I.$('#qty_' + type).value, 10);
    if (!qty || qty < 1) { I.toast('请输入正确数量', 'error'); return; }
    I.toast('正在处理...', 'success', 1000);
    I.client.rpc('train_units', { c_id: profile.id, u_type: type, u_amount: qty }).then(function(res) {
      if (res.error) { I.toast('失败：' + res.error.message, 'error'); return; }
      if (!res.data.ok) { I.toast(res.data.msg, 'error'); } 
      else { I.toast('执行成功！', 'success'); loadData(); }
    });
  };
})();
</script>
</body>
</html>
