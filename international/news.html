<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新闻发布 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* 🚨 核心修复：等高卡片网格 */
  .news-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
    align-items: stretch; /* 强制等高 */
  }
  .news-card {
    display: flex;
    flex-direction: column;
    height: 100%; /* 撑满整个网格高度 */
    overflow: hidden;
  }

  /* 媒体区域统一高度 */
  .news-media {
    height: 200px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    background: var(--glass-2);
  }
  .news-media img, .news-media video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  /* 音频区域专属居中处理 */
  .news-media.audio-media {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .news-media.audio-media audio {
    width: 100%;
  }

  /* 文字内容区 */
  .news-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex: 1; /* 撑满剩余空间 */
  }
  .news-body h3 {
    font-size: 16px; line-height: 1.5; margin: 0 0 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .news-body p {
    font-size: 13px; color: var(--muted); margin: 0 0 16px; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    flex: 1; /* 让文字区自己撑开 */
  }

  /* 🚨 核心修复：把底部操作栏推到最底部 */
  .news-footer-bar {
    margin-top: auto; 
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 14px; border-top: 1px solid var(--border);
  }
  
  .news-action-group { display: flex; gap: 8px; }
  .news-pill-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 20px;
    background: var(--glass-2); border: 1px solid var(--border);
    font-size: 12px; color: var(--muted); cursor: pointer;
    transition: all 0.2s ease; user-select: none;
  }
  .news-pill-btn:hover { background: var(--glass-3); color: var(--ink); border-color: var(--border-2); }
  .news-pill-btn i { font-size: 14px; }
  .news-pill-btn.liked { color: #ef4444; border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.08); }

  /* 上传框样式 */
  .custom-upload {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 100px; padding: 16px;
    background: rgba(0,0,0,0.2); border: 1.5px dashed var(--border-2);
    border-radius: var(--r-sm); cursor: pointer; transition: 0.2s;
    text-align: center; position: relative; overflow: hidden;
  }
  .custom-upload:hover { border-color: var(--gold); background: var(--glass-2); }
  .custom-upload i { font-size: 28px; color: var(--gold); margin-bottom: 8px; }
  .custom-upload span { font-size: 13px; color: var(--muted); }
  .custom-upload .file-preview {
    display: none; align-items: center; gap: 10px; background: var(--glass-3);
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); z-index: 2;
  }
  .custom-upload .file-preview i { font-size: 20px; margin: 0; color: var(--cyan); }
  .custom-upload .file-preview span { color: var(--ink); font-weight: 600; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .custom-upload.has-file { border-style: solid; border-color: var(--cyan); background: rgba(79,195,247,0.05); }
  .custom-upload.has-file > i, .custom-upload.has-file > span.placeholder { display: none; }
  .custom-upload.has-file .file-preview { display: flex; }

  select {
    background-color: rgba(0, 0, 0, 0.3) !important; color: var(--ink) !important;
    border: 1px solid var(--border-2) !important; border-radius: var(--r-sm);
    outline: none; cursor: pointer; padding: 12px 14px;
  }
  select:focus { border-color: var(--gold) !important; }
  select option { background-color: #111827 !important; color: #fff !important; }
</style>
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html">
      <img src="photo/un.png" alt="IECP">
      <div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div>
    </a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<section class="iecp-page-head">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb">
      <a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>新闻发布</span>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px">
      <div>
        <h1><i class="fa-solid fa-newspaper"></i> 新闻发布</h1>
        <p>发布你的国家动态、外交声明与重大事件</p>
      </div>
      <button class="btn btn-gold" id="openPublishBtn"><i class="fa-solid fa-pen-nib"></i> 发布新闻</button>
    </div>
  </div>
</section>

<main class="iecp-main">
  <div id="newsList">
    <div class="loading-state"><div class="spinner"></div><span>正在加载新闻…</span></div>
  </div>
</main>

<!-- 新闻发布弹窗 -->
<div class="iecp-modal" id="publishModal">
  <div class="iecp-modal-box glass-2" style="max-width:650px">
    <h3><i class="fa-solid fa-pen-nib" style="color:var(--gold)"></i> 发布新闻</h3>
    <form id="newsForm" style="margin-top:20px">
      <div class="field-group">
        <div class="field">
          <label>标题 <span class="req">*</span></label>
          <input id="nTitle" type="text" placeholder="新闻标题" maxlength="100">
        </div>
        <div class="field">
          <label>正文 <span class="req">*</span></label>
          <textarea id="nContent" placeholder="新闻正文内容……" style="min-height:120px"></textarea>
        </div>
        <div class="field-group two">
          <div class="field">
            <label>媒体类型</label>
            <select id="nMediaType">
              <option value="">无媒体</option>
              <option value="image">图片</option>
              <option value="video">视频</option>
              <option value="audio">音频</option>
            </select>
          </div>
          <div class="field">
            <label>上传媒体</label>
            <label class="custom-upload" id="newsUploadBox" for="nMediaFile">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span class="placeholder">点击选择文件</span>
              <div class="file-preview">
                <i class="fa-solid fa-file"></i>
                <span id="newsFileName">未选择文件</span>
              </div>
              <input id="nMediaFile" type="file" accept="image/*,video/*,audio/*" style="display:none">
            </label>
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">
        <span id="newsHint" style="font-size:13px;color:var(--red);margin-right:auto;align-self:center;font-weight:bold;"></span>
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('publishModal').classList.remove('open')">取消</button>
        <button class="btn btn-gold" type="submit" id="newsSubmit"><i class="fa-solid fa-paper-plane"></i> 确认发布</button>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP;
  var profile = null;

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('news');
    I.getProfile(true).then(function (p) {
      profile = p;
      loadNews();
    });
  });

  I.$('#openPublishBtn').addEventListener('click', function(){
    I.$('#publishModal').classList.add('open');
  });

  I.$('#nMediaFile').addEventListener('change', function() {
    var file = this.files[0];
    var box = I.$('#newsUploadBox');
    if (file) {
      box.classList.add('has-file');
      I.$('#newsFileName').textContent = file.name;
    } else {
      box.classList.remove('has-file');
      I.$('#newsFileName').textContent = '未选择文件';
    }
  });

  function loadNews() {
    I.client.from('news').select('*, profiles(id, username, flag_url)').order('created_at', { ascending: false }).limit(60).then(function (res) {
      var list = res.data || [];
      if (!list.length) {
        I.$('#newsList').innerHTML = '<div class="empty-state"><i class="fa-solid fa-newspaper"></i><p>还没有新闻</p></div>';
        return;
      }

      I.client.from('news_likes').select('news_id').eq('user_id', profile.id).then(function(likesRes) {
        var likedSet = new Set((likesRes.data || []).map(function(x){ return x.news_id; }));

        var html = '<div class="news-grid">';
        list.forEach(function (n) {
          var media = '';
          // 渲染媒体区域
          if (n.media_url && n.media_type === 'image') {
            media = '<div class="news-media"><img src="' + I.escapeHtml(n.media_url) + '" alt=""><div class="media-badge"><i class="fa-solid fa-image"></i> 图片</div></div>';
          } else if (n.media_url && n.media_type === 'video') {
            media = '<div class="news-media"><video src="' + I.escapeHtml(n.media_url) + '"></video><div class="media-badge"><i class="fa-solid fa-video"></i> 视频</div></div>';
          } else if (n.media_url && n.media_type === 'audio') {
            media = '<div class="news-media audio-media"><audio src="' + I.escapeHtml(n.media_url) + '" controls></audio><div class="media-badge"><i class="fa-solid fa-headphones"></i> 音频</div></div>';
          }

          var author = n.profiles || {};
          var avatar = author.flag_url || I.avatarFallback(author.username || '?');
          
          var isLiked = likedSet.has(n.id);
          var btnClass = isLiked ? 'news-pill-btn liked' : 'news-pill-btn';
          var heartClass = isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';

          html +=
            '<article class="news-card glass" onclick="location.href=\'news-detail.html?id=' + n.id + '\'">' +
              media +
              '<div class="news-body">' +
                '<h3>' + I.escapeHtml(n.title) + '</h3>' +
                '<p>' + I.escapeHtml(n.content) + '</p>' +
                
                // 底部操作栏
                '<div class="news-footer-bar">' +
                  '<div class="news-author" style="display:flex; align-items:center; gap:8px;">' +
                    '<img src="' + I.escapeHtml(avatar) + '" alt="" style="width:22px;height:22px;border-radius:50%;object-fit:cover;">' +
                    '<span style="color:var(--ink-2);font-size:12px;">' + I.escapeHtml(author.username || '未知') + '</span>' +
                  '</div>' +
                  
                  '<div class="news-action-group">' +
                    '<div class="' + btnClass + '" onclick="toggleLikeList(event, \'' + n.id + '\', this)">' +
                      '<i class="' + heartClass + '"></i> <span>' + (n.like_count || 0) + '</span>' +
                    '</div>' +
                    '<div class="news-pill-btn" onclick="event.stopPropagation(); location.href=\'news-detail.html?id=' + n.id + '\'">' +
                      '<i class="fa-regular fa-comment"></i> <span>' + (n.comment_count || 0) + '</span>' +
                    '</div>' +
                    '<div class="news-pill-btn" onclick="shareList(event, \'' + n.id + '\', this)">' +
                      '<i class="fa-solid fa-share-nodes"></i> <span>' + (n.share_count || 0) + '</span>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</article>';
        });
        html += '</div>';
        I.$('#newsList').innerHTML = html;
      });
    });
  }

  // 列表页点赞
  window.toggleLikeList = function(e, id, el) {
    e.stopPropagation();
    var icon = el.querySelector('i');
    var span = el.querySelector('span');
    var currentCount = parseInt(span.textContent) || 0;
    var isLiked = el.classList.contains('liked');

    if (isLiked) {
      I.client.from('news_likes').delete().eq('news_id', id).eq('user_id', profile.id).then(function() {
        el.classList.remove('liked');
        icon.classList.replace('fa-solid', 'fa-regular');
        span.textContent = Math.max(0, currentCount - 1);
      });
    } else {
      I.client.from('news_likes').insert({news_id: id, user_id: profile.id}).then(function() {
        el.classList.add('liked');
        icon.classList.replace('fa-regular', 'fa-solid');
        span.textContent = currentCount + 1;
      });
    }
  };

  // 列表页分享（防连点）
  window.shareList = function(e, id, el) {
    e.stopPropagation();
    if (el.style.pointerEvents === 'none') return; 
    
    var url = location.origin + location.pathname.replace('news.html', 'news-detail.html') + '?id=' + id;
    navigator.clipboard.writeText(url).then(function() {
      I.toast('链接已复制', 'success');
      var span = el.querySelector('span');
      span.textContent = (parseInt(span.textContent) || 0) + 1;
      I.client.rpc('increment_share_count', { n_id: id });
      
      el.style.opacity = '0.5';
      el.style.pointerEvents = 'none';
      setTimeout(function() {
        el.style.opacity = '1';
        el.style.pointerEvents = 'auto';
      }, 3000);
    });
  };

  I.$('#newsForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = I.$('#newsSubmit');
    var hint = I.$('#newsHint');
    var title = I.$('#nTitle').value.trim();
    var content = I.$('#nContent').value.trim();
    var mtype = I.$('#nMediaType').value;
    var file = I.$('#nMediaFile').files[0];

    if (!title) { hint.textContent = '请填写标题'; return; }
    if (!content) { hint.textContent = '请填写正文'; return; }
    if (mtype && !file) { hint.textContent = '请上传媒体文件'; return; }

    btn.disabled = true;
    hint.textContent = mtype ? '正在上传媒体…' : '正在发布…';

    function resetForm() {
      I.$('#newsForm').reset();
      I.$('#newsUploadBox').classList.remove('has-file');
      I.$('#newsFileName').textContent = '未选择文件';
      I.$('#publishModal').classList.remove('open');
    }

    function doInsert(mediaUrl) {
      return I.client.from('news').insert({
        author_id: profile.id, title: title, content: content,
        media_url: mediaUrl || null, media_type: mtype || null
      }).then(function (r) {
        btn.disabled = false;
        if (r.error) { hint.textContent = r.error.message; return; }
        I.toast('新闻已发布', 'success');
        resetForm();
        loadNews();
      });
    }

    if (mtype && file) {
      var ext = (file.name.split('.').pop() || 'bin').toLowerCase();
      var path = profile.id + '/' + Date.now() + '.' + ext;
      I.client.storage.from('media').upload(path, file, { upsert: true }).then(function (r) {
        if (r.error) { btn.disabled = false; hint.textContent = r.error.message; return; }
        var pub = I.client.storage.from('media').getPublicUrl(path);
        doInsert(pub.data.publicUrl);
      });
    } else {
      doInsert(null);
    }
  });
})();
</script>
</body>
</html>
