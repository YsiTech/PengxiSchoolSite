<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新闻发布 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .aurora-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at 15% 50%, rgba(79, 195, 247, 0.15), transparent 50%), radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.15), transparent 50%), radial-gradient(circle at 50% 80%, rgba(167, 139, 250, 0.1), transparent 50%); filter: blur(60px); animation: auroraMove 15s ease-in-out infinite alternate; }
  @keyframes auroraMove { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.2) translate(-5%, 5%); } }
  #news-particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

  .carousel-section { position: relative; padding: 40px 0; perspective: 1200px; overflow: hidden; }
  .carousel-container { position: relative; width: 100%; height: 380px; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; }
  .carousel-card { position: absolute; width: 480px; height: 300px; border-radius: 20px; overflow: hidden; background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.8); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
  .carousel-card.active { z-index: 10; transform: translateX(0) translateZ(0) rotateY(0deg); box-shadow: 0 0 40px rgba(212, 175, 55, 0.3), 0 30px 60px rgba(0,0,0,0.9); border-color: rgba(212, 175, 55, 0.5); }
  .carousel-card.prev { z-index: 5; transform: translateX(-45%) translateZ(-150px) rotateY(35deg); opacity: 0.6; }
  .carousel-card.next { z-index: 5; transform: translateX(45%) translateZ(-150px) rotateY(-35deg); opacity: 0.6; }
  .carousel-card.hidden { z-index: 1; transform: translateX(0) translateZ(-400px) rotateY(0deg); opacity: 0; pointer-events: none; }
  .cc-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cc-fallback { position: absolute; inset: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1e293b, #0f172a); display: grid; place-items: center; font-size: 80px; color: rgba(255,255,255,0.03); }
  .cc-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,14,26,0.95) 0%, rgba(10,14,26,0.4) 60%, transparent 100%); }
  .cc-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px; transform: translateZ(50px); }
  .cc-tag { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; background: var(--gold); color: #0a0e1a; margin-bottom: 12px; letter-spacing: 1px; }
  .cc-title { font-size: 22px; font-weight: 800; color: #fff; line-height: 1.3; margin-bottom: 12px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cc-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .carousel-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 20; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); color: #fff; display: grid; place-items: center; cursor: pointer; font-size: 20px; transition: 0.3s; }
  .carousel-nav:hover { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.5); }
  .carousel-nav.left { left: 8%; }
  .carousel-nav.right { right: 8%; }

  .timeline-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
  .news-card { background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
  .news-card:hover { transform: translateY(-4px); border-color: rgba(212,175,55,0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .nc-img { height: 160px; background: rgba(0,0,0,0.3); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .nc-img img { width: 100%; height: 100%; object-fit: cover; }
  .nc-fallback { font-size: 40px; color: rgba(255,255,255,0.05); }
  .nc-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
  .nc-title { font-size: 16px; color: #fff; font-weight: 700; margin: 0 0 8px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .nc-desc { font-size: 13px; color: var(--muted); line-height: 1.5; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nc-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
  .nc-author { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
  .nc-author img { width: 20px; height: 14px; border-radius: 2px; object-fit: cover; }
  .manage-btns { display: flex; gap: 6px; }
  .manage-btn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.05); color: var(--muted); border: none; cursor: pointer; transition: 0.2s; }
  .manage-btn.edit:hover { color: var(--gold); background: rgba(212,175,55,0.15); }
  .manage-btn.delete:hover { color: var(--red); background: rgba(239,68,68,0.15); }

  /* 🚨 全新上传控制台 */
  .upload-console { background: rgba(0,0,0,0.2); border: 1px solid var(--border-2); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .upload-section-title { font-size: 13px; font-weight: bold; color: var(--gold-2); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 8px; }
  .upload-btn-wrap { position: relative; display: inline-block; }
  .upload-btn-wrap input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  
  .media-preview-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .media-preview-item { position: relative; width: 90px; height: 90px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: #000; display: flex; align-items: center; justify-content: center; }
  .media-preview-item img, .media-preview-item video { width: 100%; height: 100%; object-fit: cover; }
  .media-preview-item i.icon { font-size: 30px; color: var(--muted); }
  
  .media-actions { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; opacity: 0; transition: 0.2s; }
  .media-preview-item:hover .media-actions { opacity: 1; }
  .media-btn { width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; font-size: 12px; }
  .btn-insert { background: var(--gold); color: #000; }
  .btn-del { background: var(--red); color: #fff; }

  .cover-upload-box { display: flex; align-items: center; gap: 16px; }
  .cover-preview { width: 120px; height: 68px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-2); background: rgba(0,0,0,0.5); display: grid; place-items: center; font-size: 24px; color: var(--muted); }

  select { background-color: rgba(0, 0, 0, 0.3) !important; color: var(--ink) !important; border: 1px solid var(--border-2) !important; border-radius: var(--r-sm); outline: none; cursor: pointer; padding: 12px 14px; }
  select:focus { border-color: var(--gold) !important; }
  select option { background-color: #111827 !important; color: #fff !important; }

  /* 📱 移动端深度优化 */
  @media (max-width: 768px) {
    .carousel-section { padding: 20px 0; height: auto; min-height: 280px; }
    .carousel-container { height: 250px; }
    .carousel-card { width: 90vw; height: 220px; }
    .carousel-card.prev, .carousel-card.next { opacity: 0; pointer-events: none; }
    .carousel-nav { width: 36px; height: 36px; font-size: 16px; top: 60%; }
    .carousel-nav.left { left: 4%; }
    .carousel-nav.right { right: 4%; }
    .cc-content { padding: 16px; transform: none; }
    .cc-title { font-size: 18px; }
    .cc-meta { font-size: 11px; gap: 8px; }
    .timeline-grid { grid-template-columns: 1fr; gap: 16px; margin-top: 20px; }
    .iecp-main { padding-left: 16px; padding-right: 16px; }
    
    .media-preview-grid { justify-content: center; }
    .media-preview-item { width: 70px; height: 70px; }
    .media-actions { opacity: 1; background: transparent; }
    .media-btn { width: 24px; height: 24px; font-size: 10px; }
    .btn-insert { position: absolute; top: 2px; right: 2px; }
    .btn-del { position: absolute; top: 2px; left: 2px; }
    .cover-upload-box { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="aurora-bg"></div>
<canvas id="news-particle-canvas"></canvas>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<section class="iecp-page-head" style="background:transparent; border-bottom:none; padding-top:30px;">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb"><a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>新闻发布</span></div>
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px">
      <div>
        <h1><i class="fa-solid fa-satellite-dish" style="color:var(--gold);"></i> 全球新闻矩阵</h1>
        <p>接入国际广播网络，倾听世界的声音</p>
      </div>
      <button class="btn btn-gold" id="openPublishBtn"><i class="fa-solid fa-pen-nib"></i> 发布新闻</button>
    </div>
  </div>
</section>

<main class="iecp-main">
  <div class="carousel-section" id="carouselSection" style="display:none;">
    <div class="carousel-container" id="carouselContainer"></div>
    <div class="carousel-nav left" onclick="slideCarousel(-1)"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="carousel-nav right" onclick="slideCarousel(1)"><i class="fa-solid fa-chevron-right"></i></div>
  </div>

  <div class="timeline-grid" id="newsList">
    <div class="loading-state" style="grid-column: 1/-1;"><div class="spinner"></div><span>正在建立卫星连接...</span></div>
  </div>
</main>

<!-- 发布弹窗 -->
<div class="iecp-modal" id="publishModal">
  <div class="iecp-modal-box glass-2" style="max-width:800px; width: 95%;">
    <h3 id="modalTitle"><i class="fa-solid fa-pen-nib" style="color:var(--gold)"></i> 发布新闻</h3>
    <form id="newsForm" style="margin-top:20px">
      <div class="field-group">
        <div class="field">
          <label>新闻标题 <span class="req">*</span></label>
          <input id="nTitle" type="text" placeholder="新闻标题" maxlength="100">
        </div>
        
        <!-- 🚨 全新媒体控制台 -->
        <div class="upload-console">
          <div class="upload-section-title">
            <span><i class="fa-solid fa-image"></i> 专属封面（不传则默认展示正文第一张图）</span>
          </div>
          <div class="cover-upload-box">
            <div class="upload-btn-wrap">
              <button type="button" class="btn btn-ghost btn-sm"><i class="fa-solid fa-upload"></i> 选择封面图</button>
              <input type="file" id="coverFile" accept="image/*">
            </div>
            <div class="cover-preview" id="coverPreview"><i class="fa-solid fa-image"></i></div>
          </div>
        </div>

        <div class="upload-console">
          <div class="upload-section-title">
            <span><i class="fa-solid fa-photo-film"></i> 附件媒体（支持插入正文指定位置）</span>
          </div>
          
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <div class="upload-btn-wrap">
              <button type="button" class="btn btn-ghost btn-sm"><i class="fa-solid fa-image"></i> 添加图片</button>
              <input type="file" id="imgFiles" accept="image/*" multiple>
            </div>
            <div class="upload-btn-wrap">
              <button type="button" class="btn btn-ghost btn-sm"><i class="fa-solid fa-video"></i> 添加视频</button>
              <input type="file" id="videoFiles" accept="video/*" multiple>
            </div>
            <div class="upload-btn-wrap">
              <button type="button" class="btn btn-ghost btn-sm"><i class="fa-solid fa-headphones"></i> 添加音频</button>
              <input type="file" id="audioFiles" accept="audio/*" multiple>
            </div>
          </div>

          <!-- 预览区 -->
          <div class="media-preview-grid" id="mediaPreviewGrid"></div>
        </div>

        <div class="field">
          <label>正文 <span class="req">*</span></label>
          <textarea id="nContent" placeholder="新闻正文内容...（在光标处点击上方媒体的'插入'按钮，即可嵌入对应媒体）" style="min-height:150px; line-height: 1.8;"></textarea>
        </div>
      </div>
      
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">
        <span id="newsHint" style="font-size:13px;color:var(--red);margin-right:auto;align-self:center;font-weight:bold;"></span>
        <button type="button" class="btn btn-ghost" onclick="closePublishModal()">取消</button>
        <button class="btn btn-gold" type="submit" id="newsSubmit"><i class="fa-solid fa-paper-plane"></i> 确认发布</button>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function initParticles() {
  const canvas = document.getElementById('news-particle-canvas'); const ctx = canvas.getContext('2d');
  let width, height; let particles = [];
  function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  class Particle {
    constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4; this.radius = Math.random() * 1.5 + 0.5; }
    update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
    draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(212, 175, 55, 0.3)'; ctx.fill(); }
  }
  for (let i = 0; i < 80; i++) particles.push(new Particle());
  function animate() { ctx.clearRect(0, 0, width, height); for (let i = 0; i < particles.length; i++) { particles[i].update(); particles[i].draw(); for (let j = i + 1; j < particles.length; j++) { const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y; const dist = Math.sqrt(dx * dx + dy * dy); if (dist < 120) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(212, 175, 55, ${0.1 - dist / 1200})`; ctx.stroke(); } } } requestAnimationFrame(animate); }
  animate();
})();

(function () {
  var I = IECP;
  var profile = null;
  var editMode = false;
  var currentEditId = null;
  var carouselData = [];
  var currentIndex = 0;

  // 🚨 全局媒体队列
  var coverFile = null;
  var mediaQueue = []; // { file: File, type: 'image'|'video'|'audio', objUrl: string, id: string }

  function getValidCover(n) {
    var cover = n.cover_url;
    if (!cover && n.media_list && Array.isArray(n.media_list)) {
      var imgItem = n.media_list.find(m => m.type === 'image');
      if (imgItem) cover = imgItem.url;
    }
    if (!cover && n.media_url && n.media_type === 'image') {
      cover = n.media_url;
    }
    if (cover && typeof cover === 'string' && cover.startsWith('http')) {
      return cover;
    }
    return null;
  }

  window.openPublishModal = function() {
    editMode = false; currentEditId = null;
    I.$('#modalTitle').innerHTML = '<i class="fa-solid fa-pen-nib" style="color:var(--gold)"></i> 发布新闻';
    I.$('#newsForm').reset();
    coverFile = null;
    I.$('#coverPreview').innerHTML = '<i class="fa-solid fa-image"></i>';
    mediaQueue = [];
    renderMediaPreview();
    I.$('#publishModal').classList.add('open');
  };

  window.closePublishModal = function() {
    I.$('#publishModal').classList.remove('open');
  };

  // 封面选择
  I.$('#coverFile').addEventListener('change', function() {
    var file = this.files[0];
    if (!file) return;
    coverFile = file;
    var reader = new FileReader();
    reader.onload = function(e) {
      I.$('#coverPreview').innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">`;
    };
    reader.readAsDataURL(file);
  });

  // 附件媒体选择
  function handleMediaSelect(inputId, type) {
    I.$('#' + inputId).addEventListener('change', function() {
      var files = Array.from(this.files);
      files.forEach(file => {
        var id = 'media_' + Date.now() + '_' + Math.floor(Math.random()*1000);
        var objUrl = URL.createObjectURL(file);
        mediaQueue.push({ file: file, type: type, objUrl: objUrl, id: id });
      });
      this.value = ''; // 清空 input 允许重复选择同一文件
      renderMediaPreview();
    });
  }
  handleMediaSelect('imgFiles', 'image');
  handleMediaSelect('videoFiles', 'video');
  handleMediaSelect('audioFiles', 'audio');

  // 渲染媒体预览控制台
  function renderMediaPreview() {
    var grid = I.$('#mediaPreviewGrid');
    grid.innerHTML = '';
    if (mediaQueue.length === 0) {
      grid.innerHTML = '<div style="color:var(--muted); font-size:12px; width:100%; text-align:center; padding:10px;">暂无附件</div>';
      return;
    }
    
    mediaQueue.forEach((item, index) => {
      var div = document.createElement('div');
      div.className = 'media-preview-item';
      
      var mediaHtml = '';
      if (item.type === 'image') mediaHtml = `<img src="${item.objUrl}">`;
      else if (item.type === 'video') mediaHtml = `<video src="${item.objUrl}"></video>`;
      else mediaHtml = `<i class="fa-solid fa-music icon" style="color:var(--cyan);"></i>`;

      div.innerHTML = `
        ${mediaHtml}
        <div class="media-actions">
          <button type="button" class="media-btn btn-insert" title="插入正文" onclick="insertMediaToText('${item.id}')"><i class="fa-solid fa-arrow-down"></i></button>
          <button type="button" class="media-btn btn-del" title="删除" onclick="removeMediaFromQueue('${item.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
      grid.appendChild(div);
    });
  }

  // 插入正文逻辑
  window.insertMediaToText = function(id) {
    var item = mediaQueue.find(x => x.id === id);
    if (!item) return;
    
    var typeName = item.type === 'image' ? '图片' : item.type === 'video' ? '视频' : '音频';
    var placeholder = `\n[${typeName}: ${item.id}]\n`;
    
    var textarea = I.$('#nContent');
    var startPos = textarea.selectionStart;
    var endPos = textarea.selectionEnd;
    var text = textarea.value;
    
    textarea.value = text.substring(0, startPos) + placeholder + text.substring(endPos, text.length);
    
    // 恢复光标位置
    textarea.selectionStart = textarea.selectionEnd = startPos + placeholder.length;
    textarea.focus();
  };

  // 从队列删除
  window.removeMediaFromQueue = function(id) {
    mediaQueue = mediaQueue.filter(x => x.id !== id);
    renderMediaPreview();
  };

  function loadNews() {
    I.client.from('news').select('*, profiles(id, username, flag_url)').order('created_at', { ascending: false }).limit(50).then(function (res) {
      var list = res.data || [];
      
      if (!list.length) {
        I.$('#newsList').innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-satellite"></i><p>还没有新闻，快来抢首发吧</p></div>';
        return;
      }

      carouselData = list.slice(0, 5);
      currentIndex = 0;
      window.renderCarousel();

      var html = '';
      list.forEach(function (n) {
        var cover = getValidCover(n);
        var media = '';
        
        if (cover) {
          media = `<div class="nc-img"><img src="${cover}" alt=""></div>`;
        } else {
          media = `<div class="nc-img"><i class="fa-solid fa-newspaper nc-fallback"></i></div>`;
        }

        var author = n.profiles || {};
        var avatar = author.flag_url || I.avatarFallback(author.username || '?');
        var isAuthor = (author.id === profile.id);

        var manageBtns = isAuthor ? `
          <div class="manage-btns">
            <button class="manage-btn edit" title="编辑新闻" onclick="editNews(event, '${n.id}')"><i class="fa-solid fa-pen"></i></button>
            <button class="manage-btn delete" title="删除新闻" onclick="deleteNews(event, '${n.id}')"><i class="fa-solid fa-trash"></i></button>
          </div>
        ` : '';

        html += `
          <article class="news-card" onclick="location.href='news-detail.html?id=${n.id}'">
            ${media}
            <div class="nc-body">
              <h3 class="nc-title">${I.escapeHtml(n.title)}</h3>
              <p class="nc-desc">${I.escapeHtml(n.content.replace(/\[.*?\]/g, ''))}</p>
              <div class="nc-footer">
                <div class="nc-author">
                  <img src="${I.escapeHtml(avatar)}">
                  <span>${I.escapeHtml(author.username || '未知')}</span>
                </div>
                ${manageBtns}
              </div>
            </div>
          </article>
        `;
      });
      I.$('#newsList').innerHTML = html;
    });
  }

  window.renderCarousel = function() {
    var container = I.$('#carouselContainer');
    I.$('#carouselSection').style.display = 'block';
    var html = '';
    carouselData.forEach(function(n, idx) {
      var diff = idx - currentIndex;
      var stateClass = '';
      if (diff === 0) stateClass = 'active';
      else if (diff === -1 || diff === carouselData.length - 1) stateClass = 'prev';
      else if (diff === 1 || diff === -(carouselData.length - 1)) stateClass = 'next';
      else stateClass = 'hidden';

      var cover = getValidCover(n);
      var bgImg = cover 
        ? `<img src="${cover}" class="cc-img">` 
        : `<div class="cc-fallback"><i class="fa-solid fa-satellite-dish"></i></div>`;
        
      var author = n.profiles || {};
      html += `
        <div class="carousel-card ${stateClass}" onclick="if('${stateClass}'==='active') location.href='news-detail.html?id=${n.id}'; else setCarouselIndex(${idx})">
          ${bgImg}
          <div class="cc-overlay"></div>
          <div class="cc-content">
            <span class="cc-tag">最新快讯</span>
            <h2 class="cc-title">${I.escapeHtml(n.title)}</h2>
            <div class="cc-meta">
              <span><i class="fa-solid fa-user"></i> ${I.escapeHtml(author.username || '未知')}</span>
              <span><i class="fa-regular fa-clock"></i> ${I.relativeTime(n.created_at)}</span>
            </div>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  };

  window.slideCarousel = function(dir) {
    currentIndex += dir;
    if (currentIndex < 0) currentIndex = carouselData.length - 1;
    if (currentIndex >= carouselData.length) currentIndex = 0;
    window.renderCarousel();
  };

  window.setCarouselIndex = function(idx) {
    currentIndex = idx;
    window.renderCarousel();
  };

  window.editNews = function(e, id) {
    e.stopPropagation();
    I.client.from('news').select('*').eq('id', id).maybeSingle().then(function(res) {
      if (res.error || !res.data) return I.toast('获取失败', 'error');
      var n = res.data;
      
      editMode = true; currentEditId = id;
      coverFile = null;
      I.$('#coverPreview').innerHTML = '<i class="fa-solid fa-image"></i>';
      mediaQueue = [];
      renderMediaPreview();
      
      I.$('#modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square" style="color:var(--gold)"></i> 编辑新闻';
      I.$('#nTitle').value = n.title;
      I.$('#nContent').value = n.content || '';
      
      I.$('#publishModal').classList.add('open');
    });
  };

  window.deleteNews = function(e, id) {
    e.stopPropagation();
    if (!confirm('⚠️ 确定要彻底删除这条新闻吗？')) return;
    I.toast('正在删除...', 'success', 1000);
    I.client.from('news').delete().eq('id', id).then(function(res) {
      if (res.error) return I.toast('删除失败', 'error');
      I.toast('新闻已删除', 'success');
      loadNews();
    });
  };

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('news');
    I.$('#openPublishBtn').addEventListener('click', window.openPublishModal);
    I.getProfile(true).then(function (p) {
      profile = p;
      loadNews();
    });
  });

  I.$('#newsForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = I.$('#newsSubmit'); var hint = I.$('#newsHint');
    var title = I.$('#nTitle').value.trim(); var content = I.$('#nContent').value.trim();

    if (!title) return hint.textContent = '请填写标题';
    if (!content) return hint.textContent = '请填写正文';

    btn.disabled = true; hint.textContent = '正在处理媒体文件...';

    function resetForm() {
      I.$('#newsForm').reset(); I.$('#publishModal').classList.remove('open');
    }

    try {
      var coverUrl = null;
      var mediaList = [];
      var idMap = {}; // id -> 最终URL

      // 1. 上传封面
      if (coverFile) {
        var cExt = (coverFile.name.split('.').pop() || 'png').toLowerCase();
        var cPath = profile.id + '/cover_' + Date.now() + '.' + cExt;
        var cRes = await I.client.storage.from('media').upload(cPath, coverFile);
        if (!cRes.error) coverUrl = I.client.storage.from('media').getPublicUrl(cPath).data.publicUrl;
      }

      // 2. 上传媒体
      if (mediaQueue.length > 0) {
        var uploadPromises = mediaQueue.map(async (item, index) => {
          var ext = (item.file.name.split('.').pop() || 'bin').toLowerCase();
          var path = profile.id + '/' + Date.now() + '_' + index + '.' + ext;
          var { error } = await I.client.storage.from('media').upload(path, item.file);
          if (error) throw error;
          
          var url = I.client.storage.from('media').getPublicUrl(path).data.publicUrl;
          mediaList.push({ id: item.id, type: item.type, url: url });
          idMap[item.id] = url;
        });
        await Promise.all(uploadPromises);
      }

      hint.textContent = '正在发布...';

      if (editMode) {
        var updateData = { title: title, content: content };
        // 编辑时如果传了新封面或新图，则覆盖
        if (coverUrl) updateData.cover_url = coverUrl;
        if (mediaList.length > 0) updateData.media_list = mediaList;
        
        await I.client.from('news').update(updateData).eq('id', currentEditId);
        I.toast('新闻已更新', 'success');
      } else {
        await I.client.from('news').insert({
          author_id: profile.id, title: title, content: content,
          cover_url: coverUrl, media_list: mediaList
        });
        I.toast('新闻已发布', 'success');
      }
      
      btn.disabled = false; 
      resetForm(); 
      loadNews();

    } catch (err) {
      btn.disabled = false;
      hint.textContent = err.message || '上传失败';
    }
  });
})();
</script>
</body>
</html>
