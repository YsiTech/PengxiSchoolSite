<style>
  .war-map-container { position: relative; width: 100%; height: 480px; background: radial-gradient(circle at center, #0f172a 0%, #05070a 100%); border: 1px solid rgba(79, 195, 247, 0.3); border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 50px rgba(79, 195, 247, 0.1), 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 24px; }
  #warMap { width: 100%; height: 100%; z-index: 2; position: relative; touch-action: pan-y pinch-zoom; }
  .radar-sweep { position: absolute; top: 50%; left: 50%; width: 200%; height: 200%; margin-left: -100%; margin-top: -100%; background: conic-gradient(from 0deg, transparent 0%, transparent 70%, rgba(79, 195, 247, 0.15) 90%, rgba(79, 195, 247, 0.4) 100%); border-radius: 50%; animation: rotate 8s linear infinite; pointer-events: none; z-index: 1; opacity: 0.5; }
  @keyframes rotate { 100% { transform: rotate(360deg); } }
  .intel-terminal { position: absolute; top: 15px; left: 15px; width: 340px; background: rgba(10, 14, 26, 0.85); backdrop-filter: blur(12px); border-left: 3px solid var(--red); border-radius: 8px; padding: 12px; z-index: 10; font-family: var(--mono); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
  .intel-title { color: var(--red); font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(239,68,68,0.3); padding-bottom: 6px; font-size: 13px;}
  .intel-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
  .intel-list::-webkit-scrollbar { display: none; }
  .intel-item { color: var(--ink-2); font-size: 12px; line-height: 1.4; white-space: normal; word-break: break-all; border-bottom: 1px dashed rgba(255,255,255,0.05); padding-bottom: 6px; }
  .intel-item:last-child { border-bottom: none; }
  .intel-item .win { color: #22c55e; font-weight: bold;} 
  .intel-item .lose { color: #ef4444; font-weight: bold;}
  .map-legend { position: absolute; bottom: 15px; right: 15px; background: rgba(10, 14, 26, 0.85); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 10; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 8px; color: #ddd; }
  .legend-color { width: 14px; height: 14px; border-radius: 3px; }
  .tactical-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; place-items: center; z-index: 9999; }
  .tactical-modal.open { display: grid; }
  .tactical-box { width: 700px; max-width: 90%; background: rgba(15, 23, 42, 0.95); border: 1px solid var(--cyan); border-radius: 12px; padding: 30px; box-shadow: 0 0 50px rgba(79,195,247,0.2); position: relative; }
  .tactical-box h2 { margin: 0 0 10px; color: var(--cyan); font-family: var(--mono); font-size: 20px;}
  .tactical-box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .tactic-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .tactic-card { border: 1px solid var(--border); background: rgba(0,0,0,0.3); border-radius: 8px; padding: 20px 10px; cursor: pointer; transition: 0.2s; text-align: center; }
  .tactic-card:hover { border-color: var(--cyan); background: rgba(79,195,247,0.1); transform: translateY(-4px); }
  .tactic-card.raid:hover { border-color: var(--gold); }
  .tactic-card.bomb:hover { border-color: var(--red); }
  .tactic-card i { font-size: 30px; margin-bottom: 12px; }
  .tactic-card.raid i { color: var(--gold); }
  .tactic-card.conquer i { color: var(--cyan); }
  .tactic-card.bomb i { color: var(--red); }
  .tactic-card h3 { margin: 0 0 8px; color: #fff; font-size: 15px; }
  .tactic-card span { font-size: 12px; color: var(--muted); line-height: 1.5; display: block; }
  .war-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-top: 24px; }
  .enemy-card { background: var(--glass-2); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .enemy-header { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .enemy-avatar { width: 48px; height: 32px; border-radius: 4px; object-fit: cover; border: 1px solid #ef4444; }
  .btn-attack-main { width: 100%; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .peace-actions { display: flex; gap: 10px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 16px; margin-top: auto; }
  .peace-actions .btn { flex: 1; padding: 10px 0; font-size: 13px; border-radius: 6px; }
  .btn-surrender { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
  .btn-negotiate { background: rgba(79,195,247,0.1); color: var(--cyan); border: 1px solid rgba(79,195,247,0.3); }
  .peace-request-box { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .btn-accept-peace { flex-shrink: 0; padding: 6px 16px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; border: none; background: #22c55e; color: #fff; }
  .troop-select-row { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); }
  .troop-info { display: flex; align-items: center; gap: 12px; }
  .troop-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(0,0,0,0.3); display: grid; place-items: center; color: var(--gold); overflow: hidden; flex-shrink: 0;}
  .troop-icon img { width: 100%; height: 100%; object-fit: cover; }
  .troop-input { width: 80px; padding: 8px; text-align: center; border-radius: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-2); color: #fff; font-weight: bold; }
  @media (max-width: 768px) {
    .war-map-container { height: 380px; }
    .intel-terminal { width: calc(100% - 30px); top: 10px; left: 15px; max-height: 130px; }
    .map-legend { bottom: 10px; right: 10px; padding: 6px; font-size: 11px; }
    .tactical-box { padding: 20px; max-height: 85vh; overflow-y: auto; }
    .tactic-options { grid-template-columns: 1fr; gap: 12px; } 
    .tactic-card { display: flex; align-items: center; text-align: left; padding: 12px; gap: 15px; }
    .tactic-card i { font-size: 24px; margin-bottom: 0; }
    .tactic-card h3 { font-size: 15px; margin-bottom: 2px; }
    .tactic-card span { font-size: 11px; }
  }
</style>
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<section class="iecp-page-head">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb"><a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>战争系统</span></div>
    <div><h1><i class="fa-solid fa-satellite-dish"></i> 全球战术指挥中心</h1><p>点击地图领土，锁定目标并制定战术。</p></div>
  </div>
</section>

<main class="iecp-main">
  <div class="war-map-container">
    <div class="radar-sweep"></div>
    <div class="intel-terminal">
      <div class="intel-title"><span>GLOBAL INTEL</span><i class="fa-solid fa-circle fa-fade" style="color:var(--red); font-size:8px; line-height:16px;"></i></div>
      <div class="intel-list" id="intelList">
        <div class="intel-item" style="color:var(--cyan);">[系统] 正在接入全球战术网络...</div>
      </div>
    </div>
    <div id="warMap"></div>
    <div class="map-legend">
      <div class="legend-item"><div class="legend-color" style="background:rgba(212,175,55,0.85)"></div> 我国领土</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(34,197,94,0.85)"></div> 盟友领地</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(79,195,247,0.85)"></div> 建交领地</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(239,68,68,0.85)"></div> 交战国</div>
      <div class="legend-item"><div class="legend-color" style="background:#334155"></div> 中立 / 无主</div>
    </div>
  </div>

  <h3 style="color:#fff; margin-bottom:12px;"><i class="fa-solid fa-list-ul" style="color:var(--red);"></i> 交战国家列表</h3>
  <div id="warListWrap"><div class="loading-state"><div class="spinner"></div><span>正在侦察敌情...</span></div></div>
</main>

<div class="tactical-modal" id="tacticalModal">
  <div class="tactical-box">
    <h2><i class="fa-solid fa-crosshairs"></i> 目标锁定：<span id="lockName" style="color:#fff;"></span></h2>
    <p>请选择本次军事行动。不同行动消耗的兵种不同。</p>
    <div class="tactic-options">
      <div class="tactic-card raid" onclick="selectTactic('raid')"><i class="fa-solid fa-hand-holding-dollar"></i><div><h3>闪电掠夺</h3><span>抢掠资金。战力越高抢得越多。</span></div></div>
      <div class="tactic-card conquer" onclick="selectTactic('conquer')"><i class="fa-solid fa-flag"></i><div><h3>全面征服</h3><span>击败守军并占领该地块。</span></div></div>
      <div class="tactic-card bomb" onclick="selectTactic('bomb')"><i class="fa-solid fa-bomb"></i><div><h3>战略轰炸</h3><span>仅限空军。毁坏资源。</span></div></div>
    </div>
    <div style="text-align:right; margin-top:24px;"><button class="btn btn-ghost" onclick="document.getElementById('tacticalModal').classList.remove('open')">取消锁定</button></div>
  </div>
</div>

<div class="iecp-modal" id="attackModal">
  <div class="iecp-modal-box glass-2" style="max-width:500px">
    <h3 id="attackTitle"><i class="fa-solid fa-bomb" style="color:var(--red)"></i> 作战部署</h3>
    <p class="modal-sub" id="attackDesc">选择要派出的兵力。</p>
    <div id="troopList" style="max-height: 45vh; overflow-y: auto; margin-bottom: 10px;"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(212,175,55,0.1); padding:12px 16px; border-radius:8px; border:1px solid rgba(212,175,55,0.3); margin-top: 15px; margin-bottom:20px;">
      <span style="font-size:14px; color:var(--gold-2);"><i class="fa-solid fa-bolt"></i> 我方出战总战力</span>
      <b id="attackPowerDisplay" style="font-size:22px; font-family:var(--mono); color:#fff;">0</b>
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="document.getElementById('attackModal').classList.remove('open')">取消</button>
      <button class="btn btn-red" id="confirmAttackBtn"><i class="fa-solid fa-crosshairs"></i> 执行作战</button>
    </div>
  </div>
</div>

  function initMap() {

          var relText = '';

          else if (rel === 'ally') relText = '<br/><span style="color:#22c55e;font-weight:bold;">[ 盟友 ]</span>';
          else if (rel === 'diplomatic') relText = '<br/><span style="color:#4fc3f7;font-weight:bold;">[ 已建交 ]</span>';
          else if (rel === 'war') relText = '<br/><span style="color:#ef4444;font-weight:bold;">[ 交战中 ]</span>';

        map: 'world', roam: true, zoom: 1.2, scaleLimit: { min: 0.8, max: 8 },

    myChart.on('click', function (params) {
      if (!params.name) return;
      var region = params.name; var geoName = getGeoName(region); var record = allTerritories.find(t => t.region_code === region);
      
      if (!record) {
        var myLands = allTerritories.filter(t => t.owner_id === profile.id);

        var costText = myLands.length === 0 ? '首块领土免费！' : '这是你的第二块领土，需支付 20,000 ₽。';
        if (!confirm(`是否认领【${geoName}】？\n\n提示：${costText}`)) return;
        I.toast('正在签署领土协议...', 'success', 1000);
        I.client.rpc('claim_territory', { p_user_id: profile.id, p_region_code: region, p_region_name: geoName }).then(function(res){
          if(res.error) return I.toast(res.error.message, 'error'); if(!res.data.ok) return I.toast(res.data.msg, 'error');
          I.toast(res.data.msg, 'success'); loadData();
        });
      } else if (record.owner_id === profile.id) {
        I.toast(`【${geoName}】是你国的领土。`, 'success');
      } else if (allEnemiesIds.includes(record.owner_id.toLowerCase())) {
        var enemyObj = enemies.find(e => e.id.toLowerCase() === record.owner_id.toLowerCase());
        currentTarget = { id: record.owner_id, region: region, name: enemyObj ? enemyObj.username : '敌国', mode: null };

        document.getElementById('tacticalModal').classList.add('open');

          if(r.error) return I.toast('发送失败：' + r.error.message, 'error'); I.toast('购买请求已发送！', 'success');

  function connectWebSocket() {
    try {
      ws = new WebSocket('wss://iecp-api.ponxigrad.tech/ws/'); 
      ws.onmessage = function(event) {
        try {
          var data = JSON.parse(event.data);
          var msg = data.msg || data.message || data.content || (typeof data === 'string' ? data : null);
          if (msg && typeof msg === 'string') {
            showBroadcast(msg);
          }
        } catch (e) {
          if (event.data && typeof event.data === 'string' && event.data.length < 200) {
            showBroadcast(event.data);
          }
        }
      };
    } catch (err) {}
  }

  // 🚨 核心修改：广播直接推送至 GLOBAL INTEL 终端
  function showBroadcast(msg) {
    var list = I.$('#intelList');
    if (!list) return;
    
    // 移除“全球区域暂时和平”的占位符
    if (list.children.length === 1 && list.children[0].innerText.includes('正在接入') || list.children.length === 1 && list.children[0].innerText.includes('全球区域暂时和平')) {
      list.innerHTML = '';
    }

    var timeStr = new Date().toLocaleTimeString('en-US', { hour12: false });
    var newItem = document.createElement('div');
    newItem.className = 'intel-item';
    
    // 如果是战报，高亮显示
    var isWar = msg.includes('【') || msg.includes('战') || msg.includes('攻');
    var color = isWar ? '#ef4444' : '#4fc3f7';
    
    // 带点动画效果
    newItem.style.opacity = '0';
    newItem.style.transition = 'opacity 0.5s ease-in';
    newItem.innerHTML = `<span style="color:${color};">[${timeStr}]</span> ${I.escapeHtml(msg)}`;
    
    list.insertBefore(newItem, list.firstChild);
    setTimeout(() => { newItem.style.opacity = '1'; }, 10);

    // 终端里最多保留 12 条消息，防止越堆越多
    if (list.children.length > 12) {
      list.removeChild(list.lastChild);
    }
  }

  function loadData() {
    Promise.all([
      I.client.from('military').select('*').eq('country_id', profile.id).maybeSingle(),
      I.client.from('relations').select('*'),
      I.client.from('diplomacy_requests').select('*').eq('to_country', profile.id).eq('request_type', 'peace').eq('status', 'pending'),
      I.client.from('territories').select('*'),
      I.client.from('profiles').select('id, username, flag_url'),
      I.client.from('custom_units').select('*')
    ]).then(function(results) {
      myMil = results[0].data || {};
      var allRelations = results[1].data || [];
      peaceRequests = results[2].data || [];
      allTerritories = results[3].data || [];
      var profiles = results[4].data || [];
      myCustomUnits = {}; (results[5].data || []).forEach(u => { myCustomUnits[u.id] = u; });

      var myId = profile.id.toLowerCase();
      allEnemiesIds = []; allAlliesIds = []; allDiplomaticIds = []; var myWars = [];
      
      allRelations.forEach(function(r) {
        var ca = (r.country_a || '').toLowerCase();
        var cb = (r.country_b || '').toLowerCase();
        var otherId = (ca === myId) ? cb : ca;
        
        if (ca === myId || cb === myId) {
          if (r.relation_type === 'war') { allEnemiesIds.push(otherId); myWars.push(r); }
          else if (r.relation_type === 'ally') { allAlliesIds.push(otherId); }
          else if (r.relation_type === 'diplomatic') { allDiplomaticIds.push(otherId); }
        }
      });

      var regionsConfig = [];
      allTerritories.forEach(function(t) {
        if (!t.owner_id) return;
        var tid = t.owner_id.toLowerCase();
        var color = '#334155'; var relType = 'neutral';
        
        if (tid === myId) { color = 'rgba(212, 175, 55, 0.85)'; relType = 'self'; }
        else if (allEnemiesIds.includes(tid)) { color = 'rgba(239, 68, 68, 0.85)'; relType = 'war'; }
        else if (allAlliesIds.includes(tid)) { color = 'rgba(34, 197, 94, 0.85)'; relType = 'ally'; }
        else if (allDiplomaticIds.includes(tid)) { color = 'rgba(79, 195, 247, 0.85)'; relType = 'diplomatic'; }

        var ownerObj = profiles.find(p => p.id.toLowerCase() === tid);
        var ownerName = ownerObj ? ownerObj.username : '未知';

        regionsConfig.push({
          name: t.region_code, itemStyle: { normal: { areaColor: color }, emphasis: { areaColor: color } },
          label: { normal: { show: true, formatter: ownerName, color: '#fff', fontSize: 10, fontWeight: 'bold', textShadowColor: '#000', textShadowBlur: 3 } },
          customData: { ownerName: ownerName, ownerId: t.owner_id, relation: relType }
        });
      });
      if(myChart) myChart.setOption({ geo: { regions: regionsConfig } });

      if (myWars.length === 0) { I.$('#warListWrap').innerHTML = `<div class="empty-state glass"><i class="fa-solid fa-dove" style="color:var(--cyan);font-size:40px;margin-bottom:12px;"></i><p>目前世界和平，没有敌对国家。</p></div>`; return; }
      I.client.from('profiles').select('id, username, flag_url').in('id', allEnemiesIds).then(function(res) { enemies = res.data || []; renderEnemies(); });
    });
  }

  function renderEnemies() {
    var html = '<div class="war-grid">';
    enemies.forEach(function(e) {
      var avatar = e.flag_url || I.avatarFallback(e.username);
      var pReq = peaceRequests.find(r => r.from_country.toLowerCase() === e.id.toLowerCase());
      var peaceRequestHtml = '';
      if (pReq) { peaceRequestHtml = `<div class="peace-request-box"><span><i class="fa-solid fa-handshake"></i> 对方申请停战</span><button class="btn-accept-peace" onclick="acceptPeace('${pReq.id}')">同意</button></div>`; }

      html += `
        <div class="enemy-card">
          ${peaceRequestHtml}
          <div class="enemy-header"><img src="${I.escapeHtml(avatar)}" class="enemy-avatar"><div><div style="font-size:16px;font-weight:700;color:#fff;">${I.escapeHtml(e.username)}</div><div style="font-size:12px;color:#ef4444;"><i class="fa-solid fa-crosshairs"></i> 交战中</div></div></div>
          <div style="background: rgba(0,0,0,0.2); padding: 16px; border-radius: 8px; text-align: center;"><button class="btn-attack-main" onclick="openAttackModal('${e.id}', '${I.escapeHtml(e.username)}', null, 'raid')"><i class="fa-solid fa-bomb"></i> 发动突袭</button></div>

  function loadIntelLogs() {
    I.client.from('war_logs').select('*').order('created_at', { ascending: false }).limit(5).then(function(res){
      var logs = res.data || []; var html = '';
      logs.forEach(function(l) {
        var resColor = l.result === 'win' ? 'win' : 'lose'; var aName = l.attacker_name || '某国'; var dName = l.defender_name || '某国'; var rName = getGeoName(l.region_name) || '边境地带';
        var actionName = l.mode === 'bomb' ? '战略轰炸' : (l.mode === 'raid' ? '闪电掠夺' : '全面入侵');
        var resultText = l.result === 'win' ? `成功实施了${actionName}` : `企图实施${actionName}但被击退`;
        var detailText = l.details ? `<br/><span style="color:var(--muted-2);">${l.details}</span>` : '';
        html += `<div class="intel-item">[战报] <span class="${resColor}">${aName}</span> 在 ${rName} 对 ${dName} ${resultText}。${detailText}</div>`;
      });
      if(!html) html = '<div class="intel-item" style="color:var(--cyan);">[系统] 全球区域暂时和平。</div>';
      
      // 只在刚加载时覆盖，避免把刚推送的广播覆盖掉
      var list = document.getElementById('intelList');
      if (list && list.innerText.includes('正在接入全球战术网络')) {
        list.innerHTML = html;
      }
    });
  }

  window.openAttackModal = function(defenderId, defenderName, regionCode, mode) {
    currentTarget = { id: defenderId, name: defenderName, region: regionCode, mode: mode };
    var modeName = mode === 'raid' ? '闪电掠夺' : (mode === 'conquer' ? '全面征服' : '战略轰炸');
    I.$('#attackDesc').innerHTML = `向 <b style="color:var(--red)">${I.escapeHtml(defenderName)}</b> 执行【${modeName}】。`;
    
    var listHtml = ''; var hasTroop = false;

    for (var key in UNITS_DICT) {
      var count = myMil[key] || 0; var u = UNITS_DICT[key];
      if (count <= 0) continue;
      if (mode === 'bomb' && u.type !== 'air') continue;

      hasTroop = true;
      listHtml += `
        <div class="troop-select-row">
          <div class="troop-info">
            <div class="troop-icon"><i class="fa-solid ${u.icon}"></i></div>
            <div><div class="troop-name">${u.name} <span style="font-size:11px;color:var(--gold-2);">(战力${u.power})</span></div><div class="troop-have">可用: ${I.fmtNumber(count)}</div></div>
          </div>
          <input type="number" class="troop-input" id="atk_${key}" value="0" min="0" max="${count}" data-power="${u.power}" oninput="calcPower()">
        </div>
      `;
    }

    var customInv = myMil.custom_troops || {};
    for (var id in customInv) {
      if (customInv[id] <= 0) continue;
      var cu = myCustomUnits[id]; if (!cu) continue;
      if (cu.category.indexOf('defense') !== -1) continue;
      if (mode === 'bomb' && cu.category !== 'air') continue;

      hasTroop = true;
      var iconHtml = cu.image_url ? `<img src="${cu.image_url}" style="width:100%;height:100%;object-fit:cover;">` : `<i class="fa-solid fa-robot"></i>`;
      listHtml += `
        <div class="troop-select-row">
          <div class="troop-info">
            <div class="troop-icon">${iconHtml}</div>
            <div><div class="troop-name">${I.escapeHtml(cu.name)} <span style="font-size:11px;color:var(--gold-2);">(战力${cu.power})</span></div><div class="troop-have">可用: ${I.fmtNumber(customInv[id])}</div></div>
          </div>
          <input type="number" class="troop-input" id="atk_${id}" value="0" min="0" max="${customInv[id]}" data-power="${cu.power}" oninput="calcPower()">
        </div>
      `;
    }

    if (!hasTroop) return I.toast('你没有可派出的部队！', 'error');
    I.$('#troopList').innerHTML = `<div style="text-align:right; margin-bottom:10px;"><a href="javascript:void(0)" onclick="fillAllTroops()" style="font-size:12px; color:var(--cyan);">一键全军出击</a></div>` + listHtml;
    I.$('#attackPowerDisplay').textContent = '0';
    I.$('#confirmAttackBtn').onclick = doAttack;
    I.$('#attackModal').classList.add('open');
  };

  window.fillAllTroops = function() {
    document.querySelectorAll('.troop-input').forEach(function(input) {
      if (parseInt(input.max) > 0) { input.value = input.max; }
    });
    calcPower();
  };

  window.calcPower = function() {
    var totalPower = 0;
    document.querySelectorAll('.troop-input').forEach(function(input) {
      var val = parseInt(input.value) || 0; var power = parseInt(input.getAttribute('data-power')) || 0;
      totalPower += val * power;
    });
    I.$('#attackPowerDisplay').textContent = I.fmtNumber(totalPower);
  };

  function doAttack() {
    var troopsPayload = {}; var hasTroop = false;
    document.querySelectorAll('.troop-input').forEach(function(input) {
      var val = parseInt(input.value) || 0;
      if (val > 0) { var key = input.id.replace('atk_', ''); troopsPayload[key] = val; hasTroop = true; }
    });

    if (!hasTroop) return I.toast('请至少派出一名士兵', 'error');
    I.$('#attackModal').classList.remove('open');
    I.toast('指令已下达，正在执行打击...', 'success', 1500);

    I.client.rpc('war_attack_v3', { p_attacker_id: profile.id, p_defender_id: currentTarget.id, p_troops: troopsPayload, p_region_code: currentTarget.region, p_mode: currentTarget.mode || 'conquer' }).then(function(res) {
      if (res.error) return I.toast('出错：' + res.error.message, 'error');
      var r = res.data; if (!r.ok) return I.toast(r.msg, 'error');

      var broadcastMsg = ''; var geoName = currentTarget.region ? `【${getGeoName(currentTarget.region)}】` : '';
      if (r.win) {
        if (currentTarget.mode === 'bomb') broadcastMsg = `【空袭警报】${profile.username} 对 ${currentTarget.name} 的 ${geoName} 发动了战略轰炸，敌方损失惨重！`;
        else if (currentTarget.mode === 'conquer') broadcastMsg = `【领土沦陷】${profile.username} 在 ${geoName} 击溃了 ${currentTarget.name}，成功占领该区域！`;
        else broadcastMsg = `【闪电突袭】${profile.username} 突袭了 ${currentTarget.name} 的 ${geoName}，掠夺大量财富后撤离！`;
        I.toast(`大获全胜！${r.details}`, 'success', 4000);
      } else {
        broadcastMsg = `【战败防线】${profile.username} 向 ${currentTarget.name} 的 ${geoName} 发起的进攻被成功拦截！`;
        I.toast('进攻失败：' + r.msg, 'error');
      }

      // 发送 WebSocket 消息
      if (ws && ws.readyState === WebSocket.OPEN) { 
        ws.send(JSON.stringify({ type: 'system', msg: broadcastMsg })); 
      }
      
      // 🚨 本地强制显示广播，保证自己一定能看到，且滚动在左侧终端
      showBroadcast(broadcastMsg);
      
      // 刷新军队数据
      loadData(); 
    });
  }

  window.surrender = function(defenderId, defenderName) {
    if (!confirm(`⚠️ 警告：确认向【${defenderName}】投降吗？\n强制结束战争，扣除 50,000 ₽ 赔偿金！`)) return;
    I.toast('正在递交投降书...', 'success', 1000);
    I.client.rpc('surrender_war', { p_winner_id: defenderId, p_loser_id: profile.id }).then(function(res) {
      if (res.error) return I.toast('投降失败：' + res.error.message, 'error');
      if (!res.data.ok) return I.toast(res.data.msg, 'error'); I.toast('已投降，战争结束', 'success'); loadData();
    });
  };

  window.negotiate = function(defenderId, defenderName) {
    if (!confirm(`确认向【${defenderName}】发送停战协议吗？`)) return;
    I.toast('正在发送请求...', 'success', 1000);
    I.client.rpc('request_peace', { p_from_id: profile.id, p_to_id: defenderId }).then(function(res) {
      if (res.error) return I.toast('发送失败: ' + res.error.message, 'error');
      if (!res.data.ok) return I.toast(res.data.msg, 'error'); I.toast('停战协议已发送', 'success');
    });
  };

  window.acceptPeace = function(reqId) {
    if (!confirm('确认同意停战吗？')) return;
    I.toast('正在处理...', 'success', 1000);
    I.client.rpc('accept_peace', { p_request_id: reqId }).then(function(res) {
      if (res.error) return I.toast('处理失败', 'error');
      if (!res.data.ok) return I.toast(res.data.msg, 'error'); I.toast('停战成功，战争结束', 'success'); loadData();
    });
  };
})();
</script>
</body>
</html>
