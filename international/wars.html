<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>战争系统 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<!-- 🚨 引入我们刚写的独立战争样式 -->
<link rel="stylesheet" href="assets/css/war.css">
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<section class="iecp-page-head">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb"><a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>战争系统</span></div>
    <div><h1><i class="fa-solid fa-satellite-dish"></i> 全球战术指挥中心</h1><p>点击地图领土，锁定目标并制定战术。</p></div>
  </div>
</section>

<main class="iecp-main">
  <div class="broadcast-bar" id="broadcastBar"><i class="fa-solid fa-tower-broadcast fa-fade"></i><span id="broadcastText"></span></div>
  
  <div class="war-map-container">
    <div class="radar-sweep"></div>
    <div class="intel-terminal">
      <div class="intel-title"><span>GLOBAL INTEL</span><i class="fa-solid fa-circle fa-fade" style="color:var(--red); font-size:8px; line-height:16px;"></i></div>
      <div class="intel-list" id="intelList">
        <div class="intel-item" style="color:var(--cyan);">[系统] 正在接入全球战术网络...</div>
      </div>
    </div>
    <div id="warMap"></div>
  </div>

  <h3 style="color:#fff; margin-bottom:12px; display:flex; align-items:center; gap:8px;">
    <i class="fa-solid fa-list-ul" style="color:var(--red);"></i> 交战国家列表
  </h3>
  <div id="warListWrap"><div class="loading-state"><div class="spinner"></div><span>正在侦察敌情...</span></div></div>
</main>

<!-- 战术选择弹窗 -->
<div class="tactical-modal" id="tacticalModal">
  <div class="tactical-box">
    <h2><i class="fa-solid fa-crosshairs"></i> 目标锁定：<span id="lockName" style="color:#fff;"></span></h2>
    <p>请选择本次军事行动。不同行动消耗的兵种不同。</p>
    <div class="tactic-options">
      <div class="tactic-card raid" onclick="selectTactic('raid')">
        <i class="fa-solid fa-hand-holding-dollar"></i>
        <div>
          <h3>闪电掠夺</h3>
          <span>抢掠资金和资源。战力越高抢得越多。</span>
        </div>
      </div>
      <div class="tactic-card conquer" onclick="selectTactic('conquer')">
        <i class="fa-solid fa-flag"></i>
        <div>
          <h3>全面征服</h3>
          <span>击败守军并占领该地块。战败全军覆没。</span>
        </div>
      </div>
      <div class="tactic-card bomb" onclick="selectTactic('bomb')">
        <i class="fa-solid fa-bomb"></i>
        <div>
          <h3>战略轰炸</h3>
          <span>仅限空军/导弹。毁坏敌国资源（自己不得）。</span>
        </div>
      </div>
    </div>
    <div style="text-align:right; margin-top:24px;">
      <button class="btn btn-ghost" onclick="document.getElementById('tacticalModal').classList.remove('open')">取消锁定</button>
    </div>
  </div>
</div>

<!-- 派兵弹窗 -->
<div class="iecp-modal" id="attackModal">
  <div class="iecp-modal-box glass-2" style="max-width:500px">
    <h3 id="attackTitle"><i class="fa-solid fa-bomb" style="color:var(--red)"></i> 作战部署</h3>
    <p class="modal-sub" id="attackDesc">选择要派出的兵力。</p>
    <div id="troopList" style="max-height: 45vh; overflow-y: auto; margin-bottom: 10px;"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(212,175,55,0.1); padding:12px 16px; border-radius:8px; border:1px solid rgba(212,175,55,0.3); margin-top: 15px; margin-bottom:20px;">
      <span style="font-size:14px; color:var(--gold-2);"><i class="fa-solid fa-bolt"></i> 我方出战总战力</span>
      <b id="attackPowerDisplay" style="font-size:22px; font-family:var(--mono); color:#fff;">0</b>
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="document.getElementById('attackModal').classList.remove('open')">取消</button>
      <button class="btn btn-red" id="confirmAttackBtn"><i class="fa-solid fa-crosshairs"></i> 执行作战</button>
    </div>
  </div>
</div>

<div class="lock-on-effect" id="lockOnEffect"></div>

  function getGeoName(code) {
    if (GEO_NAME_MAP[code]) return GEO_NAME_MAP[code];
    if (code.includes('Island') || code.includes('Is.')) return code.replace('Island', '群岛').replace('Is.', '群岛');
    if (code.includes('Sea')) return code.replace('Sea', '海域');
    return code + '地带'; 
  }

  function initMap() {
    myChart = echarts.init(document.getElementById('warMap'));
    
    myChart.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        formatter: function (params) {
          var cnName = getGeoName(params.name);
          if (!params.data || !params.data.customData) return cnName + '<br/><span style="color:#94a3b8">无主之地</span>';
          return cnName + '<br/>归属：<span style="color:#d4af37; font-weight:bold;">' + params.data.customData.ownerName + '</span>';
        },
        backgroundColor: 'rgba(15, 23, 42, 0.95)', borderColor: '#4fc3f7', textStyle: { color: '#fff' }
      },
      geo: {
        map: 'world', roam: true, zoom: 1.2,
        label: {
          normal: { show: false }, 
          emphasis: { show: false }
        },
        itemStyle: { 
          normal: { areaColor: '#1e293b', borderColor: '#334155', borderWidth: 1 },
          emphasis: { areaColor: '#4fc3f7' } 
        }
      }
    });

    myChart.on('click', function (params) {
      if (!params.name) return;
      var region = params.name;
      var geoName = getGeoName(region);
      var record = allTerritories.find(t => t.region_code === region);
      
      if (!record) {
        var myLands = allTerritories.filter(t => t.owner_id === profile.id);
        if (myLands.length >= 2) {
          I.toast(`【${geoName}】为无主之地。但你已经拥有2块领土，无法再直接认领！请向其他国家购买。`, 'error', 4000);
          return;
        }
        
        var costText = myLands.length === 0 ? '首块领土免费！' : '这是你的第二块领土，需支付 20,000 ₽。';
        if (!confirm(`是否认领【${geoName}】？\n\n提示：${costText}`)) return;
        
        I.toast('正在签署领土协议...', 'success', 1000);
        I.client.rpc('claim_territory', { p_user_id: profile.id, p_region_code: region, p_region_name: geoName }).then(function(res){
          if(res.error) return I.toast(res.error.message, 'error');
          if(!res.data.ok) return I.toast(res.data.msg, 'error');
          I.toast(res.data.msg, 'success');
          loadData();
        });

      } else if (record.owner_id === profile.id) {
        I.toast(`【${geoName}】是你国的领土。`, 'success');
      } else if (allEnemiesIds.includes(record.owner_id)) {
        var enemyObj = enemies.find(e => e.id === record.owner_id);
        currentTarget = { id: record.owner_id, region: region, name: enemyObj ? enemyObj.username : '敌国', mode: null };
        document.getElementById('lockName').innerText = geoName;
        document.getElementById('tacticalModal').classList.add('open');
      } else {
        var ownerName = params.data && params.data.customData ? params.data.customData.ownerName : '该国';
        var price = prompt(`你想花多少钱购买【${geoName}】（属于 ${ownerName}）？\n请输入金额（₽）：`, "50000");
        if (!price || isNaN(price) || price <= 0) return;
        
        I.client.from('diplomacy_requests').insert({
          from_country: profile.id, to_country: record.owner_id, request_type: 'buy_territory',
          message: `申请购买你的【${geoName}】领土，出价 ${price} ₽。`,
          extra_data: { region_code: region, price: parseInt(price) }
        }).then(function(r){
          if(r.error) return I.toast('发送失败：' + r.error.message, 'error');
          I.toast('购买请求已发送！', 'success');
        });
      }
    });

    window.addEventListener('resize', function() { if(myChart) myChart.resize(); });
  }

  window.selectTactic = function(mode) {
    currentTarget.mode = mode;
    document.getElementById('tacticalModal').classList.remove('open');
    var eff = document.getElementById('lockOnEffect');
    eff.classList.add('active');
    setTimeout(function(){ eff.classList.remove('active'); openAttackModal(currentTarget.id, currentTarget.name, currentTarget.region, mode); }, 800);
  };

  function connectWebSocket() {
    try {
      ws = new WebSocket('wss://iecp-api.ponxigrad.tech/ws/'); 
      ws.onmessage = function(event) {
        try {
          var data = JSON.parse(event.data);
          if (data.type === 'system') {
            var bar = I.$('#broadcastBar'); var txt = I.$('#broadcastText');
            txt.textContent = data.msg; bar.style.display = 'flex';
            clearTimeout(window.warBcTimer);
            window.warBcTimer = setTimeout(function(){ bar.style.display = 'none'; }, 8000);
          }
        } catch (e) {}
      };
    } catch (err) {}
  }

  function loadData() {
    Promise.all([
      I.client.from('military').select('*').eq('country_id', profile.id).maybeSingle(),
      I.client.from('relations').select('*').eq('relation_type', 'war'),
      I.client.from('relations').select('*').eq('relation_type', 'ally'),
      I.client.from('diplomacy_requests').select('*').eq('to_country', profile.id).eq('request_type', 'peace').eq('status', 'pending'),
      I.client.from('territories').select('*'),
      I.client.from('profiles').select('id, username, flag_url')
    ]).then(function(results) {
      myMil = results[0].data || {};
      var allWars = results[1].data || [];
      var allAllies = results[2].data || [];
      peaceRequests = results[3].data || [];
      allTerritories = results[4].data || [];
      var profiles = results[5].data || [];

      allEnemiesIds = [];
      var myWars = allWars.filter(function(r) {
        var enemyId = r.country_a === profile.id ? r.country_b : r.country_a;
        allEnemiesIds.push(enemyId);
        return r.country_a === profile.id || r.country_b === profile.id;
      });

      allAlliesIds = [];
      allAllies.forEach(function(r) {
        allAlliesIds.push(r.country_a === profile.id ? r.country_b : r.country_a);
      });

      var regionsConfig = [];
      allTerritories.forEach(function(t) {
        var color = '#334155';
        if (t.owner_id === profile.id) color = 'rgba(212, 175, 55, 0.85)';
        else if (allEnemiesIds.includes(t.owner_id)) color = 'rgba(239, 68, 68, 0.85)';
        else if (allAlliesIds.includes(t.owner_id)) color = 'rgba(34, 197, 94, 0.85)';

        var ownerObj = profiles.find(p => p.id === t.owner_id);
        var ownerName = ownerObj ? ownerObj.username : '未知';

        regionsConfig.push({
          name: t.region_code,
          itemStyle: { 
            normal: { areaColor: color }, 
            emphasis: { areaColor: color } 
          },
          label: { 
            normal: { 
              show: true, 
              formatter: ownerName, 
              color: '#fff', 
              fontSize: 10, 
              fontWeight: 'bold',
              textShadowColor: '#000', 
              textShadowBlur: 3 
            },
            emphasis: {
              show: true,
              formatter: ownerName, 
              color: '#fff'
            }
          },
          customData: { ownerName: ownerName, ownerId: t.owner_id }
        });
      });
      if(myChart) myChart.setOption({ geo: { regions: regionsConfig } });

      if (myWars.length === 0) {
        I.$('#warListWrap').innerHTML = `<div class="empty-state glass"><i class="fa-solid fa-dove" style="color:var(--cyan);font-size:40px;margin-bottom:12px;"></i><p>目前世界和平，没有敌对国家。</p></div>`;
        return;
      }

      I.client.from('profiles').select('id, username, flag_url').in('id', allEnemiesIds).then(function(res) {
        enemies = res.data || [];
        renderEnemies();
      });
    });
  }

  function renderEnemies() {
    var html = '<div class="war-grid">';
    enemies.forEach(function(e) {
      var avatar = e.flag_url || I.avatarFallback(e.username);
      var pReq = peaceRequests.find(r => r.from_country === e.id);
      var peaceRequestHtml = '';
      
      if (pReq) {
        peaceRequestHtml = `
          <div class="peace-request-box">
            <span><i class="fa-solid fa-handshake"></i> 对方申请停战</span>
            <button class="btn-accept-peace" onclick="acceptPeace('${pReq.id}')">同意</button>
          </div>
        `;
      }

      html += `
        <div class="enemy-card">
          ${peaceRequestHtml}
          <div class="enemy-header">
            <img src="${I.escapeHtml(avatar)}" class="enemy-avatar">
            <div>
              <div style="font-size:16px;font-weight:700;color:#fff;">${I.escapeHtml(e.username)}</div>
              <div style="font-size:12px;color:#ef4444;"><i class="fa-solid fa-crosshairs"></i> 交战中</div>
            </div>
          </div>
          <div style="background: rgba(0,0,0,0.2); padding: 16px; border-radius: 8px; text-align: center;">
             <button class="btn-attack-main" onclick="openAttackModal('${e.id}', '${I.escapeHtml(e.username)}', null, 'raid')"><i class="fa-solid fa-bomb"></i> 发动突袭</button>
          </div>
          <div class="peace-actions">
            <button class="btn btn-surrender" onclick="surrender('${e.id}', '${I.escapeHtml(e.username)}')"><i class="fa-solid fa-flag"></i> 投降</button>
            <button class="btn btn-negotiate" onclick="negotiate('${e.id}', '${I.escapeHtml(e.username)}')"><i class="fa-solid fa-handshake"></i> 协商停战</button>
          </div>
        </div>
      `;
    });
    html += '</div>';
    I.$('#warListWrap').innerHTML = html;
  }

  function loadIntelLogs() {
    I.client.from('war_logs').select('*').order('created_at', { ascending: false }).limit(5).then(function(res){
      var logs = res.data || [];
      var html = '';
      logs.forEach(function(l) {
        var resColor = l.result === 'win' ? 'win' : 'lose';
        var aName = l.attacker_name || '某国';
        var dName = l.defender_name || '某国';
        var rName = getGeoName(l.region_name) || '边境地带';
        
        var actionName = l.mode === 'bomb' ? '战略轰炸' : (l.mode === 'raid' ? '闪电掠夺' : '全面入侵');
        var resultText = l.result === 'win' ? `成功实施了${actionName}` : `企图实施${actionName}但被击退`;
        var detailText = l.details ? `<br/><span style="color:var(--muted-2);">${l.details}</span>` : '';

        html += `<div class="intel-item">[战报] <span class="${resColor}">${aName}</span> 在 ${rName} 对 ${dName} ${resultText}。${detailText}</div>`;
      });
      if(!html) html = '<div class="intel-item" style="color:var(--cyan);">[系统] 全球区域暂时和平。</div>';
      document.getElementById('intelList').innerHTML = html;
    });
  }

  window.openAttackModal = function(defenderId, defenderName, regionCode, mode) {
    currentTarget = { id: defenderId, name: defenderName, region: regionCode, mode: mode };
    
    var modeName = mode === 'raid' ? '闪电掠夺' : (mode === 'conquer' ? '全面征服' : '战略轰炸');
    var descHtml = `向 <b style="color:var(--red)">${I.escapeHtml(defenderName)}</b> 执行【${modeName}】。`;
    if (regionCode) {
      descHtml += `<br/><span style="color:var(--gold);">目标地块：${getGeoName(regionCode)}</span>`;
      if (mode === 'bomb') {
        descHtml += `<br/><span style="color:#ef4444; font-size:12px;">轰炸仅允许选择空军和导弹部队。</span>`;
      } else if (mode === 'conquer') {
        descHtml += `<br/><span style="color:#ef4444; font-size:12px;">战胜将直接占领该地块！</span>`;
      }
    }
    I.$('#attackDesc').innerHTML = descHtml;
    
    var listHtml = '';
    for (var key in UNITS_DICT) {
      var count = myMil[key] || 0;
      var u = UNITS_DICT[key];
      if (count <= 0) continue;

      if (mode === 'bomb' && u.type !== 'air') continue;

      listHtml += `
        <div class="troop-select-row">
          <div class="troop-info">
            <div class="troop-icon"><i class="fa-solid ${u.icon}"></i></div>
            <div>
              <div class="troop-name">${u.name} <span style="font-size:11px;color:var(--gold-2);">(战力${u.power})</span></div>
              <div class="troop-have">可用: ${I.fmtNumber(count)}</div>
            </div>
          </div>
          <input type="number" class="troop-input" id="atk_${key}" value="0" min="0" max="${count}" 
                 data-power="${u.power}" oninput="calcPower()">
        </div>
      `;
    }

    if (!listHtml) {
      I.toast(mode === 'bomb' ? '你没有可执行轰炸的空军或导弹！' : '你没有任何进攻部队！', 'error');
      return;
    }

    I.$('#troopList').innerHTML = listHtml;
    I.$('#attackPowerDisplay').textContent = '0';
    
    var quickFillHtml = `<div style="text-align:right; margin-bottom:10px;"><a href="javascript:void(0)" onclick="fillAllTroops()" style="font-size:12px; color:var(--cyan);">一键全军出击</a></div>`;
    I.$('#troopList').insertAdjacentHTML('afterbegin', quickFillHtml);

    I.$('#confirmAttackBtn').onclick = doAttack;
    I.$('#attackModal').classList.add('open');
  };

  window.fillAllTroops = function() {
    document.querySelectorAll('.troop-input').forEach(function(input) {
      if (parseInt(input.max) > 0) { input.value = input.max; }
    });
    calcPower();
  };

  window.calcPower = function() {
    var totalPower = 0;
    document.querySelectorAll('.troop-input').forEach(function(input) {
      var val = parseInt(input.value) || 0;
      var power = parseInt(input.getAttribute('data-power')) || 0;
      totalPower += val * power;
    });
    I.$('#attackPowerDisplay').textContent = I.fmtNumber(totalPower);
  };

  function doAttack() {
    var troopsPayload = {};
    var hasTroop = false;
    
    document.querySelectorAll('.troop-input').forEach(function(input) {
      var val = parseInt(input.value) || 0;
      if (val > 0) {
        var key = input.id.replace('atk_', '');
        troopsPayload[key] = val;
        hasTroop = true;
      }
    });

    if (!hasTroop) return I.toast('请至少派出一名士兵', 'error');
    I.$('#attackModal').classList.remove('open');
    I.toast('指令已下达，正在执行打击...', 'success', 1500);

    I.client.rpc('war_attack_v3', {
      p_attacker_id: profile.id,
      p_defender_id: currentTarget.id,
      p_troops: troopsPayload,
      p_region_code: currentTarget.region,
      p_mode: currentTarget.mode || 'conquer'
    }).then(function(res) {
      if (res.error) return I.toast('出错：' + res.error.message, 'error');
      var r = res.data;
      if (!r.ok) return I.toast(r.msg, 'error');

      var broadcastMsg = '';
      var geoName = currentTarget.region ? `【${getGeoName(currentTarget.region)}】` : '';
      
      if (r.win) {
        if (currentTarget.mode === 'bomb') {
          broadcastMsg = `【空袭警报】${profile.username} 对 ${currentTarget.name} 的 ${geoName} 发动了战略轰炸，敌方损失惨重！`;
        } else if (currentTarget.mode === 'conquer') {
          broadcastMsg = `【领土沦陷】${profile.username} 在 ${geoName} 击溃了 ${currentTarget.name}，成功占领该区域！`;
        } else {
          broadcastMsg = `【闪电突袭】${profile.username} 突袭了 ${currentTarget.name} 的 ${geoName}，掠夺大量财富后撤离！`;
        }
        
        I.toast(`大获全胜！${r.details}`, 'success', 4000);
      } else {
        broadcastMsg = `【战败防线】${profile.username} 向 ${currentTarget.name} 的 ${geoName} 发起的进攻被成功拦截！`;
        I.toast('进攻失败：' + r.msg, 'error');
      }

      if (ws && ws.readyState === WebSocket.OPEN) {
         ws.send(JSON.stringify({ type: 'system', msg: broadcastMsg }));
      }
      
      loadData();
      loadIntelLogs();
    });
  }

  window.surrender = function(defenderId, defenderName) {
    if (!confirm(`⚠️ 警告：确认向【${defenderName}】投降吗？\n强制结束战争，扣除 50,000 ₽ 赔偿金！`)) return;
    I.toast('正在递交投降书...', 'success', 1000);
    I.client.rpc('surrender_war', { p_winner_id: defenderId, p_loser_id: profile.id }).then(function(res) {
      if (res.error) return I.toast('投降失败：' + res.error.message, 'error');
      if (!res.data.ok) return I.toast(res.data.msg, 'error');
      I.toast('已投降，战争结束', 'success');
      loadData();
    });
  };

  window.negotiate = function(defenderId, defenderName) {
    if (!confirm(`确认向【${defenderName}】发送停战协议吗？`)) return;
    I.toast('正在发送请求...', 'success', 1000);
    I.client.rpc('request_peace', { p_from_id: profile.id, p_to_id: defenderId }).then(function(res) {
      if (res.error) return I.toast('发送失败: ' + res.error.message, 'error');
      if (!res.data.ok) return I.toast(res.data.msg, 'error');
      I.toast('停战协议已发送', 'success');
    });
  };

  window.acceptPeace = function(reqId) {
    if (!confirm('确认同意停战吗？')) return;
    I.toast('正在处理...', 'success', 1000);
    I.client.rpc('accept_peace', { p_request_id: reqId }).then(function(res) {
      if (res.error) return I.toast('处理失败', 'error');
      if (!res.data.ok) return I.toast(res.data.msg, 'error');
      I.toast('停战成功，战争结束', 'success');
      loadData();
    });
  };

})();
</script>
</body>
</html>
