<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>战争系统 · IECP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .war-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-top: 24px; }
  .enemy-card { background: var(--glass-2); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  
  .enemy-header { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .enemy-avatar { width: 48px; height: 32px; border-radius: 4px; object-fit: cover; border: 1px solid #ef4444; }
  
  .btn-attack-main { width: 100%; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
  .btn-attack-main:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(239,68,68,0.4); }

  .peace-actions { display: flex; gap: 10px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 16px; margin-top: auto; }
  .peace-actions .btn { flex: 1; padding: 10px 0; font-size: 13px; border-radius: 6px; }
  .btn-surrender { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
  .btn-surrender:hover { background: #ef4444; color: #fff; }
  .btn-negotiate { background: rgba(79,195,247,0.1); color: var(--cyan); border: 1px solid rgba(79,195,247,0.3); }
  .btn-negotiate:hover { background: var(--cyan); color: #000; }

  .peace-request-box { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .peace-request-box span { color: #22c55e; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; flex: 1; }
  .btn-accept-peace { flex-shrink: 0; padding: 6px 16px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; border: none; background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; transition: all 0.2s; }
  .btn-accept-peace:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,197,94,0.6); }

  .broadcast-bar { background: linear-gradient(90deg, rgba(239,68,68,0.2), rgba(0,0,0,0)); border-left: 4px solid #ef4444; padding: 14px 20px; border-radius: 8px; margin-bottom: 24px; color: #fca5a5; font-size: 15px; font-weight: 600; display: none; align-items: center; gap: 10px; }

  /* 🚨 派兵弹窗列表样式 */
  .troop-select-row { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); }
  .troop-info { display: flex; align-items: center; gap: 12px; }
  .troop-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(0,0,0,0.3); display: grid; place-items: center; color: var(--gold); }
  .troop-name { font-size: 14px; font-weight: bold; color: #fff; }
  .troop-have { font-size: 12px; color: var(--muted); }
  .troop-input { width: 80px; padding: 8px; text-align: center; border-radius: 6px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-2); color: #fff; font-weight: bold; }
  
  /* 🚨 国防展示区 */
  .defense-display {
    background: rgba(79,195,247,0.1); border: 1px solid rgba(79,195,247,0.3);
    padding: 12px 16px; border-radius: 8px; font-size: 13px; color: var(--cyan);
    display: flex; align-items: center; gap: 10px; margin-top: 15px;
  }
</style>
</head>
<body>

<header class="iecp-topbar">
  <div class="iecp-topbar-inner">
    <a class="iecp-logo" href="index.html"><img src="photo/un.png" alt="IECP"><div class="iecp-logo-text"><b>IECP</b><span>Exchange &amp; Cooperation</span></div></a>
    <nav class="iecp-nav" id="iecp-nav"></nav>
    <div class="iecp-user" id="iecp-user"></div>
  </div>
</header>

<section class="iecp-page-head">
  <div class="iecp-page-head-inner">
    <div class="iecp-breadcrumb"><a href="index.html">首页</a><i class="fa-solid fa-chevron-right"></i><span>战争系统</span></div>
    <div><h1><i class="fa-solid fa-shield-halved"></i> 战争大厅</h1><p>指挥你的军队，掠夺敌国的财富！</p></div>
  </div>
</section>

<main class="iecp-main">
  <div class="broadcast-bar" id="broadcastBar"><i class="fa-solid fa-tower-broadcast fa-fade"></i><span id="broadcastText"></span></div>
  <div id="warListWrap"><div class="loading-state"><div class="spinner"></div><span>正在侦察敌情...</span></div></div>
</main>

<!-- 🚨 派兵出击弹窗 -->
<div class="iecp-modal" id="attackModal">
  <div class="iecp-modal-box glass-2" style="max-width:500px">
    <h3 id="attackTitle"><i class="fa-solid fa-bomb" style="color:var(--red)"></i> 发动突袭</h3>
    <p class="modal-sub" id="attackDesc">选择要派出的兵力。如果战败，出征部队将全军覆没。</p>
    
    <div id="troopList" style="max-height: 45vh; overflow-y: auto; margin-bottom: 10px;">
      <!-- 动态渲染你的进攻兵种 -->
    </div>

    <!-- 防御建筑展示区 -->
    <div class="defense-display" id="defenseDisplay">
      <!-- 动态渲染防御战力 -->
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(212,175,55,0.1); padding:12px 16px; border-radius:8px; border:1px solid rgba(212,175,55,0.3); margin-top: 15px; margin-bottom:20px;">
      <span style="font-size:14px; color:var(--gold-2);"><i class="fa-solid fa-bolt"></i> 本次出战总战力</span>
      <b id="attackPowerDisplay" style="font-size:22px; font-family:var(--mono); color:#fff;">0</b>
    </div>

    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="document.getElementById('attackModal').classList.remove('open')">取消</button>
      <button class="btn btn-red" id="confirmAttackBtn"><i class="fa-solid fa-crosshairs"></i> 确认出击</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var I = IECP;
  var profile = null;
  var myMil = null;
  var enemies = [];
  var peaceRequests = [];
  var ws = null;
  var currentTarget = null;

  // 🚨 核心修复：把兵种区分为 attack 和 defense
  var UNITS_DICT = {
    // --- 进攻 ---
    scouts: { name: '侦察兵', icon: 'fa-binoculars', power: 1, category: 'attack' },
    infantry: { name: '机械化步兵', icon: 'fa-person-rifle', power: 3, category: 'attack' },
    artillery: { name: '自行火炮', icon: 'fa-bomb', power: 8, category: 'attack' },
    tanks: { name: '主战坦克', icon: 'fa-truck-monster', power: 15, category: 'attack' },
    aav: { name: '防空战车', icon: 'fa-crosshairs', power: 12, category: 'attack' },
    mechs: { name: '机甲战士', icon: 'fa-robot', power: 35, category: 'attack' },
    missiles: { name: '洲际导弹', icon: 'fa-rocket', power: 100, category: 'attack' },
    patrol_boats: { name: '巡逻艇', icon: 'fa-sailboat', power: 5, category: 'attack' },
    frigates: { name: '导弹护卫舰', icon: 'fa-anchor', power: 20, category: 'attack' },
    submarines: { name: '攻击核潜艇', icon: 'fa-water', power: 40, category: 'attack' },
    destroyers: { name: '驱逐舰', icon: 'fa-ship', power: 50, category: 'attack' },
    cruisers: { name: '导弹巡洋舰', icon: 'fa-shield-ship', power: 80, category: 'attack' },
    amphibious: { name: '两栖攻击舰', icon: 'fa-ship', power: 120, category: 'attack' },
    carriers: { name: '核动力航母', icon: 'fa-ship', power: 300, category: 'attack' },
    drones: { name: '侦察无人机', icon: 'fa-plane-up', power: 3, category: 'attack' },
    fighters: { name: '第四代战机', icon: 'fa-jet-fighter', power: 25, category: 'attack' },
    stealth_air: { name: '第五代隐身战机', icon: 'fa-jet-fighter-up', power: 60, category: 'attack' },
    bombers: { name: '战略轰炸机', icon: 'fa-plane', power: 90, category: 'attack' },
    ew_planes: { name: '电子战机', icon: 'fa-satellite-dish', power: 70, category: 'attack' },
    gunships: { name: '重型炮艇机', icon: 'fa-plane-circle-check', power: 55, category: 'attack' },
    spaceplanes: { name: '空天战机', icon: 'fa-meteor', power: 500, category: 'attack' },
    
    // --- 防御 (不能被派出去) ---
    trenches: { name: '反坦克战壕', icon: 'fa-bars-staggered', power: 2, category: 'defense' },
    bunkers: { name: '地下碉堡', icon: 'fa-torii-gate', power: 8, category: 'defense' },
    aaa: { name: '防空导弹', icon: 'fa-rocket', power: 20, category: 'defense' },
    coastal_guns: { name: '岸防巨炮', icon: 'fa-explosion', power: 30, category: 'defense' },
    lasers: { name: '高能激光塔', icon: 'fa-bolt', power: 50, category: 'defense' },
    railguns: { name: '电磁轨道炮', icon: 'fa-atom', power: 80, category: 'defense' },
    shields: { name: '战略护盾', icon: 'fa-shield', power: 200, category: 'defense' }
  };

  I.requireAuth().then(function (ok) {
    if (!ok) return;
    I.initTopbar('wars');
    I.getProfile(true).then(function (p) {
      profile = p;
      connectWebSocket();
      loadData();
    });
  });

  function connectWebSocket() {
    try {
      ws = new WebSocket('wss://iecp-api.ponxigrad.tech/ws/'); 
      ws.onmessage = function(event) {
        try {
          var data = JSON.parse(event.data);
          if (data.type === 'system') {
            var bar = I.$('#broadcastBar'); var txt = I.$('#broadcastText');
            txt.textContent = data.msg; bar.style.display = 'flex';
            clearTimeout(window.warBcTimer);
            window.warBcTimer = setTimeout(function(){ bar.style.display = 'none'; }, 8000);
          }
        } catch (e) {}
      };
    } catch (err) {}
  }

  function loadData() {
    Promise.all([
      I.client.from('military').select('*').eq('country_id', profile.id).maybeSingle(),
      I.client.from('relations').select('*').eq('relation_type', 'war'),
      I.client.from('diplomacy_requests').select('*').eq('to_country', profile.id).eq('request_type', 'peace').eq('status', 'pending')
    ]).then(function(results) {
      myMil = results[0].data || {};
      var allWars = results[1].data || [];
      peaceRequests = results[2].data || [];

      var myWars = allWars.filter(function(r) {
        return r.country_a === profile.id || r.country_b === profile.id;
      });

      if (myWars.length === 0) {
        I.$('#warListWrap').innerHTML = `<div class="empty-state glass"><i class="fa-solid fa-dove" style="color:var(--cyan);font-size:40px;margin-bottom:12px;"></i><p>目前世界和平，没有敌对国家。</p></div>`;
        return;
      }

      var enemyIds = myWars.map(function(r) {
        return r.country_a === profile.id ? r.country_b : r.country_a;
      });

      I.client.from('profiles').select('id, username, flag_url').in('id', enemyIds).then(function(res) {
        enemies = res.data || [];
        renderEnemies();
      });
    });
  }

  function renderEnemies() {
    var html = '<div class="war-grid">';
    
    enemies.forEach(function(e) {
      var avatar = e.flag_url || I.avatarFallback(e.username);
      var pReq = peaceRequests.find(r => r.from_country === e.id);
      var peaceRequestHtml = '';
      
      if (pReq) {
        peaceRequestHtml = `
          <div class="peace-request-box">
            <span><i class="fa-solid fa-handshake"></i> 对方申请停战</span>
            <button class="btn-accept-peace" onclick="acceptPeace('${pReq.id}')">同意</button>
          </div>
        `;
      }

      html += `
        <div class="enemy-card">
          ${peaceRequestHtml}
          <div class="enemy-header">
            <img src="${I.escapeHtml(avatar)}" class="enemy-avatar">
            <div>
              <div style="font-size:16px;font-weight:700;color:#fff;">${I.escapeHtml(e.username)}</div>
              <div style="font-size:12px;color:#ef4444;"><i class="fa-solid fa-crosshairs"></i> 交战中</div>
            </div>
          </div>
          
          <div style="background: rgba(0,0,0,0.2); padding: 16px; border-radius: 8px; text-align: center;">
             <button class="btn-attack-main" onclick="openAttackModal('${e.id}', '${I.escapeHtml(e.username)}')">
               <i class="fa-solid fa-bomb"></i> 发动突袭
             </button>
          </div>

          <div class="peace-actions">
            <button class="btn btn-surrender" onclick="surrender('${e.id}', '${I.escapeHtml(e.username)}')"><i class="fa-solid fa-flag"></i> 投降 (赔5万)</button>
            <button class="btn btn-negotiate" onclick="negotiate('${e.id}', '${I.escapeHtml(e.username)}')"><i class="fa-solid fa-handshake"></i> 协商停战</button>
          </div>
        </div>
      `;
    });
    html += '</div>';
    I.$('#warListWrap').innerHTML = html;
  }

  // 🚨 打开派兵弹窗
  window.openAttackModal = function(defenderId, defenderName) {
    currentTarget = { id: defenderId, name: defenderName };
    I.$('#attackDesc').innerHTML = `向 <b style="color:var(--red)">${I.escapeHtml(defenderName)}</b> 发动突袭。如果战败，出征部队将全军覆没。`;
    
    var listHtml = '';
    var hasTroops = false;
    var defensePower = 0;
    var defenseCount = 0;

    // 遍历全部兵种
    for (var key in UNITS_DICT) {
      var count = myMil[key] || 0;
      var u = UNITS_DICT[key];

      // 🚨 分离逻辑：如果是防御建筑，累加防御战力，不加入派兵列表
      if (u.category === 'defense') {
        if (count > 0) {
          defensePower += count * u.power;
          defenseCount += count;
        }
        continue;
      }

      // 进攻兵种：只显示大于 0 的
      if (count > 0) {
        hasTroops = true;
        listHtml += `
          <div class="troop-select-row">
            <div class="troop-info">
              <div class="troop-icon"><i class="fa-solid ${u.icon}"></i></div>
              <div>
                <div class="troop-name">${u.name} <span style="font-size:11px;color:var(--gold-2);">(战力${u.power})</span></div>
                <div class="troop-have">可用: ${I.fmtNumber(count)}</div>
              </div>
            </div>
            <input type="number" class="troop-input" id="atk_${key}" value="0" min="0" max="${count}" 
                   data-power="${u.power}" oninput="calcPower()">
          </div>
        `;
      }
    }

    if (!hasTroops) {
      I.toast('你还没有任何进攻部队，快去军工厂制造吧！', 'error');
      return;
    }

    I.$('#troopList').innerHTML = listHtml;
    I.$('#attackPowerDisplay').textContent = '0';
    
    // 🚨 渲染防御战力展示
    if (defenseCount > 0) {
      I.$('#defenseDisplay').innerHTML = `
        <i class="fa-solid fa-shield-halved" style="font-size:18px;"></i>
        <div>
          <div style="font-weight:bold; color:#fff;">国防驻军已就位</div>
          <div>共有 ${defenseCount} 座防御工事，为您提供 ${I.fmtNumber(defensePower)} 点战力保护。</div>
        </div>
      `;
      I.$('#defenseDisplay').style.display = 'flex';
    } else {
      I.$('#defenseDisplay').style.display = 'none';
    }

    // 快速满兵按钮
    var quickFillHtml = `<div style="text-align:right; margin-bottom:10px;"><a href="javascript:void(0)" onclick="fillAllTroops()" style="font-size:12px; color:var(--cyan);">一键全军出击</a></div>`;
    I.$('#troopList').insertAdjacentHTML('afterbegin', quickFillHtml);

    I.$('#confirmAttackBtn').onclick = doAttack;
    I.$('#attackModal').classList.add('open');
  };

  // 一键填满兵力
  window.fillAllTroops = function() {
    for (var key in UNITS_DICT) {
      var u = UNITS_DICT[key];
      if (u.category === 'defense') continue; // 防御建筑直接跳过
      
      var input = I.$('#atk_' + key);
      if (input && parseInt(input.max) > 0) {
        input.value = input.max;
      }
    }
    calcPower();
  };

  // 实时计算战力
  window.calcPower = function() {
    var totalPower = 0;
    var inputs = document.querySelectorAll('.troop-input');
    inputs.forEach(function(input) {
      var val = parseInt(input.value) || 0;
      var power = parseInt(input.getAttribute('data-power')) || 0;
      totalPower += val * power;
    });
    I.$('#attackPowerDisplay').textContent = I.fmtNumber(totalPower);
  };

  // 确认出击
  function doAttack() {
    var troopsPayload = {};
    var hasTroop = false;
    var inputs = document.querySelectorAll('.troop-input');
    
    inputs.forEach(function(input) {
      var val = parseInt(input.value) || 0;
      if (val > 0) {
        var key = input.id.replace('atk_', '');
        troopsPayload[key] = val;
        hasTroop = true;
      }
    });

    if (!hasTroop) return I.toast('请至少派出一名士兵', 'error');
    I.$('#attackModal').classList.remove('open');
    I.toast('战争机器启动，正在交火...', 'success', 1500);

    I.client.rpc('attack_country_v2', {
      p_attacker_id: profile.id,
      p_defender_id: currentTarget.id,
      p_troops: troopsPayload
    }).then(function(res) {
      if (res.error) return I.toast('出错：' + res.error.message, 'error');
      var r = res.data;
      if (!r.ok) return I.toast(r.msg, 'error');

      var broadcastMsg = '';
      if (r.win) {
        broadcastMsg = `【胜】战报：${profile.username} 突袭 ${currentTarget.name} 大获全胜！掠夺 ${I.fmtNumber(r.loot)} ₽！(战力: ${r.a_power} vs ${r.d_power})`;
        I.toast(`大获全胜！掠夺了 ${I.fmtNumber(r.loot)} ₽`, 'success');
      } else {
        broadcastMsg = `【败】战报：${profile.username} 突袭 ${currentTarget.name} 失败，出征部队全军覆没。(战力: ${r.a_power} vs ${r.d_power})`;
        I.toast('进攻失败，我军损失惨重', 'error');
      }

      if (ws && ws.readyState === WebSocket.OPEN) {
         ws.send(JSON.stringify({ type: 'system', msg: broadcastMsg }));
      }
      loadData();
    });
  }

  // 投降与停战逻辑
  window.surrender = function(defenderId, defenderName) {
    if (!confirm(`⚠️ 警告：确认向【${defenderName}】投降吗？\n强制结束战争，扣除 50,000 ₽ 赔偿金！`)) return;
    I.toast('正在递交投降书...', 'success', 1000);
    I.client.rpc('surrender_war', { p_winner_id: defenderId, p_loser_id: profile.id }).then(function(res) {
      if (res.error) return I.toast('投降失败：' + res.error.message, 'error');
      if (!res.data.ok) return I.toast(res.data.msg, 'error');
      I.toast('已投降，战争结束', 'success');
      loadData();
    });
  };

  window.negotiate = function(defenderId, defenderName) {
    if (!confirm(`确认向【${defenderName}】发送停战协议吗？`)) return;
    I.toast('正在发送请求...', 'success', 1000);
    I.client.rpc('request_peace', { p_from_id: profile.id, p_to_id: defenderId }).then(function(res) {
      if (res.error) return I.toast('发送失败: ' + res.error.message, 'error');
      if (!res.data.ok) return I.toast(res.data.msg, 'error');
      I.toast('停战协议已发送', 'success');
    });
  };

  window.acceptPeace = function(reqId) {
    if (!confirm('确认同意停战吗？')) return;
    I.toast('正在处理...', 'success', 1000);
    I.client.rpc('accept_peace', { p_request_id: reqId }).then(function(res) {
      if (res.error) return I.toast('处理失败', 'error');
      if (!res.data.ok) return I.toast(res.data.msg, 'error');
      I.toast('停战成功，战争结束', 'success');
      loadData();
    });
  };

})();
</script>
</body>
</html>
